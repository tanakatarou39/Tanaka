<title>ひとしずくの旅</title>
<meta name="description" content="一滴の光が海から空へ、雨となって大地に落ち、木となり、星になり、また海へ還る。約3分の連続アニメーション。">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,300;1,400&family=Shippori+Mincho:wght@400;500&display=swap">
<style>
  /* Layout: one full-bleed canvas; captions float low-centre; title card + transport fade in/out. */
  :root {
    --void: #02040a;
    --ink: #eaf4ff;
    --ink-dim: rgba(234, 244, 255, 0.62);
    --glow: #9fe4ff;
    --line: rgba(234, 244, 255, 0.22);
    --font-jp: "Shippori Mincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", "IPAexMincho", "IPAMincho", serif;
    --font-en: "Cormorant Garamond", "Iowan Old Style", Georgia, serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--void); color: var(--ink); overflow: hidden; color-scheme: dark; }
  body { font-family: var(--font-jp); -webkit-tap-highlight-color: transparent; }
  #stage { position: fixed; inset: 0; background: var(--void); }
  #c { display: block; position: absolute; inset: 0; width: 100%; height: 100%; }

  /* captions: phrases never break mid-word; a soft dark scrim + tight shadow keep them legible over bright scenes */
  #captions { position: fixed; left: 0; right: 0; bottom: calc(12vh + env(safe-area-inset-bottom, 0px)); padding: 0 max(5vw, env(safe-area-inset-left, 0px)) 0 max(5vw, env(safe-area-inset-right, 0px)); text-align: center; pointer-events: none; }
  #captions .box { position: relative; display: inline-block; max-width: 100%; box-sizing: border-box; padding: 0.7em 1.3em 0.6em; isolation: isolate; }
  #captions .box::before { content: ""; position: absolute; inset: -0.7em -1.5em; z-index: -1; border-radius: 50%; opacity: var(--scrim, 0); background: radial-gradient(closest-side, rgba(3, 10, 26, 0.42), rgba(3, 10, 26, 0.24) 50%, rgba(3, 10, 26, 0.07) 78%, rgba(3, 10, 26, 0)); }
  #captions .jp { font-size: clamp(17px, 2.5vmin + 1.3vw, 33px); letter-spacing: 0.12em; line-height: 1.75; font-weight: 500; color: #fff; text-shadow: 0 1px 2px rgba(0, 8, 24, 0.85), 0 0 10px rgba(0, 8, 24, 0.6), 0 0 28px rgba(0, 8, 24, 0.45); }
  #captions .ph { display: inline-block; white-space: nowrap; }
  #captions .jp .c { display: inline-block; opacity: 0; will-change: opacity, transform, filter; }
  #captions .en { margin: 0.25em auto 0; max-width: 34em; text-wrap: balance; font-family: var(--font-en); font-style: italic; font-weight: 500; font-size: clamp(15px, 1.3vmin + 0.9vw, 22px); letter-spacing: 0.05em; color: #fff; opacity: 0; text-shadow: 0 0 3px rgba(0, 8, 24, 0.9), 0 1px 3px rgba(0, 8, 24, 0.85), 0 0 14px rgba(0, 8, 24, 0.7); }
  /* bright scenes (dawn, clouds, meadow, snow): wider cool-navy scrim + heavier shadow */
  #captions.bright .box::before { inset: -1em -2.2em; background: radial-gradient(closest-side, rgba(8, 22, 56, 0.62), rgba(8, 22, 56, 0.42) 50%, rgba(8, 22, 56, 0.14) 78%, rgba(8, 22, 56, 0)); }
  #captions.bright .jp { text-shadow: 0 0 3px rgba(4, 14, 40, 0.95), 0 1px 3px rgba(4, 14, 40, 0.9), 0 0 16px rgba(4, 14, 40, 0.75); }
  #captions.bright .en { text-shadow: 0 0 4px rgba(4, 14, 40, 0.98), 0 1px 3px rgba(4, 14, 40, 0.95), 0 0 16px rgba(4, 14, 40, 0.8); }
  #captions.cap-title { bottom: auto; top: 31%; transform: translateY(-50%); }
  #captions.cap-title .box::before { display: none; }
  #captions.cap-title .jp { font-size: clamp(34px, 7vmin + 2vw, 92px); letter-spacing: 0.32em; padding-left: 0.32em; font-weight: 500; text-shadow: 0 0 28px rgba(140, 220, 255, 0.85), 0 0 80px rgba(80, 170, 255, 0.55); }
  #captions.cap-title .en { margin-top: 1.1em; font-size: clamp(15px, 1.6vmin + 1vw, 26px); letter-spacing: 0.14em; color: #d6ecff; }
  #captions.cap-end .jp { letter-spacing: 0.18em; }
  .nocap #captions { display: none; }
  @media (max-aspect-ratio: 1/1) {
    #captions { bottom: calc(14vh + env(safe-area-inset-bottom, 0px)); padding: 0 4vw; }
    #captions .jp { font-size: clamp(16px, 4.8vw, 25px); letter-spacing: 0.05em; }
    #captions.cap-title .box { padding-left: 0; padding-right: 0; }
    #captions.cap-title .jp { font-size: clamp(26px, 9vw, 64px); letter-spacing: 0.16em; padding-left: 0.16em; }
    #captions.cap-title .en { letter-spacing: 0.06em; max-width: 90vw; }
    #captions .en { max-width: 86vw; }
  }

  @media (max-height: 480px) and (orientation: landscape) {
    #captions { bottom: calc(19vh + env(safe-area-inset-bottom, 0px)); }
    #captions.cap-title { top: 24%; }
    #captions.cap-title .jp { font-size: clamp(26px, 8vh, 48px); }
    #captions.cap-title .en { margin-top: 0.6em; font-size: clamp(13px, 4vh, 18px); }
  }

  /* start card */
  #start { position: fixed; inset: 0; display: grid; place-items: center; text-align: center; background: radial-gradient(ellipse at 50% 46%, #07162b 0%, var(--void) 70%); transition: opacity 1.4s ease, visibility 0s 1.4s; z-index: 5; padding: 24px; }
  body.started #start { opacity: 0; visibility: hidden; pointer-events: none; }
  #start .wrap { display: grid; gap: 22px; justify-items: center; }
  #start .dot { width: 10px; height: 10px; border-radius: 50%; background: #f2fbff; box-shadow: 0 0 14px 4px rgba(160, 230, 255, 0.9), 0 0 60px 18px rgba(90, 190, 255, 0.45); animation: beat 2.4s ease-in-out infinite; }
  @keyframes beat { 0%, 100% { transform: scale(0.8); opacity: 0.7; } 6% { transform: scale(1.5); opacity: 1; } 14% { transform: scale(0.95); } 24% { transform: scale(1.25); opacity: 0.95; } 40% { transform: scale(0.85); opacity: 0.75; } }
  #start h1 { margin: 6px 0 0; font-weight: 500; font-size: clamp(28px, 6vmin + 1vw, 60px); letter-spacing: 0.3em; padding-left: 0.3em; text-shadow: 0 0 24px rgba(120, 210, 255, 0.55); }
  #start p { margin: 0; font-family: var(--font-en); font-style: italic; font-weight: 300; color: var(--ink-dim); letter-spacing: 0.1em; font-size: clamp(14px, 1.6vmin + 0.8vw, 20px); }
  #start .btns { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; margin-top: 10px; }
  #start button { font: inherit; font-family: var(--font-jp); font-size: 16px; letter-spacing: 0.18em; padding: 12px 26px; color: var(--ink); background: rgba(160, 225, 255, 0.07); border: 1px solid var(--line); border-radius: 999px; cursor: pointer; transition: background 0.3s, border-color 0.3s, box-shadow 0.3s; }
  #start button:hover, #start button:focus-visible { background: rgba(160, 225, 255, 0.16); border-color: rgba(190, 235, 255, 0.6); box-shadow: 0 0 24px rgba(120, 210, 255, 0.35); outline: none; }
  #start button.quiet { color: var(--ink-dim); }
  #start .hint { font-size: 12px; color: var(--ink-dim); letter-spacing: 0.12em; opacity: 0.8; }
  #start .btns, #start .hint { opacity: 0; transition: opacity 0.8s; pointer-events: none; }
  body.ready #start .btns, body.ready #start .hint { opacity: 1; pointer-events: auto; }
  @media (hover: none) { #start .hint .kb { display: none; } }
  #prep { width: 120px; height: 1px; background: var(--line); position: relative; transition: opacity 0.6s; }
  #prep::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--p, 0%); background: var(--glow); box-shadow: 0 0 8px var(--glow); }
  body.ready #prep { opacity: 0; }

  /* transport */
  #bar { position: fixed; left: 0; right: 0; bottom: 0; display: flex; align-items: center; gap: 12px; padding: 14px max(14px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(14px, env(safe-area-inset-left, 0px)); background: linear-gradient(to top, rgba(2, 4, 10, 0.72), rgba(2, 4, 10, 0)); opacity: 0; transition: opacity 0.5s; z-index: 3; }
  body.active #bar, body:not(.started) #bar { opacity: 1; }
  body:not(.started) #bar { display: none; }
  #bar button { all: unset; box-sizing: border-box; width: 44px; height: 44px; display: grid; place-items: center; cursor: pointer; border-radius: 50%; color: var(--ink); flex: none; }
  #bar button:hover, #bar button:focus-visible { background: rgba(255, 255, 255, 0.12); }
  #bar svg { width: 20px; height: 20px; fill: currentColor; }
  #play[data-state="pause"] .i-play, #play[data-state="play"] .i-pause { display: none; }
  #snd[data-state="on"] .i-off, #snd[data-state="off"] .i-on { display: none; }
  #time { font-family: var(--font-en); font-size: 15px; letter-spacing: 0.08em; color: var(--ink-dim); font-variant-numeric: tabular-nums; flex: none; min-width: 5.6em; text-align: center; }
  .seekwrap { position: relative; flex: 1; min-width: 0; height: 44px; display: grid; align-items: center; }
  #ticks { position: absolute; left: 0; right: 0; top: 50%; height: 0; pointer-events: none; }
  #ticks i { position: absolute; width: 1px; height: 10px; margin-top: -5px; background: rgba(255, 255, 255, 0.35); }
  #seek { -webkit-appearance: none; appearance: none; width: 100%; height: 44px; margin: 0; background: transparent; cursor: pointer; touch-action: none; }
  #seek::-webkit-slider-runnable-track { height: 2px; border-radius: 2px; background: linear-gradient(to right, var(--glow) var(--p, 0%), rgba(255, 255, 255, 0.22) var(--p, 0%)); }
  #seek::-moz-range-track { height: 2px; border-radius: 2px; background: rgba(255, 255, 255, 0.22); }
  #seek::-moz-range-progress { height: 2px; background: var(--glow); }
  #seek::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; margin-top: -5px; border-radius: 50%; background: #f2fbff; box-shadow: 0 0 10px 2px rgba(160, 230, 255, 0.85); }
  #seek::-moz-range-thumb { width: 12px; height: 12px; border: 0; border-radius: 50%; background: #f2fbff; box-shadow: 0 0 10px 2px rgba(160, 230, 255, 0.85); }
  #seek:focus-visible { outline: 1px solid var(--glow); outline-offset: 6px; }
  @media (max-width: 520px) { #time { display: none; } #bar { gap: 6px; } }
  @media (prefers-reduced-motion: reduce) { #start .dot { animation: none; } }
</style>
<div id="stage"><canvas id="c" aria-label="ひとしずくの旅のアニメーション"></canvas></div>
<div id="captions" aria-live="polite"></div>

<div id="start">
  <div class="wrap">
    <div class="dot"></div>
    <h1>ひとしずくの旅</h1>
    <p>The Journey of a Single Drop of Light</p>
    <div id="prep"></div>
    <div class="btns">
      <button id="go" type="button">音を出して はじめる</button>
      <button id="goquiet" type="button" class="quiet">音なしで みる</button>
    </div>
    <div class="hint">約3分<span class="kb"> ・ スペースキーで一時停止 ・ ← → で5秒移動</span></div>
  </div>
</div>

<div id="bar">
  <button id="play" type="button" data-state="pause" aria-label="一時停止">
    <svg viewBox="0 0 24 24" class="i-play"><path d="M8 5v14l11-7z"/></svg>
    <svg viewBox="0 0 24 24" class="i-pause"><path d="M7 5h4v14H7zm6 0h4v14h-4z"/></svg>
  </button>
  <div class="seekwrap"><div id="ticks"></div><input id="seek" type="range" min="0" max="180" step="0.1" value="0" aria-label="再生位置"></div>
  <span id="time">0:00 / 3:00</span>
  <button id="snd" type="button" data-state="on" aria-label="音を消す">
    <svg viewBox="0 0 24 24" class="i-on"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 8v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/></svg>
    <svg viewBox="0 0 24 24" class="i-off"><path d="M3 9v6h4l5 5V4L7 9H3zm13.6 3 2.4-2.4-1.4-1.4-2.4 2.4-2.4-2.4-1.4 1.4 2.4 2.4-2.4 2.4 1.4 1.4 2.4-2.4 2.4 2.4 1.4-1.4z"/></svg>
  </button>
  <button id="fs" type="button" aria-label="全画面">
    <svg viewBox="0 0 24 24"><path d="M5 5h5v2H7v3H5V5zm9 0h5v5h-2V7h-3V5zM5 14h2v3h3v2H5v-5zm12 0h2v5h-5v-2h3v-3z"/></svg>
  </button>
</div>

<script>/* src/core.js */
/* ひとしずくの旅 — core: utilities + engine (compositor / post-fx)
 *
 * Everything here is a pure function of the global time T (seconds). No scene may
 * keep per-frame simulation state: positions must be analytic f(seed, T) so that the
 * film can be seeked, looped, and rendered frame-by-frame for verification.
 */
(function (G) {
  'use strict';
  const Anim = (G.Anim = G.Anim || {});
  Anim.DURATION = 180;
  Anim.scenes = {}; // id -> scene definition
  Anim.errors = [];
  const u = (Anim.util = {});
  const TAU = Math.PI * 2;
  u.TAU = TAU;

  /* ---------- numeric helpers ---------- */
  u.clamp = (x, a = 0, b = 1) => (x < a ? a : x > b ? b : x);
  u.lerp = (a, b, t) => a + (b - a) * t;
  u.invLerp = (a, b, x) => (x - a) / (b - a);
  /** remap x from [a,b] to [c,d], clamped */
  u.remap = (x, a, b, c, d) => c + (d - c) * u.clamp((x - a) / (b - a));
  u.smoothstep = (a, b, x) => {
    const t = u.clamp((x - a) / (b - a));
    return t * t * (3 - 2 * t);
  };
  u.smootherstep = (a, b, x) => {
    const t = u.clamp((x - a) / (b - a));
    return t * t * t * (t * (t * 6 - 15) + 10);
  };
  /** wrap x into [a,b) */
  u.wrap = (x, a, b) => {
    const r = b - a;
    return a + ((((x - a) % r) + r) % r);
  };
  /** 0..1 -> 0..1 ease functions */
  u.ease = {
    linear: (t) => t,
    inQuad: (t) => t * t,
    outQuad: (t) => t * (2 - t),
    inOutQuad: (t) => (t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t),
    inCubic: (t) => t * t * t,
    outCubic: (t) => 1 - Math.pow(1 - t, 3),
    inOutCubic: (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2),
    inOutSine: (t) => -(Math.cos(Math.PI * t) - 1) / 2,
    outExpo: (t) => (t >= 1 ? 1 : 1 - Math.pow(2, -10 * t)),
    inExpo: (t) => (t <= 0 ? 0 : Math.pow(2, 10 * t - 10)),
    outBack: (t) => {
      const c1 = 1.70158, c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    },
  };
  /**
   * Keyframe interpolation. keys = [[t, v], ...] sorted by t. Clamped outside range.
   * mode: 'smooth' (smoothstep per segment, stops at every key) | 'linear' |
   *       'spline' (C1 cubic Hermite, finite-difference tangents; good for camera paths)
   */
  u.keys = (keys, t, mode = 'smooth') => {
    const n = keys.length;
    if (t <= keys[0][0]) return keys[0][1];
    if (t >= keys[n - 1][0]) return keys[n - 1][1];
    let i = 0;
    while (t > keys[i + 1][0]) i++;
    const t0 = keys[i][0], v0 = keys[i][1], t1 = keys[i + 1][0], v1 = keys[i + 1][1];
    const h = t1 - t0, s = (t - t0) / h;
    if (mode === 'linear') return v0 + (v1 - v0) * s;
    if (mode === 'smooth') return v0 + (v1 - v0) * (s * s * (3 - 2 * s));
    const pa = i > 0 ? keys[i - 1] : keys[i];
    const pb = i + 2 < n ? keys[i + 2] : keys[i + 1];
    const m0 = pa[0] === t0 ? (v1 - v0) / h : ((v1 - pa[1]) / (t1 - pa[0]));
    const m1 = pb[0] === t1 ? (v1 - v0) / h : ((pb[1] - v0) / (pb[0] - t0));
    const s2 = s * s, s3 = s2 * s;
    return (2 * s3 - 3 * s2 + 1) * v0 + (s3 - 2 * s2 + s) * h * m0 + (-2 * s3 + 3 * s2) * v1 + (s3 - s2) * h * m1;
  };

  /* ---------- randomness / noise (all deterministic) ---------- */
  /** seeded PRNG: const r = u.rng(42); r() -> [0,1) */
  u.rng = (seed) => {
    let a = seed >>> 0;
    return () => {
      a = (a + 0x6d2b79f5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  };
  const hash2i = (x, y) => {
    let h = (Math.imul(x, 374761393) + Math.imul(y, 668265263)) | 0;
    h = Math.imul(h ^ (h >>> 13), 1274126177);
    h ^= h >>> 16;
    return (h >>> 0) / 4294967296;
  };
  /** deterministic hash of a number -> [0,1) */
  u.hash = (n) => hash2i(Math.floor(n), 7919) ;
  u.hash2 = hash2i;
  const fade = (t) => t * t * (3 - 2 * t);
  /** smooth value noise 1D, returns [0,1) */
  u.noise1 = (x) => {
    const i = Math.floor(x), f = x - i;
    return hash2i(i, 101) * (1 - fade(f)) + hash2i(i + 1, 101) * fade(f);
  };
  /** smooth value noise 2D, returns [0,1) */
  u.noise2 = (x, y) => {
    const ix = Math.floor(x), iy = Math.floor(y), fx = fade(x - ix), fy = fade(y - iy);
    const a = hash2i(ix, iy), b = hash2i(ix + 1, iy), c = hash2i(ix, iy + 1), d = hash2i(ix + 1, iy + 1);
    return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
  };
  /** fractal noise, returns ~[0,1) */
  u.fbm1 = (x, oct = 4) => {
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += a * u.noise1(x * f + i * 13.7); n += a; a *= 0.5; f *= 2; }
    return s / n;
  };
  u.fbm2 = (x, y, oct = 4) => {
    let s = 0, a = 0.5, f = 1, n = 0;
    for (let i = 0; i < oct; i++) { s += a * u.noise2(x * f + i * 17.3, y * f + i * 5.1); n += a; a *= 0.5; f *= 2; }
    return s / n;
  };

  /* ---------- colour ---------- */
  u.rgb = (hex) => {
    let h = hex.replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    return [parseInt(h.slice(0, 2), 16), parseInt(h.slice(2, 4), 16), parseInt(h.slice(4, 6), 16)];
  };
  u.mixc = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
  /** [r,g,b] (+alpha) -> css string */
  u.css = (c, a = 1) =>
    a >= 1 ? `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})` : `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a < 0 ? 0 : a})`;
  /** colour keyframes: keys = [[t,[r,g,b]],...] -> [r,g,b] (accepts hex strings too) */
  u.keyc = (keys, t, mode = 'smooth') => {
    const k = keys.map(([tt, c]) => [tt, typeof c === 'string' ? u.rgb(c) : c]);
    const n = k.length;
    if (t <= k[0][0]) return k[0][1];
    if (t >= k[n - 1][0]) return k[n - 1][1];
    let i = 0;
    while (t > k[i + 1][0]) i++;
    let s = (t - k[i][0]) / (k[i + 1][0] - k[i][0]);
    if (mode === 'smooth') s = s * s * (3 - 2 * s);
    return u.mixc(k[i][1], k[i + 1][1], s);
  };
  u.hsl = (h, s, l, a = 1) => `hsla(${(((h % 360) + 360) % 360).toFixed(1)},${s.toFixed(1)}%,${l.toFixed(1)}%,${a < 0 ? 0 : a})`;

  /* ---------- canvas helpers ---------- */
  u.canvas = (w, h) => {
    const c = document.createElement('canvas');
    c.width = Math.max(1, w | 0);
    c.height = Math.max(1, h | 0);
    return c;
  };
  const _sprites = new Map();
  /** cached offscreen sprite: u.sprite(key, w, h, (ctx,w,h)=>{...}) */
  u.sprite = (key, w, h, draw) => {
    let c = _sprites.get(key);
    if (!c) {
      c = u.canvas(w, h);
      draw(c.getContext('2d'), c.width, c.height);
      _sprites.set(key, c);
    }
    return c;
  };
  /** whole-canvas vertical gradient fill. stops = [[0,'#...'],[1,'#...']] */
  u.vgrad = (g, W, H, stops, y0 = 0, y1 = H) => {
    const gr = g.createLinearGradient(0, y0, 0, y1);
    for (const [p, c] of stops) gr.addColorStop(p, c);
    g.fillStyle = gr;
    g.fillRect(0, 0, W, H);
  };
  u.grad = (g, x0, y0, x1, y1, stops) => {
    const gr = g.createLinearGradient(x0, y0, x1, y1);
    for (const [p, c] of stops) gr.addColorStop(p, c);
    return gr;
  };
  /** cached radial glow sprite (white-hot core -> hue halo), 128px */
  u.glowSprite = (h, s, l, kind = 'soft') => {
    const hq = ((Math.round(h / 3) * 3) % 360 + 360) % 360;
    const sq = Math.round(s / 2) * 2, lq = Math.round(l / 2) * 2;
    return u.sprite(`glow|${kind}|${hq}|${sq}|${lq}`, 128, 128, (c) => {
      const g = c.createRadialGradient(64, 64, 0, 64, 64, 64);
      const C = (a, ll = lq, ss = sq) => `hsla(${hq},${ss}%,${Math.min(100, ll)}%,${a})`;
      if (kind === 'core') {
        g.addColorStop(0, C(1, 98, sq * 0.3));
        g.addColorStop(0.1, C(0.95, lq + 18, sq * 0.6));
        g.addColorStop(0.28, C(0.5));
        g.addColorStop(0.6, C(0.12));
        g.addColorStop(1, C(0));
      } else if (kind === 'ring') {
        g.addColorStop(0, C(0));
        g.addColorStop(0.7, C(0));
        g.addColorStop(0.88, C(0.9));
        g.addColorStop(0.97, C(0.15));
        g.addColorStop(1, C(0));
      } else {
        g.addColorStop(0, C(1));
        g.addColorStop(0.15, C(0.55));
        g.addColorStop(0.4, C(0.18));
        g.addColorStop(0.7, C(0.04));
        g.addColorStop(1, C(0));
      }
      c.fillStyle = g;
      c.fillRect(0, 0, 128, 128);
    });
  };
  /** additive glow: u.glow(g, x, y, radiusPx, hue, sat, light, alpha, kind='soft'|'core'|'ring') */
  u.glow = (g, x, y, r, h, s, l, a = 1, kind = 'soft') => {
    if (a <= 0.002 || r < 0.3) return;
    const op = g.globalCompositeOperation, pa = g.globalAlpha;
    g.globalCompositeOperation = 'lighter';
    g.globalAlpha = a > 1 ? 1 : a;
    g.drawImage(u.glowSprite(h, s, l, kind), x - r, y - r, r * 2, r * 2);
    if (a > 1) { g.globalAlpha = a - 1 > 1 ? 1 : a - 1; g.drawImage(u.glowSprite(h, s, l, kind), x - r, y - r, r * 2, r * 2); }
    g.globalAlpha = pa;
    g.globalCompositeOperation = op;
  };

  /* ====================================================================
   *  ENGINE
   * ==================================================================== */
  const E = (Anim.engine = {
    canvas: null, ctx: null,
    W: 0, H: 0, scale: 1, dpr: 1, cssW: 0, cssH: 0,
    maxPixels: 2.4e6,
    env: { W: 0, H: 0, S: 0, aspect: 1, portrait: false, scale: 1, dpr: 1 },
    stats: { frames: 0, lastMs: 0 },
    noFx: false, // perf diagnostics: skip bloom/vignette/grain/fade
  });
  let L0, L1, g0, g1, B1, B2, B3, b1c, b2c, b3c, vign, grainPat;

  E.attach = (canvas) => {
    E.canvas = canvas;
    E.ctx = canvas.getContext('2d', { alpha: false });
  };

  E.setSize = (cssW, cssH, dpr, scale) => {
    if (scale != null) E.scale = scale;
    E.cssW = cssW; E.cssH = cssH; E.dpr = dpr;
    const k = Math.min(dpr, 2) * E.scale;
    let W = Math.round(cssW * k), H = Math.round(cssH * k);
    if (W * H > E.maxPixels) { const f = Math.sqrt(E.maxPixels / (W * H)); W = Math.round(W * f); H = Math.round(H * f); }
    W = Math.max(96, W); H = Math.max(96, H);
    if (W === E.W && H === E.H) return false;
    E.W = W; E.H = H;
    E.canvas.width = W; E.canvas.height = H;
    L0 = u.canvas(W, H); L1 = u.canvas(W, H);
    g0 = L0.getContext('2d', { alpha: false }); g1 = L1.getContext('2d', { alpha: false });
    B1 = u.canvas(W / 4, H / 4); B2 = u.canvas(W / 8, H / 8); B3 = u.canvas(W / 8, H / 8);
    b1c = B1.getContext('2d'); b2c = B2.getContext('2d'); b3c = B3.getContext('2d');
    for (const c of [b1c, b2c, b3c]) { c.imageSmoothingEnabled = true; c.imageSmoothingQuality = 'low'; }
    b2c.imageSmoothingQuality = 'medium';
    // vignette
    vign = u.canvas(W, H);
    const vg = vign.getContext('2d');
    const rg = vg.createRadialGradient(W / 2, H / 2, Math.min(W, H) * 0.28, W / 2, H / 2, Math.hypot(W, H) * 0.56);
    rg.addColorStop(0, 'rgba(0,0,0,0)'); rg.addColorStop(0.6, 'rgba(0,0,0,0.22)'); rg.addColorStop(1, 'rgba(0,0,0,0.78)');
    vg.fillStyle = rg; vg.fillRect(0, 0, W, H);
    // grain tile (additive, sparse so black stays near-black)
    const gt = u.canvas(256, 256), gx = gt.getContext('2d'), id = gx.createImageData(256, 256), r = u.rng(1234);
    for (let i = 0; i < id.data.length; i += 4) { const v = Math.floor(Math.pow(r(), 1.6) * 255); id.data[i] = id.data[i + 1] = id.data[i + 2] = v; id.data[i + 3] = 255; }
    gx.putImageData(id, 0, 0);
    grainPat = E.ctx.createPattern(gt, 'repeat');
    const env = E.env;
    env.W = W; env.H = H; env.S = Math.min(W, H); env.aspect = W / H; env.portrait = H > W; env.scale = E.scale; env.dpr = dpr;
    for (const id2 in Anim.scenes) Anim.scenes[id2]._sizeKey = null;
    return true;
  };

  Anim.defineScene = (def) => { Anim.scenes[def.id] = def; return def; };

  const ensure = (def) => {
    if (!def._inited) { def._inited = true; if (def.init) def.init(E.env); }
    const key = E.W + 'x' + E.H;
    if (def._sizeKey !== key) { def._sizeKey = key; if (def.resize) def.resize(E.env); }
  };
  /** run init/resize of every scene up front (chunked, yields to the event loop) */
  E.prepare = async (onProgress) => {
    const ids = Anim.timeline.scenes.map((s) => s.id);
    for (let i = 0; i < ids.length; i++) {
      const def = Anim.scenes[ids[i]];
      if (def) { try { ensure(def); } catch (e) { E.report(ids[i], e); } }
      if (onProgress) onProgress((i + 1) / ids.length);
      await new Promise((r) => setTimeout(r, 0));
    }
  };
  E.report = (id, e) => {
    Anim.errors.push(`${id}: ${e && e.stack ? e.stack : e}`);
    if (Anim.errors.length < 6) console.error('[scene ' + id + ']', e);
  };

  const drawScene = (g, a, T) => {
    const def = Anim.scenes[a.id];
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
    g.fillStyle = '#000'; g.fillRect(0, 0, E.W, E.H);
    if (def) {
      try { ensure(def); def.render(g, T, T - a.start, E.env); } catch (e) { E.report(a.id, e); }
    }
    g.restore();
  };

  const sceneFx = (a, T) => {
    const def = Anim.scenes[a.id];
    return def && def.fx ? def.fx(T, T - a.start) : null;
  };

  E.renderAt = (T) => {
    const t0 = performance.now();
    const d = E.ctx, W = E.W, H = E.H;
    const act = Anim.timeline.active(T);
    const base = Anim.timeline.fx(T);
    let fx = { bloom: base.bloom, vignette: base.vignette, grain: base.grain, fade: base.fade };
    if (act.length === 1) {
      drawScene(d, act[0], T);
      const f = sceneFx(act[0], T);
      if (f) Object.assign(fx, f);
    } else {
      drawScene(g0, act[0], T);
      drawScene(g1, act[1], T);
      d.save();
      d.setTransform(1, 0, 0, 1, 0, 0);
      d.globalAlpha = 1; d.globalCompositeOperation = 'source-over';
      const wB = act[1].w;
      if (wB < 0.995) d.drawImage(L0, 0, 0);
      if (wB > 0.008) { d.globalAlpha = wB > 0.995 ? 1 : wB; d.drawImage(L1, 0, 0); }
      d.restore();
      const fa = sceneFx(act[0], T), fb = sceneFx(act[1], T);
      if (fa || fb) {
        for (const k of ['bloom', 'vignette', 'grain']) {
          const va = fa && fa[k] != null ? fa[k] : fx[k], vb = fb && fb[k] != null ? fb[k] : fx[k];
          fx[k] = va + (vb - va) * act[1].w;
        }
      }
    }
    if (!E.noFx) E.post(d, fx, T);
    E.stats.frames++;
    E.stats.lastMs = performance.now() - t0;
  };

  /** debug: render ONE scene alone (no cross-fade) for time T, incl. post-fx. */
  E.renderSolo = (id, T) => {
    const sc = Anim.timeline.byId[id], d = E.ctx;
    const base = Anim.timeline.fx(T);
    const fx = { bloom: base.bloom, vignette: base.vignette, grain: base.grain, fade: 1 };
    drawScene(d, { id, start: sc.start, end: sc.end, w: 1 }, T);
    const f = sceneFx({ id, start: sc.start }, T);
    if (f) Object.assign(fx, f);
    if (!E.noFx) E.post(d, fx, T);
  };

  E.post = (d, fx, T) => {
    const W = E.W, H = E.H;
    d.save();
    d.setTransform(1, 0, 0, 1, 0, 0);
    // bloom: highlights only (blur then square)
    if (fx.bloom > 0.005) {
      b1c.globalCompositeOperation = 'copy'; b1c.drawImage(E.canvas, 0, 0, B1.width, B1.height);
      b2c.globalCompositeOperation = 'copy'; b2c.drawImage(B1, 0, 0, B2.width, B2.height);
      b3c.globalCompositeOperation = 'copy'; b3c.drawImage(B2, 0, 0);
      b2c.globalCompositeOperation = 'multiply'; b2c.drawImage(B3, 0, 0);
      b2c.globalCompositeOperation = 'source-over';
      b1c.globalCompositeOperation = 'copy'; b1c.drawImage(B2, 0, 0, B1.width, B1.height);
      d.globalCompositeOperation = 'lighter';
      let s = fx.bloom;
      while (s > 0.001) { d.globalAlpha = Math.min(1, s); d.drawImage(B1, 0, 0, W, H); s -= 1; }
    }
    d.globalCompositeOperation = 'source-over';
    if (fx.vignette > 0.005) { d.globalAlpha = fx.vignette; d.drawImage(vign, 0, 0); }
    if (fx.grain > 0.001 && grainPat) {
      const k = Math.floor(T * 24);
      const ox = Math.floor(u.hash2(k, 11) * 256), oy = Math.floor(u.hash2(k, 23) * 256);
      d.globalCompositeOperation = 'lighter';
      d.globalAlpha = fx.grain;
      d.translate(-ox, -oy);
      d.fillStyle = grainPat;
      d.fillRect(0, 0, W + 256, H + 256);
      d.setTransform(1, 0, 0, 1, 0, 0);
    }
    d.globalCompositeOperation = 'source-over';
    if (fx.fade < 0.999) { d.globalAlpha = 1 - fx.fade; d.fillStyle = '#000'; d.fillRect(0, 0, W, H); }
    d.restore();
  };

  /** benchmark: average ms per renderAt (forces a pixel readback so GPU/raster work is counted) */
  E.bench = (times, reps = 8) => {
    const out = [];
    for (const T of times) {
      const ms = [];
      for (let i = 0; i < reps; i++) {
        const t0 = performance.now();
        E.renderAt(T + i * 0.033);
        E.ctx.getImageData(0, 0, 1, 1);
        ms.push(performance.now() - t0);
      }
      ms.sort((a, b) => a - b);
      out.push({ T, avg: ms.reduce((a, b) => a + b, 0) / ms.length, p90: ms[Math.floor(ms.length * 0.9)] });
    }
    return out;
  };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/timeline.js */
/* ひとしずくの旅 — timeline: chapters, caption cues, global post-fx.
 * Scene intervals overlap by 4 s; inside an overlap the two scenes are cross-faded, and BOTH must
 * draw the same hero state / matching background (see docs/DESIGN.md "Handoff contract").
 */
(function (G) {
  'use strict';
  const Anim = (G.Anim = G.Anim || {});
  const u = Anim.util;

  const scenes = [
    { id: 's1_awakening', name: '目ざめ', en: 'Awakening', start: 0, end: 18 },
    { id: 's2_deepsea', name: '深海', en: 'Deep Sea', start: 14, end: 48 },
    { id: 's3_surface', name: '夜明け', en: 'Dawn', start: 44, end: 76 },
    { id: 's4_sky', name: '空と雲', en: 'Sky', start: 72, end: 102 },
    { id: 's5_rain', name: '雨', en: 'Rain', start: 98, end: 126 },
    { id: 's6_tree', name: '芽ばえと季節', en: 'Seasons', start: 122, end: 156 },
    { id: 's7_stars', name: '星', en: 'Stars', start: 152, end: 170 },
    { id: 's8_return', name: '還る', en: 'Return', start: 166, end: 180 },
  ];

  /* Captions (DOM, drawn by ui.js). kind: 'title' (centre, large) | 'line' (bottom) | 'end' */
  const cues = [
    { t0: 8.0, t1: 15.8, kind: 'title', jp: 'ひとしずくの旅', en: 'The Journey of a Single Drop of Light' },
    { t0: 16.6, t1: 22.8, jp: '音のない、いちばん深い場所で。', en: 'In the deepest place, where there is no sound,' },
    { t0: 23.4, t1: 29.8, jp: 'ひとしずくの光が、ゆっくりと目をさました。', en: 'a single drop of light slowly awoke.' },
    { t0: 32.0, t1: 39.5, jp: '大きな影が、静かに通りすぎていく。', en: 'A vast shadow drifted past, without a sound.' },
    { t0: 41.0, t1: 48.5, jp: '上へ、上へ。あかるい方へ。', en: 'Up, and further up, toward the light.' },
    { t0: 58.0, t1: 64.5, bright: true, jp: '水面のむこうに、朝があった。', en: 'Beyond the surface, there was morning.' },
    { t0: 65.0, t1: 71.5, bright: true, jp: 'ひとしずくは光にとけて、空へのぼる。', en: 'Melting into the light, it rose into the sky.' },
    { t0: 77.0, t1: 84.0, bright: true, jp: '空では、たくさんのしずくが待っていた。', en: 'Up there, countless drops were waiting.' },
    { t0: 85.0, t1: 92.5, bright: true, jp: 'ひとつ、またひとつ。集まって、雲になった。', en: 'One by one they gathered, and became a cloud.' },
    { t0: 93.5, t1: 100.4, bright: true, jp: '雲は、すこしずつ重くなっていく。', en: 'The cloud grew heavier, little by little.' },
    { t0: 103.0, t1: 110.0, jp: 'そして、雨になって、落ちていく。', en: 'And then it fell, as rain.' },
    { t0: 111.0, t1: 119.0, jp: '山をこえ、森をぬけて、大地のなかへ。', en: 'Over the mountains, through the forest, into the earth.' },
    { t0: 121.6, t1: 127.4, jp: 'そこには、眠りつづける小さな種があった。', en: 'There, a small seed had been sleeping.' },
    { t0: 128.2, t1: 134.6, bright: true, jp: 'ひとしずくに触れて、種は目をさます。', en: 'Touched by the drop, the seed awoke.' },
    { t0: 140.6, t1: 148.4, bright: true, jp: '春、夏、秋、冬。いくつもの季節をこえて、', en: 'Spring, summer, autumn, winter — season after season,' },
    { t0: 148.9, t1: 153.6, bright: true, jp: '木は、空にむかってのびていった。', en: 'the tree reached up toward the sky.' },
    { t0: 154.0, t1: 160.8, bright: true, jp: '夜が来て、木は光を空へ返した。', en: 'At night, the tree gave its light back to the sky.' },
    { t0: 161.4, t1: 166.4, jp: 'ひとしずくは、星になった。', en: 'The drop became a star.' },
    { t0: 167.0, t1: 172.6, jp: '星はやがて、海へと帰っていく。', en: 'And in time, the star returned to the sea.' },
    { t0: 173.2, t1: 179.2, kind: 'end', jp: 'ひとしずくの旅は、またはじまる。', en: 'The journey begins again.' },
  ];

  const byId = {};
  scenes.forEach((s, i) => { s.index = i; s.dur = s.end - s.start; byId[s.id] = s; });

  /** overlap windows [a,b] between scene i and i+1 */
  const windows = [];
  for (let i = 0; i + 1 < scenes.length; i++) windows.push({ a: scenes[i + 1].start, b: scenes[i].end, from: scenes[i].id, to: scenes[i + 1].id });

  /** Which scenes are drawn at T. Returns [{id,start,end,w}] (w = layer weight; 1 for the first) */
  function active(T) {
    const out = [];
    for (let i = 0; i < scenes.length; i++) {
      const s = scenes[i];
      if (T >= s.start && T <= s.end) out.push({ id: s.id, start: s.start, end: s.end, w: 1 });
    }
    if (out.length === 0) {
      const s = T < scenes[0].start ? scenes[0] : scenes[scenes.length - 1];
      return [{ id: s.id, start: s.start, end: s.end, w: 1 }];
    }
    if (out.length > 1) {
      const nxt = byId[out[1].id], prv = byId[out[0].id];
      out[1].w = u.smootherstep(nxt.start, prv.end, T);

  /** global post-fx (scenes may override bloom/vignette/grain through an optional scene.fx(T, L)) */
  function fx(T) {
    return {
      bloom: u.keys([[0, 0.9], [14, 0.8], [44, 0.55], [60, 0.8], [76, 0.5], [100, 0.4], [126, 0.5], [156, 0.75], [162, 1.0], [170, 0.85], [180, 0.9]], T),
      vignette: 0.55,
      grain: 0.022,
      // the film starts and ends on the same dim point of light (not black), so the loop reads as one continuous cycle
      fade: (0.55 + 0.45 * u.smoothstep(0, 2.5, T)) * (1 - 0.45 * u.smoothstep(177.8, 180, T)),
    };
  }

  Anim.timeline = { scenes, byId, cues, windows, active, fx, DURATION: Anim.DURATION };
})(typeof window !== 'undefined' ? window : globalThis);

<script>/* src/hero.js */
/* ひとしずくの旅 — the hero ("the drop of light"): shared look + handoff table.
 *
 * The hero is drawn by each scene (so it can sit between that scene's depth layers), using
 * Anim.hero.draw(). Inside every cross-fade window the hero MUST be at the pinned state below in
 * BOTH scenes, otherwise the dissolve shows two drops. Elsewhere each scene moves it freely.
 *   x,y : normalised screen position (0..1, y down)      r : core radius in units of S=min(W,H)
 *   hue : HSL hue of the glow                              form: 'orb' | 'drop' | 'seed' | 'star'
 */
(function (G) {
  'use strict';
  const Anim = (G.Anim = G.Anim || {});
  const u = Anim.util;

  /** pinned hero state for each cross-fade window (index = window index, see Anim.timeline.windows) */
  const pins = [
    { id: 'B1', from: 's1_awakening', to: 's2_deepsea', a: 14, b: 18, x: 0.5, y: 0.5, r: 0.012, hue: 190, form: 'orb' },
    { id: 'B2', from: 's2_deepsea', to: 's3_surface', a: 44, b: 48, x: 0.5, y: 0.56, r: 0.014, hue: 186, form: 'orb' },
    { id: 'B3', from: 's3_surface', to: 's4_sky', a: 72, b: 76, x: 0.5, y: 0.48, r: 0.016, hue: 48, form: 'orb' },
    { id: 'B4', from: 's4_sky', to: 's5_rain', a: 98, b: 102, x: 0.5, y: 0.4, r: 0.015, hue: 205, form: 'drop' },
    { id: 'B5', from: 's5_rain', to: 's6_tree', a: 122, b: 126, x: 0.5, y: 0.56, r: 0.014, hue: 200, form: 'drop' },
    { id: 'B6', from: 's6_tree', to: 's7_stars', a: 152, b: 156, x: 0.5, y: 0.46, r: 0.016, hue: 48, form: 'orb' },
    { id: 'B7', from: 's7_stars', to: 's8_return', a: 166, b: 170, x: 0.5, y: 0.3, r: 0.018, hue: 215, form: 'star' },
  ];

  /** lub-dub heart-beat envelope in [0,1]; period seconds */
  function beat(T, period = 2.4) {
    const p = (((T % period) + period) % period) / period;
    const a = Math.exp(-Math.pow((p - 0.06) / 0.05, 2)); // lub
    const b = 0.65 * Math.exp(-Math.pow((p - 0.24) / 0.06, 2)); // dub
    return Math.min(1, a + b);
  }

  /**
   * draw the hero. x,y,r in pixels (r = core radius).
   * o: { hue=190, sat=90, a=1 (intensity), pulse=1 (radius multiplier), glow=1, flare=0 (0..1 cross flare),
   *      form='orb'|'drop'|'seed'|'star', angle=0 (rad; drop tip direction, 0 = tip up) }
   */
  function draw(g, x, y, r, o = {}) {
    const hue = o.hue == null ? 190 : o.hue, sat = o.sat == null ? 90 : o.sat;
    const a = o.a == null ? 1 : o.a, pulse = o.pulse == null ? 1 : o.pulse, gl = o.glow == null ? 1 : o.glow;
    const form = o.form || 'orb';
    const R = r * pulse;
    if (a <= 0.003) return;
    u.glow(g, x, y, R * 18, hue, sat, 58, 0.2 * a * gl, 'soft');
    u.glow(g, x, y, R * 7, hue, sat, 62, 0.5 * a * gl, 'soft');
    if (form === 'drop') {
      // a proper teardrop: long curved taper, bright all the way to the tip, glassy rim, additive core on top
      const D = R * 1.2;
      g.save();
      g.translate(x, y);
      g.rotate(o.angle || 0);
      const p = new Path2D();
      p.moveTo(0, -D * 2.55);
      p.bezierCurveTo(D * 0.12, -D * 1.95, D * 1.02, -D * 1.0, D * 1.02, D * 0.22);
      p.arc(0, D * 0.22, D * 1.02, 0, Math.PI);
      p.bezierCurveTo(-D * 1.02, -D * 1.0, -D * 0.12, -D * 1.95, 0, -D * 2.55);
      p.closePath();
      g.globalAlpha = Math.min(1, a);
      const lg = g.createLinearGradient(0, -D * 2.55, 0, D * 1.25);
      lg.addColorStop(0, u.hsl(hue, sat * 0.35, 97, 0.98));
      lg.addColorStop(0.45, u.hsl(hue, sat * 0.55, 92, 0.97));
      lg.addColorStop(1, u.hsl(hue, sat * 0.9, 78, 0.9));
      g.fillStyle = lg;
      g.fill(p);
      g.lineWidth = Math.max(1, D * 0.1);
      g.strokeStyle = u.hsl(hue, sat * 0.3, 99, 0.85);
      g.stroke(p);
      g.restore();
      u.glow(g, x, y - D * 0.1, D * 2.4, hue, sat * 0.6, 90, 0.55 * a, 'core');
    } else if (form === 'seed') {
      g.save();
      g.translate(x, y);
      g.rotate(o.angle || 0);
      g.globalAlpha = Math.min(1, a);
      g.beginPath();
      g.ellipse(0, 0, R * 1.0, R * 1.55, 0, 0, u.TAU);
      const gr = g.createRadialGradient(-R * 0.2, -R * 0.4, R * 0.1, 0, 0, R * 1.7);
      gr.addColorStop(0, u.hsl(hue, 60, 90, 1));
      gr.addColorStop(0.6, u.hsl(hue, 75, 62, 0.95));
      gr.addColorStop(1, u.hsl(hue, 80, 38, 0.9));
      g.fillStyle = gr;
      g.fill();
      g.restore();
      u.glow(g, x, y, R * 3.6, hue, sat * 0.7, 80, 0.6 * a, 'core');
    } else {
      u.glow(g, x, y, R * 3.0, hue, sat * 0.5, 86, 0.95 * a, 'core');
      g.fillStyle = u.hsl(hue, 40, 97, Math.min(1, a));
      g.beginPath();
      g.arc(x, y, Math.max(0.6, R * 0.5), 0, u.TAU);
      g.fill();
    }
    const fl = form === 'star' ? Math.max(o.flare == null ? 1 : o.flare, 0) : o.flare || 0;
    if (fl > 0.01) {
      const L = R * 34 * fl;
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.translate(x, y);
      // [angle, length]: long horizontal, shorter vertical and diagonals (a full-height vertical hairline reads as a stray string)
      const rays = [[0, 1.0, 1.0], [Math.PI, 0, 0], [Math.PI / 2, 0.42, 0.9], [Math.PI / 4, 0.46, 0.55], [-Math.PI / 4, 0.46, 0.55]];
      for (const [ang, kl, ka] of rays) {
        if (kl <= 0) continue;
        const len = L * kl;
        g.save();
        g.rotate(ang + (o.flareRot || 0));
        const lg = g.createLinearGradient(-len, 0, len, 0);
        const c0 = u.hsl(hue, sat * 0.4, 92, 0), c1 = u.hsl(hue, sat * 0.4, 94, 0.75 * a * ka);
        lg.addColorStop(0, c0); lg.addColorStop(0.5, c1); lg.addColorStop(1, c0);
        g.fillStyle = lg;
        g.fillRect(-len, -R * 0.09, len * 2, R * 0.18);
        g.restore();
      }
      g.restore();
    }
  }

  Anim.hero = { pins, beat, draw };
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>/* src/scenes/s1_awakening.js */
/* ひとしずくの旅 — s1_awakening (T 0–18) 目ざめ
 *
 * Black void. A single point of light fades in, then beats like a heart. Every beat sends a thin ring
 * through the dark; dust that the ring passes lights up and fades. A teal haze swells around the light,
 * the beats soften, the dust starts to sink, and the world settles into the B1 deep-water state that
 * s2_deepsea continues (the "B1 world" block below is byte-identical in both files).
 *
 * Cost note: the opaque background, haze, halos and the soft part of every ring are painted into a
 * low-resolution layer and blitted once; only hairline rings, dust and the hero are drawn at full size.
 */
(function () {
  const { util: u, hero } = Anim;

  /* ===================== shared "B1 world" (identical in s1 and s2) ===================== */
  const TAU = u.TAU, sstep = u.smoothstep, clamp = u.clamp;
  const BG_TOP = [4, 20, 42], BG_BOT = [1, 4, 9];
  const HAZE_TINT = [20, 105, 125];
  const CAM_DT = 0.05;
  const camV = (t) => 0.02 * sstep(9, 14, t) + 0.03 * sstep(18, 40, t);
  const CAM = new Float32Array(Math.ceil(70 / CAM_DT) + 2);
  (() => { let acc = 0; for (let i = 1; i < CAM.length; i++) { acc += 0.5 * (camV((i - 1) * CAM_DT) + camV(i * CAM_DT)) * CAM_DT; CAM[i] = acc; } })();
  const camY = (T) => { const x = clamp(T, 0, 69.9) / CAM_DT, i = x | 0; return CAM[i] + (CAM[i + 1] - CAM[i]) * (x - i); };

  const dotSpr = () => u.sprite('s12|dot', 64, 64, (c) => {
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(240,255,255,1)'); gr.addColorStop(0.14, 'rgba(170,240,250,0.8)');
    gr.addColorStop(0.4, 'rgba(70,180,210,0.2)'); gr.addColorStop(1, 'rgba(30,120,170,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
  });
  const bokehSpr = () => u.sprite('s12|bokeh', 96, 96, (c) => {
    const gr = c.createRadialGradient(48, 48, 0, 48, 48, 48);
    gr.addColorStop(0, 'rgba(120,210,230,0.55)'); gr.addColorStop(0.6, 'rgba(110,200,225,0.6)');
    gr.addColorStop(0.82, 'rgba(150,225,240,0.85)'); gr.addColorStop(0.93, 'rgba(110,200,225,0.25)'); gr.addColorStop(1, 'rgba(90,180,210,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 96, 96);
  });

  const HZ = { cols: 0, rows: 0, cv: null, cx: null, img: null, dith: null };
  function hazeSetup(env) {
    const n = 2000;
    HZ.cols = Math.max(24, Math.round(Math.sqrt(n * env.W / env.H)));
    HZ.rows = Math.max(24, Math.round(Math.sqrt(n * env.H / env.W)));
    HZ.cv = u.canvas(HZ.cols, HZ.rows); HZ.cx = HZ.cv.getContext('2d');
    HZ.img = HZ.cx.createImageData(HZ.cols, HZ.rows);
    HZ.dith = new Float32Array(HZ.cols * HZ.rows);
    const r = u.rng(777);
    for (let i = 0; i < HZ.dith.length; i++) HZ.dith[i] = r() - 0.5;
  }
  /** teal volumetric haze: low-res fbm field, brightest around (hx,hy) (normalised), drawn additively */
  function hazeDraw(g, env, T, amp, tint, hx, hy, spread) {
    if (amp <= 0.002) return;
    const { W, H, S } = env, cols = HZ.cols, rows = HZ.rows, d = HZ.img.data;
    const t1 = T * 0.021, t2 = T * 0.017;
    let p = 0, q = 0;
    for (let j = 0; j < rows; j++) {
      const yy = ((j + 0.5) / rows * H - hy * H) / S;
      for (let i = 0; i < cols; i++) {
        const xx = ((i + 0.5) / cols * W - hx * W) / S;
        const wx = xx + 0.22 * (u.noise2(xx * 1.1 + t1 * 1.7 + 5.3, yy * 1.1 + 2.1) - 0.5);
        const wy = yy + 0.22 * (u.noise2(xx * 1.1 + 9.7, yy * 1.1 - t2 * 1.9 + 4.4) - 0.5);
        const xr = wx * 0.866 - wy * 0.5, yr = wx * 0.5 + wy * 0.866;
        const n = u.fbm2(xr * 1.7 + t1 + 3.1, yr * 1.7 - t2 + 7.7, 2);
        const s = clamp((n - 0.3) / 0.45);
        const d2 = xx * xx + yy * yy;
        const I = amp * (Math.exp(-d2 * spread) * (0.5 + 0.75 * s) + 0.40 * Math.exp(-Math.sqrt(d2) * 1.05) * (0.30 + 0.85 * s));
        const dz = HZ.dith[q++];
        d[p++] = tint[0] * I + dz; d[p++] = tint[1] * I + dz; d[p++] = tint[2] * I + dz; d[p++] = 255;
      }
    }
    HZ.cx.putImageData(HZ.img, 0, 0);
    g.save();
    g.globalCompositeOperation = 'lighter'; g.imageSmoothingEnabled = true; g.globalAlpha = 1;
    g.drawImage(HZ.cv, 0, 0, W, H);
    g.restore();
  }

  /** low-res "light layer": opaque background / haze / glows are painted at ~1/3 resolution and blitted once (cheap) */
  const LLC = { cv: null, g: null, w: 0, h: 0 };
  function llSetup(env) {
    const k = Math.min(0.5, 340 / Math.max(env.W, env.H));
    LLC.w = Math.max(16, Math.round(env.W * k)); LLC.h = Math.max(16, Math.round(env.H * k));
    LLC.cv = u.canvas(LLC.w, LLC.h); LLC.g = LLC.cv.getContext('2d', { alpha: false });
  }
  /** begin: returns the layer context with a transform so that full-resolution coordinates can be used */
  function llBegin(env) {
    const q = LLC.g;
    q.setTransform(LLC.w / env.W, 0, 0, LLC.h / env.H, 0, 0);
    q.globalAlpha = 1; q.globalCompositeOperation = 'source-over';
    return q;
  }
  function llEnd(g, env) {
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.imageSmoothingEnabled = true;
    g.drawImage(LLC.cv, 0, 0, env.W, env.H);
    g.restore();
  }

  let MO = null, BK = null;
  function worldSetup(env) {
    llSetup(env);
    const { W, H, S } = env;
    const Wd = W / S + 0.5, Hd = H / S + 0.5;
    const N = Math.min(360, Math.round(78 * Wd * Hd));
    MO = { N, Wd, Hd, x0: new Float32Array(N), y0: new Float32Array(N), z: new Float32Array(N), ph: new Float32Array(N), vx: new Float32Array(N) };
    for (let i = 0; i < N; i++) {
      MO.x0[i] = (u.hash2(i, 1) - 0.5) * Wd; MO.y0[i] = (u.hash2(i, 2) - 0.5) * Hd;
      MO.z[i] = u.hash2(i, 3); MO.ph[i] = u.hash2(i, 4) * TAU; MO.vx[i] = (u.hash2(i, 5) - 0.5) * 0.006;
    }
    const nb = 10, Wb = W / S + 0.3, Hb = H / S + 0.3;
    BK = { N: nb, Wb, Hb, x0: [], y0: [], sz: [], al: [], ph: [] };
    for (let i = 0; i < nb; i++) {
      BK.x0.push((u.hash2(i, 41) - 0.5) * Wb); BK.y0.push((u.hash2(i, 42) - 0.5) * Hb);
      BK.sz.push(0.03 + 0.045 * u.hash2(i, 43)); BK.al.push(0.035 + 0.04 * u.hash2(i, 44)); BK.ph.push(u.hash2(i, 45) * TAU);
    }
  }
  /** mote i position in S units relative to the screen centre */
  const moteX = (i, T) => u.wrap(MO.x0[i] + MO.vx[i] * T + 0.012 * (0.55 + 0.9 * MO.z[i]) * Math.sin(T * 0.21 + MO.ph[i]), -MO.Wd / 2, MO.Wd / 2);
  const moteY = (i, T) => u.wrap(MO.y0[i] + (0.55 + 0.9 * MO.z[i]) * camY(T) + 0.004 * Math.sin(T * 0.17 + MO.ph[i] * 1.3), -MO.Hd / 2, MO.Hd / 2);
  /* ================================ end shared block ================================ */

  /* ====================================== s1 =========================================== */
  const BEAT_T0 = 2.3, BEAT_P = 2.4;           // lub of beat k at BEAT_T0 + k*BEAT_P
  const ampEnv = (T) => u.keys([[2, 0.18], [4.7, 0.78], [7.1, 1], [9.5, 1], [11.9, 0.4], [13.6, 0]], T, 'smooth');
  /* every beat is a little different: the first ring is small, the second wider, the third a pronounced lub-dub, then the full ring */
  const RING_SC = [0.52, 0.80, 1.0, 1.0, 1.05, 0.9], DUB_A = [0.35, 0.45, 0.95, 0.55, 0.55, 0.4];
  const ringSc = (k) => RING_SC[k < 5 ? k : 5], dubA = (k) => DUB_A[k < 5 ? k : 5];
  const RING_D = 2.4, RING_R = 0.4;            // ring lifetime (s), radius (xS)

  let ringSoft = null, ringFill = null;
  function buildSprites() {
    ringFill = u.sprite('s1|ringfill', 256, 256, (c) => {
      const gr = c.createRadialGradient(128, 128, 0, 128, 128, 128);
      gr.addColorStop(0, 'rgba(40,140,190,0)'); gr.addColorStop(0.55, 'rgba(40,140,190,0.05)');
      gr.addColorStop(0.9, 'rgba(60,170,215,0.22)'); gr.addColorStop(1, 'rgba(50,150,200,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 256, 256);
    });
    ringSoft = u.sprite('s1|ringsoft', 256, 256, (c) => {
      const gr = c.createRadialGradient(128, 128, 0, 128, 128, 128);
      gr.addColorStop(0, 'rgba(60,170,210,0)'); gr.addColorStop(0.55, 'rgba(60,170,210,0)');
      gr.addColorStop(0.86, 'rgba(70,185,225,0.7)'); gr.addColorStop(0.95, 'rgba(60,160,210,0.2)'); gr.addColorStop(1, 'rgba(50,140,200,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 256, 256);
    });
  }

  /* extra dust that only exists while the world is waking (fades out by 13.4 s, before the B1 hand-off) */
  let XM = { N: 0 };
  function extraSetup() {
    const N = Math.round(MO.N * 0.9);
    XM = { N, x0: new Float32Array(N), y0: new Float32Array(N), z: new Float32Array(N), ph: new Float32Array(N), vx: new Float32Array(N) };
    for (let i = 0; i < N; i++) {
      XM.x0[i] = (u.hash2(i, 61) - 0.5) * MO.Wd; XM.y0[i] = (u.hash2(i, 62) - 0.5) * MO.Hd;
      XM.z[i] = u.hash2(i, 63); XM.ph[i] = u.hash2(i, 64) * TAU; XM.vx[i] = (u.hash2(i, 65) - 0.5) * 0.006;
    }
  }

  const tealSpr = () => u.sprite('s1|teal', 64, 64, (c) => {
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(235,255,245,1)'); gr.addColorStop(0.14, 'rgba(150,250,215,0.8)');
    gr.addColorStop(0.4, 'rgba(60,200,170,0.2)'); gr.addColorStop(1, 'rgba(30,150,140,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
  });
  const ringRad = (t, R) => R * (1 - (1 - clamp(t / RING_D)) * (1 - clamp(t / RING_D)));
  const ringList = [];

  Anim.defineScene({
    id: 's1_awakening',

    init(env) { buildSprites(); },
    resize(env) { buildSprites(); hazeSetup(env); worldSetup(env); extraSetup(); },

    render(g, T, L, env) {
      const { W, H, S } = env;
      const cx = W * 0.5, cy = H * 0.5;
      const pin = hero.pins[0];

      /* ---- global envelopes ---- */
      const amp = ampEnv(T);                                      // heartbeat strength
      const bt = hero.beat(T - (BEAT_T0 - 0.144), BEAT_P) * amp;   // current beat 0..1
      const floorV = sstep(8.5, 13.5, T);                         // dust visible everywhere by 13.5
      const heroA = sstep(1.5, 4.2, T);
      const bgA = sstep(5.5, 13, T);                              // deep-water gradient fades in

      /* ---- active rings (lub k and its dub echo) ---- */
      const kNow = Math.floor((T - BEAT_T0) / BEAT_P);
      ringList.length = 0;
      for (let k = kNow; k >= kNow - 2; k--) {
        if (k < 0) continue;
        const tk = BEAT_T0 + k * BEAT_P, a = ampEnv(tk);
        if (a < 0.01) continue;
        const sc = ringSc(k);
        if (T - tk < RING_D + 1.6) ringList.push({ t: T - tk, a, R: RING_R * sc, kind: 0 });
        if (T - (tk + 0.43) > 0 && T - (tk + 0.43) < RING_D * 0.8 + 1.4) ringList.push({ t: T - tk - 0.43, a: a * dubA(k), R: RING_R * 0.62 * (k === 2 ? 1.25 : sc), kind: 1 });
      }

      /* ================= low-res layer: background, haze, halos, soft rings ================= */
      {
        const q = llBegin(env);
        const top = [BG_TOP[0] * bgA, BG_TOP[1] * bgA, BG_TOP[2] * bgA], bot = [BG_BOT[0] * bgA, BG_BOT[1] * bgA, BG_BOT[2] * bgA];
        u.vgrad(q, W, H, [[0, u.css(top)], [1, u.css(bot)]]);
        const hzA = sstep(6, 13, T);
        const hzTint = u.mixc([12, 62, 128], HAZE_TINT, sstep(6.5, 13.5, T));   // the haze starts cold blue and warms to B1's teal
        hazeDraw(q, env, T, 0.21 * hzA * (1 + 0.10 * bt), hzTint, pin.x, pin.y, 3.2);
        q.globalCompositeOperation = 'lighter';
        // heart glow: wide breathing halo that lifts the black around the point
        const lift = heroA * (0.05 + 0.10 * bt) * (1 - 0.6 * sstep(9, 13.5, T)) * (1 - sstep(11, 14, T));
        u.glow(q, cx, cy, S * 0.55, 195, 80, 45, lift, 'soft');
        u.glow(q, cx, cy, S * 0.20, 190, 80, 55, heroA * (0.07 + 0.22 * bt) * (1 - sstep(10.5, 13.8, T)), 'soft');
        // faint out-of-focus discs close to the lens
        const bk = bokehSpr();
        for (let i = 0; i < BK.N; i++) {
          const x = u.wrap(BK.x0[i] + 0.01 * Math.sin(T * 0.11 + BK.ph[i]), -BK.Wb / 2, BK.Wb / 2);
          const y = u.wrap(BK.y0[i] + 1.9 * camY(T), -BK.Hb / 2, BK.Hb / 2);
          const dn = Math.hypot(x, y);
          const v = Math.max(floorV * 0.9, Math.exp(-dn * dn * 2.2) * heroA * (0.42 + 0.58 * bt) * 0.7) * BK.al[i] * (0.7 + 0.3 * Math.sin(T * 0.4 + BK.ph[i]));
          if (v < 0.004) continue;
          const rr = BK.sz[i] * S;
          q.globalAlpha = v;
          q.drawImage(bk, cx + x * S - rr, cy + y * S - rr, rr * 2, rr * 2);
        }
        // the soft glow of every ring (fill inside + diffuse band)
        for (let i = 0; i < ringList.length; i++) {
          const rg = ringList[i];
          if (rg.t < 0 || rg.t > RING_D) continue;
          const rr = ringRad(rg.t, rg.R) * S;
          const a = rg.a * Math.pow(1 - rg.t / RING_D, 1.5) * clamp(rg.t / 0.08) * (rg.kind ? 0.7 : 1);
          if (a < 0.004 || rr < 2) continue;
          const sf = sstep(0.06, 0.5, rg.t);
          q.globalAlpha = Math.min(1, a * 0.7 * sf);
          q.drawImage(ringFill, cx - rr / 0.9, cy - rr / 0.9, rr / 0.9 * 2, rr / 0.9 * 2);
          q.globalAlpha = Math.min(1, a * 0.8 * sf);
          const R2 = rr / 0.86 * 1.02;
          q.drawImage(ringSoft, cx - R2, cy - R2, R2 * 2, R2 * 2);
        }
        q.globalAlpha = 1;
        llEnd(g, env);
      }

      g.save();
      g.globalCompositeOperation = 'lighter';

      /* ---- dust motes: visible only where the light reaches ---- */
      {
        const dot = dotSpr();
        const reach = u.lerp(0.26, 0.52, sstep(3, 12, T));
        const lightLvl = heroA * (0.42 + 0.58 * bt);              // dust brightens with every beat
        const N = MO.N, NT = N + XM.N;
        const xFade = 1 - sstep(9.5, 13.4, T);
        for (let i = 0; i < NT; i++) {
          const ex = i >= N, j = ex ? i - N : i;
          let x, y, z, ph;
          if (!ex) { x = moteX(i, T); y = moteY(i, T); z = MO.z[i]; ph = MO.ph[i]; }
          else {
            if (xFade < 0.003) continue;
            z = XM.z[j]; ph = XM.ph[j];
            x = u.wrap(XM.x0[j] + XM.vx[j] * T + 0.012 * (0.55 + 0.9 * z) * Math.sin(T * 0.21 + ph), -MO.Wd / 2, MO.Wd / 2);
            y = u.wrap(XM.y0[j] + (0.55 + 0.9 * z) * camY(T) + 0.004 * Math.sin(T * 0.17 + ph * 1.3), -MO.Hd / 2, MO.Hd / 2);
          }
          const dn = Math.hypot(x, y);
          const rd = dn / reach;
          const vis = Math.exp(-rd * rd * 1.6) * lightLvl;
          let lit = 0;
          for (let q = 0; q < ringList.length; q++) {
            const rg = ringList[q];
            if (dn > rg.R) continue;
            const tp = RING_D * (1 - Math.sqrt(1 - dn / rg.R));    // moment the front crosses this mote
            const dt = rg.t - tp;
            if (dt > 0) lit += Math.exp(-dt / (1.0 + 0.4 * z)) * rg.a * (1 - 0.5 * dn / rg.R);
            else if (dt > -0.14) lit += (1 + dt / 0.14) * rg.a * 1.0;
          }
          const a = (0.16 + 0.34 * z) * (0.6 + 0.4 * Math.sin(T * (0.5 + ph * 0.2) + ph));
          let v = (ex ? 0 : Math.max(floorV, vis)) * a + lit * (0.4 + 0.6 * z);
          if (ex) v = (vis * a * 0.8 + lit * (0.4 + 0.6 * z)) * xFade;
          if (v < 0.01) continue;
          const rr = S * (0.0016 + 0.0036 * z) * (1 + lit * 1.1) * 2.4;
          g.globalAlpha = v > 1 ? 1 : v;
          g.drawImage(dot, cx + x * S - rr, cy + y * S - rr, rr * 2, rr * 2);
        }

        /* ---- a slow stream of plankton glints drifts through (9.5-14.5 s): the first hint of the life that waits in B1/s2 ---- */
        const gE = sstep(9.6, 11.8, T) * (1 - sstep(13.2, 14.6, T));
        if (gE > 0.01) {
          const tl = tealSpr(), span = (W / S + 0.5);
          for (let i = 0; i < 34; i++) {
            const h1 = u.hash2(i, 301), h2 = u.hash2(i, 302), h3 = u.hash2(i, 303);
            const sp = u.wrap(i / 34 + 0.012 * (T - 9.5) * (0.8 + 0.5 * h3), 0, 1);
            const x = (sp - 0.5) * span, bx = 0.18 * Math.sin(sp * 5.0 + 0.6) + 0.15 * (0.5 - sp);
            const y = bx + (h1 - 0.5) * 0.07 + 0.012 * Math.sin(T * 0.9 + h2 * TAU);
            const edge = Math.sin(Math.PI * sp);
            const tw = 0.35 + 0.65 * Math.pow(0.5 + 0.5 * Math.sin(T * (1.6 + 2 * h2) + h1 * 20), 2);
            const aa = gE * edge * tw * (0.5 + 0.4 * h3);
            if (aa < 0.01) continue;
            const rr = S * (0.0045 + 0.004 * h2) * 2.4;
            g.globalAlpha = aa > 1 ? 1 : aa;
            g.drawImage(tl, cx + x * S - rr, cy + y * S - rr, rr * 2, rr * 2);
          }
        }

        /* ---- beat rings: crisp hairline on top of the soft glow ---- */
        g.lineCap = 'butt';
        for (let q = 0; q < ringList.length; q++) {
          const rg = ringList[q];
          if (rg.t < 0 || rg.t > RING_D) continue;
          const rr = ringRad(rg.t, rg.R) * S;
          const a = rg.a * Math.pow(1 - rg.t / RING_D, 1.5) * clamp(rg.t / 0.08) * (rg.kind ? 0.7 : 1);
          if (a < 0.004 || rr < 2) continue;
          g.beginPath(); g.arc(cx, cy, rr, 0, TAU);
          const soft = sstep(0.06, 0.5, rg.t);                        // the broad glow only grows in once the ring has left the hero
          g.globalAlpha = Math.min(1, a * 0.16 * soft); g.strokeStyle = 'rgb(80,180,228)'; g.lineWidth = Math.min(Math.max(14, S * 0.040), rr * 0.8); g.stroke();
          g.globalAlpha = Math.min(1, a * 0.22 * soft); g.strokeStyle = 'rgb(100,200,238)'; g.lineWidth = Math.min(Math.max(8, S * 0.016), rr * 0.6); g.stroke();
          g.globalAlpha = Math.min(1, a * 0.38); g.strokeStyle = 'rgb(140,225,247)'; g.lineWidth = Math.min(Math.max(3.5, S * 0.0055), rr * 0.4); g.stroke();
          g.globalAlpha = Math.min(1, a * 0.95); g.strokeStyle = 'rgb(225,252,255)'; g.lineWidth = Math.min(Math.max(1.3, S * 0.0021), rr * 0.25); g.stroke();
        }

        /* ---- sparks born from each beat, drifting outward like fireflies ---- */
        const sparkFade = 1 - sstep(13.0, 14.8, T);
        for (let k = Math.max(0, kNow - 1); k <= kNow && sparkFade > 0.003; k++) {
          const tk = BEAT_T0 + k * BEAT_P, a0 = ampEnv(tk);
          if (a0 < 0.05) continue;
          const t = T - tk;
          if (t < 0 || t > 4.2) continue;
          const f = t / 4.2;
          for (let j = 0; j < 14; j++) {
            const ang = u.hash2(k * 31 + j, 91) * TAU + 0.35 * f * (j % 2 ? 1 : -1);
            const dist = (0.06 + 0.26 * u.hash2(k * 31 + j, 92)) * S * (1 - Math.pow(1 - f, 2.2));
            const al = a0 * Math.sin(Math.PI * Math.pow(f, 0.6)) * (0.5 + 0.5 * Math.sin(T * 3 + j * 1.7)) * 0.9 * sparkFade;
            if (al < 0.01) continue;
            const rr = S * (0.0035 + 0.003 * u.hash2(k * 31 + j, 93)) * 2.4;
            g.globalAlpha = al > 1 ? 1 : al;
            g.drawImage(dot, cx + Math.cos(ang) * dist - rr, cy + Math.sin(ang) * dist - rr, rr * 2, rr * 2);
          }
        }
      }
      g.restore();

      /* ---- the hero ---- */
      {
        const rS = u.lerp(0.55, 1, sstep(2, 9, T));   // 0.55 = the seam point (matches the end of s8)
        const wob = 1 + 0.06 * Math.sin(T * 2.4) * sstep(11, 14, T);
        const pulse = rS * (1 + 0.9 * bt) * wob;
        hero.draw(g, cx, cy, pin.r * S, {
          hue: pin.hue, form: pin.form, a: 0.85 + 0.15 * heroA, pulse, glow: 0.75 + 0.25 * heroA + 1.3 * bt, flare: 0.5 * bt * bt,  // T=0 == the last frame of s8 (loop seam)
        });
      }
    },
  });
})();

<script>/* src/scenes/s2_deepsea.js */
/* ひとしずくの旅 — s2_deepsea (T 14–48) 深海
 *
 * The camera rises through the dark water. 18–28 a plankton swarm spirals round the light as if greeting
 * it; 23–40 jellyfish drift past; 28–44 a whale, huge and slow, crosses behind the hero; 36–48 the water
 * brightens, light shafts reach down and a silver school sweeps through. Opens on the B1 world shared with
 * s1_awakening (block below is identical in both files) and ends on the B2 world that s3_surface continues.
 */
(function () {
  const { util: u, hero } = Anim;

  /* ===================== shared "B1 world" (identical in s1 and s2) ===================== */
  const TAU = u.TAU, sstep = u.smoothstep, clamp = u.clamp;
  const BG_TOP = [4, 20, 42], BG_BOT = [1, 4, 9];
  const HAZE_TINT = [20, 105, 125];
  const CAM_DT = 0.05;
  const camV = (t) => 0.02 * sstep(9, 14, t) + 0.03 * sstep(18, 40, t);
  const CAM = new Float32Array(Math.ceil(70 / CAM_DT) + 2);
  (() => { let acc = 0; for (let i = 1; i < CAM.length; i++) { acc += 0.5 * (camV((i - 1) * CAM_DT) + camV(i * CAM_DT)) * CAM_DT; CAM[i] = acc; } })();
  const camY = (T) => { const x = clamp(T, 0, 69.9) / CAM_DT, i = x | 0; return CAM[i] + (CAM[i + 1] - CAM[i]) * (x - i); };

  const dotSpr = () => u.sprite('s12|dot', 64, 64, (c) => {
    const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
    gr.addColorStop(0, 'rgba(240,255,255,1)'); gr.addColorStop(0.14, 'rgba(170,240,250,0.8)');
    gr.addColorStop(0.4, 'rgba(70,180,210,0.2)'); gr.addColorStop(1, 'rgba(30,120,170,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
  });
  const bokehSpr = () => u.sprite('s12|bokeh', 96, 96, (c) => {
    const gr = c.createRadialGradient(48, 48, 0, 48, 48, 48);
    gr.addColorStop(0, 'rgba(120,210,230,0.55)'); gr.addColorStop(0.6, 'rgba(110,200,225,0.6)');
    gr.addColorStop(0.82, 'rgba(150,225,240,0.85)'); gr.addColorStop(0.93, 'rgba(110,200,225,0.25)'); gr.addColorStop(1, 'rgba(90,180,210,0)');
    c.fillStyle = gr; c.fillRect(0, 0, 96, 96);
  });

  const HZ = { cols: 0, rows: 0, cv: null, cx: null, img: null, dith: null };
  function hazeSetup(env) {
    const n = 2000;
    HZ.cols = Math.max(24, Math.round(Math.sqrt(n * env.W / env.H)));
    HZ.rows = Math.max(24, Math.round(Math.sqrt(n * env.H / env.W)));
    HZ.cv = u.canvas(HZ.cols, HZ.rows); HZ.cx = HZ.cv.getContext('2d');
    HZ.img = HZ.cx.createImageData(HZ.cols, HZ.rows);
    HZ.dith = new Float32Array(HZ.cols * HZ.rows);
    const r = u.rng(777);
    for (let i = 0; i < HZ.dith.length; i++) HZ.dith[i] = r() - 0.5;
  }
  /** teal volumetric haze: low-res fbm field, brightest around (hx,hy) (normalised), drawn additively */
  function hazeDraw(g, env, T, amp, tint, hx, hy, spread) {
    if (amp <= 0.002) return;
    const { W, H, S } = env, cols = HZ.cols, rows = HZ.rows, d = HZ.img.data;
    const t1 = T * 0.021, t2 = T * 0.017;
    let p = 0, q = 0;
    for (let j = 0; j < rows; j++) {
      const yy = ((j + 0.5) / rows * H - hy * H) / S;
      for (let i = 0; i < cols; i++) {
        const xx = ((i + 0.5) / cols * W - hx * W) / S;
        const wx = xx + 0.22 * (u.noise2(xx * 1.1 + t1 * 1.7 + 5.3, yy * 1.1 + 2.1) - 0.5);
        const wy = yy + 0.22 * (u.noise2(xx * 1.1 + 9.7, yy * 1.1 - t2 * 1.9 + 4.4) - 0.5);
        const xr = wx * 0.866 - wy * 0.5, yr = wx * 0.5 + wy * 0.866;
        const n = u.fbm2(xr * 1.7 + t1 + 3.1, yr * 1.7 - t2 + 7.7, 2);
        const s = clamp((n - 0.3) / 0.45);
        const d2 = xx * xx + yy * yy;
        const I = amp * (Math.exp(-d2 * spread) * (0.5 + 0.75 * s) + 0.40 * Math.exp(-Math.sqrt(d2) * 1.05) * (0.30 + 0.85 * s));
        const dz = HZ.dith[q++];
        d[p++] = tint[0] * I + dz; d[p++] = tint[1] * I + dz; d[p++] = tint[2] * I + dz; d[p++] = 255;
      }
    }
    HZ.cx.putImageData(HZ.img, 0, 0);
    g.save();
    g.globalCompositeOperation = 'lighter'; g.imageSmoothingEnabled = true; g.globalAlpha = 1;
    g.drawImage(HZ.cv, 0, 0, W, H);
    g.restore();
  }

  /** low-res "light layer": opaque background / haze / glows are painted at ~1/3 resolution and blitted once (cheap) */
  const LLC = { cv: null, g: null, w: 0, h: 0 };
  function llSetup(env) {
    const k = Math.min(0.5, 340 / Math.max(env.W, env.H));
    LLC.w = Math.max(16, Math.round(env.W * k)); LLC.h = Math.max(16, Math.round(env.H * k));
    LLC.cv = u.canvas(LLC.w, LLC.h); LLC.g = LLC.cv.getContext('2d', { alpha: false });
  }
  /** begin: returns the layer context with a transform so that full-resolution coordinates can be used */
  function llBegin(env) {
    const q = LLC.g;
    q.setTransform(LLC.w / env.W, 0, 0, LLC.h / env.H, 0, 0);
    q.globalAlpha = 1; q.globalCompositeOperation = 'source-over';
    return q;
  }
  function llEnd(g, env) {
    g.save();
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; g.imageSmoothingEnabled = true;
    g.drawImage(LLC.cv, 0, 0, env.W, env.H);
    g.restore();
  }

  let MO = null, BK = null;
  function worldSetup(env) {
    llSetup(env);
    const { W, H, S } = env;
    const Wd = W / S + 0.5, Hd = H / S + 0.5;
    const N = Math.min(360, Math.round(78 * Wd * Hd));
    MO = { N, Wd, Hd, x0: new Float32Array(N), y0: new Float32Array(N), z: new Float32Array(N), ph: new Float32Array(N), vx: new Float32Array(N) };
    for (let i = 0; i < N; i++) {
      MO.x0[i] = (u.hash2(i, 1) - 0.5) * Wd; MO.y0[i] = (u.hash2(i, 2) - 0.5) * Hd;
      MO.z[i] = u.hash2(i, 3); MO.ph[i] = u.hash2(i, 4) * TAU; MO.vx[i] = (u.hash2(i, 5) - 0.5) * 0.006;
    }
    const nb = 10, Wb = W / S + 0.3, Hb = H / S + 0.3;
    BK = { N: nb, Wb, Hb, x0: [], y0: [], sz: [], al: [], ph: [] };
    for (let i = 0; i < nb; i++) {
      BK.x0.push((u.hash2(i, 41) - 0.5) * Wb); BK.y0.push((u.hash2(i, 42) - 0.5) * Hb);
      BK.sz.push(0.03 + 0.045 * u.hash2(i, 43)); BK.al.push(0.035 + 0.04 * u.hash2(i, 44)); BK.ph.push(u.hash2(i, 45) * TAU);
    }
  }
  /** mote i position in S units relative to the screen centre */
  const moteX = (i, T) => u.wrap(MO.x0[i] + MO.vx[i] * T + 0.012 * (0.55 + 0.9 * MO.z[i]) * Math.sin(T * 0.21 + MO.ph[i]), -MO.Wd / 2, MO.Wd / 2);
  const moteY = (i, T) => u.wrap(MO.y0[i] + (0.55 + 0.9 * MO.z[i]) * camY(T) + 0.004 * Math.sin(T * 0.17 + MO.ph[i] * 1.3), -MO.Hd / 2, MO.Hd / 2);
  /* ================================ end shared block ================================ */

  /* ====================================== s2 =========================================== */
  const lerp = u.lerp;
  const WTOP = [[14, [4, 20, 42]], [20, [5, 26, 48]], [27, [7, 34, 58]], [33, [9, 46, 74]], [39, [12, 78, 106]], [44, [15, 104, 136]]];
  const WBOT = [[14, [1, 4, 9]], [20, [2, 7, 15]], [27, [3, 12, 23]], [33, [4, 18, 32]], [39, [5, 31, 50]], [44, [6, 41, 62]]];

  const heroY = (T) => 0.5 + 0.06 * sstep(30, 44, T);

  /* ---------- sprites ---------- */
  const spr = {};
  const TK = 0.64;
  function buildSprites() {
    spr.dot = dotSpr();
    spr.bokeh = bokehSpr();
    spr.teal = u.sprite('s2|dotteal', 64, 64, (c) => {
      const gr = c.createRadialGradient(32, 32, 0, 32, 32, 32);
      gr.addColorStop(0, 'rgba(235,255,245,1)'); gr.addColorStop(0.14, 'rgba(150,250,215,0.8)');
      gr.addColorStop(0.4, 'rgba(60,200,170,0.2)'); gr.addColorStop(1, 'rgba(30,150,140,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 64, 64);
    });
    spr.shaft = u.sprite('s2|shaft', 128, 512, (c, w, h) => {
      const gx = c.createLinearGradient(0, 0, w, 0);
      gx.addColorStop(0, 'rgba(190,240,255,0)'); gx.addColorStop(0.3, 'rgba(190,240,255,0.32)');
      gx.addColorStop(0.5, 'rgba(220,250,255,0.85)'); gx.addColorStop(0.7, 'rgba(190,240,255,0.32)'); gx.addColorStop(1, 'rgba(190,240,255,0)');
      c.fillStyle = gx; c.fillRect(0, 0, w, h);
      c.globalCompositeOperation = 'destination-in';
      const gy = c.createLinearGradient(0, 0, 0, h);
      gy.addColorStop(0, 'rgba(0,0,0,0)'); gy.addColorStop(0.07, 'rgba(0,0,0,1)'); gy.addColorStop(0.42, 'rgba(0,0,0,0.42)'); gy.addColorStop(1, 'rgba(0,0,0,0)');
      c.fillStyle = gy; c.fillRect(0, 0, w, h);
    });
    // tight versions of the two mote sprites: the same core and halo, compressed so that the faint outer tail is cut (drawn at TK x the radius) -> ~60% less fill
    spr.dotT = u.sprite('s2|dotT', 48, 48, (c) => {
      const gr = c.createRadialGradient(24, 24, 0, 24, 24, 24);
      gr.addColorStop(0, 'rgba(240,255,255,1)'); gr.addColorStop(0.14 / TK, 'rgba(170,240,250,0.8)');
      gr.addColorStop(0.4 / TK, 'rgba(70,180,210,0.22)'); gr.addColorStop(1, 'rgba(30,120,170,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 48, 48);
    });
    spr.tealT = u.sprite('s2|tealT', 48, 48, (c) => {
      const gr = c.createRadialGradient(24, 24, 0, 24, 24, 24);
      gr.addColorStop(0, 'rgba(235,255,245,1)'); gr.addColorStop(0.14 / TK, 'rgba(150,250,215,0.8)');
      gr.addColorStop(0.4 / TK, 'rgba(60,200,170,0.22)'); gr.addColorStop(1, 'rgba(30,150,140,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 48, 48);
    });
    // fish: tapered body, forked tail at the left, bright back and a glint near the head (drawn heading +x)
    spr.fish = u.sprite('s2|fish2', 64, 16, (c, w, h) => {
      const gr = c.createLinearGradient(0, 0, w, 0);
      gr.addColorStop(0, 'rgba(200,228,248,0)'); gr.addColorStop(0.22, 'rgba(215,238,252,0.55)'); gr.addColorStop(0.6, 'rgba(240,252,255,0.95)'); gr.addColorStop(0.9, 'rgba(255,255,255,1)'); gr.addColorStop(1, 'rgba(230,245,255,0)');
      c.fillStyle = gr;
      c.beginPath();
      c.moveTo(w * 0.99, h * 0.5);
      c.bezierCurveTo(w * 0.88, h * 0.16, w * 0.60, h * 0.13, w * 0.30, h * 0.44);
      c.lineTo(w * 0.02, h * 0.10); c.quadraticCurveTo(w * 0.12, h * 0.5, w * 0.02, h * 0.90); c.lineTo(w * 0.30, h * 0.56);
      c.bezierCurveTo(w * 0.60, h * 0.87, w * 0.88, h * 0.84, w * 0.99, h * 0.5);
      c.fill();
      c.globalCompositeOperation = 'lighter';
      const lg = c.createLinearGradient(0, h * 0.2, 0, h * 0.5);
      lg.addColorStop(0, 'rgba(255,255,255,0.55)'); lg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = lg; c.beginPath(); c.ellipse(w * 0.66, h * 0.34, w * 0.2, h * 0.12, 0, 0, TAU); c.fill();
    });
    spr.bubble = u.sprite('s2|bubble', 48, 48, (c) => {
      const gr = c.createRadialGradient(24, 24, 0, 24, 24, 24);
      gr.addColorStop(0, 'rgba(150,220,240,0.04)'); gr.addColorStop(0.62, 'rgba(150,225,245,0.10)'); gr.addColorStop(0.86, 'rgba(210,248,255,0.62)'); gr.addColorStop(0.95, 'rgba(160,230,248,0.20)'); gr.addColorStop(1, 'rgba(150,225,245,0)');
      c.fillStyle = gr; c.fillRect(0, 0, 48, 48);
      const hg = c.createRadialGradient(16, 15, 0, 16, 15, 7);
      hg.addColorStop(0, 'rgba(255,255,255,0.9)'); hg.addColorStop(1, 'rgba(255,255,255,0)');
      c.fillStyle = hg; c.fillRect(0, 0, 48, 48);
    });
  }

  /* ---------- plankton swarm data (resolution independent) ---------- */
  const NP = 330;
  const PK = { a: new Uint8Array(NP), p: new Float32Array(NP), j1: new Float32Array(NP), j2: new Float32Array(NP), ph: new Float32Array(NP), sz: new Float32Array(NP), ang: new Float32Array(NP), teal: new Uint8Array(NP), dsp: new Float32Array(NP) };
  /* extra marine snow that thickens towards B2 */
  const NS = 170;
  const SN = { x0: new Float32Array(NS), y0: new Float32Array(NS), z: new Float32Array(NS), ph: new Float32Array(NS), t: new Float32Array(NS) };
  /* flashers */
  const NF = 28;
  const FL = { x: new Float32Array(NF), y: new Float32Array(NF), per: new Float32Array(NF), ph: new Float32Array(NF), sz: new Float32Array(NF) };
  /* fish */
  const NFISH = 110;
  const FS = { a: new Float32Array(NFISH), b: new Float32Array(NFISH), ph: new Float32Array(NFISH), sz: new Float32Array(NFISH), sp: new Float32Array(NFISH) };
  /* the surge before B2: a nearer school, falling streaks, rising bubbles */
  const NFS2 = 34, NSK = 34, NBB = 12;
  const FS2 = { a: new Float32Array(NFS2), b: new Float32Array(NFS2), ph: new Float32Array(NFS2), sz: new Float32Array(NFS2) };
  const SKS = { x0: new Float32Array(NSK), y0: new Float32Array(NSK), z: new Float32Array(NSK) };
  const BUB = { x0: new Float32Array(NBB), y0: new Float32Array(NBB), r: new Float32Array(NBB), v: new Float32Array(NBB), ph: new Float32Array(NBB) };
  /* whale trail glints */
  const NTR = 44;

  /* ---------- jellyfish layout ---------- */
  // t0,t1 life; p0->p1 path in S units from screen centre (landscape reference); R bell radius (S); hue; z layer 0 far,1 mid,2 near
  const JBASE = [
    { t0: 21.0, t1: 37.5, p0: [-0.66, 0.78], p1: [-0.40, -0.70], R: 0.135, hue: 312, z: 2, ph: 0.0 },
    { t0: 22.0, t1: 36.5, p0: [0.58, 0.86], p1: [0.50, -0.62], R: 0.105, hue: 192, z: 1, ph: 0.7 },
    { t0: 23.0, t1: 35.5, p0: [0.24, 1.0], p1: [0.18, -0.55], R: 0.075, hue: 268, z: 1, ph: 1.4 },
    { t0: 24.0, t1: 36.0, p0: [-0.26, 0.95], p1: [-0.16, -0.60], R: 0.062, hue: 335, z: 1, ph: 0.3 },
    { t0: 24.5, t1: 38.5, p0: [0.98, 1.0], p1: [0.82, -0.50], R: 0.19, hue: 278, z: 2, ph: 1.0, soft: true },
    { t0: 21.5, t1: 34.0, p0: [-0.92, 0.40], p1: [-0.80, -0.50], R: 0.034, hue: 188, z: 0, ph: 0.2 },
    { t0: 22.5, t1: 33.5, p0: [0.92, 0.55], p1: [0.74, -0.30], R: 0.030, hue: 300, z: 0, ph: 1.1 },
    { t0: 23.5, t1: 35.0, p0: [0.05, 0.12], p1: [0.0, -0.62], R: 0.038, hue: 200, z: 0, ph: 0.6 },
  ];
  let JEL = JBASE;

  /* ---------- whale ---------- */
  const WH = { cv: null, cw: 0, ch: 0, sc: 0.5, L: 0, oy: 0 };
  // outline control points in body space: x 0 (tail tip) .. 1 (nose), y in units of body length (+ down)
  const TOP = [[1.0, 0.021], [0.995, 0.009], [0.985, -0.001], [0.965, -0.011], [0.94, -0.021], [0.91, -0.031], [0.88, -0.042], [0.845, -0.052], [0.80, -0.061], [0.75, -0.069], [0.69, -0.075], [0.61, -0.077], [0.52, -0.072], [0.44, -0.062], [0.375, -0.051], [0.340, -0.046], [0.318, -0.054], [0.298, -0.048], [0.265, -0.039], [0.21, -0.031], [0.15, -0.026], [0.10, -0.022]];
  const BOT = [[1.0, 0.030], [0.996, 0.038], [0.985, 0.048], [0.965, 0.060], [0.94, 0.072], [0.90, 0.084], [0.86, 0.092], [0.82, 0.096], [0.76, 0.097], [0.70, 0.094], [0.62, 0.086], [0.53, 0.075], [0.44, 0.061], [0.36, 0.048], [0.28, 0.037], [0.20, 0.029], [0.14, 0.024], [0.10, 0.020]];
  const topY = (xn) => ptsY(TOP, xn), botY = (xn) => ptsY(BOT, xn);
  function ptsY(P, xn) { // P sorted x descending, linear interpolation
    if (xn >= P[0][0]) return P[0][1];
    for (let i = 0; i < P.length - 1; i++) if (xn <= P[i][0] && xn >= P[i + 1][0]) { const f = (P[i][0] - xn) / (P[i][0] - P[i + 1][0]); return P[i][1] + (P[i + 1][1] - P[i][1]) * f; }
    return P[P.length - 1][1];

  /* ================================== jellyfish =================================== */

  function jellyPoses(T, env) {

  const TT = new Float32Array(13 * 14 * 2);

  /* =================================== fish school ================================= */
