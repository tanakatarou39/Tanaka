        g.fillStyle = `rgb(${(top[0] + (bot[0] - top[0]) * t) | 0},${(top[1] + (bot[1] - top[1]) * t) | 0},${(top[2] + (bot[2] - top[2]) * t) | 0})`;
        g.fillRect(0, y, W, bh + 1);
      }
    }
    g.globalCompositeOperation = 'lighter';
    // horizon glow line + soft sheen (the mirror reflects the horizon glow)
    const y0 = yH;
    let gr = g.createLinearGradient(0, y0 - 0.07 * S, 0, y0 + 0.006 * S);
    gr.addColorStop(0, 'rgba(30,48,110,0)'); gr.addColorStop(0.75, `rgba(40,62,130,${0.12 * glow})`); gr.addColorStop(0.92, `rgba(70,95,170,${0.09 * glow})`); gr.addColorStop(1, 'rgba(60,85,160,0)');
    g.fillStyle = gr; g.fillRect(0, y0 - 0.07 * S, W, 0.076 * S);
    gr = g.createLinearGradient(0, y0, 0, y0 + 0.16 * S);
    gr.addColorStop(0, `rgba(22,36,84,${0.22 * glow})`); gr.addColorStop(1, 'rgba(10,18,50,0)');
    g.fillStyle = gr; g.fillRect(0, y0, W, 0.16 * S);
    g.globalCompositeOperation = 'source-over';
  }

  function drawReflections(g, T, cam, boost, hx0, hy0) {
    const { W, H, S, pivY } = R;
    const yH = cam.yH;
    if (yH > H - 2) return;
    const ra = ss(162.5, 166.5, T);
    if (ra < 0.01) return;
    const th = cam.th, cT = cos(th), sT = sin(th);
    g.globalCompositeOperation = 'lighter';
    const seaH = H - yH;
    const refl = SKY.refl;
    const NS = 4;
    for (let i = 0; i < refl.length; i++) {
      const s = refl[i];
      const ry = s.dy * cT + s.dx * sT + pivY;
      if (ry < 0.02) continue;
      const Ym = yH + ry * S * 0.5;
      if (Ym > H + 20) continue;
      const X = W / 2 + (s.dx * cT - s.dy * sT) * S;
      if (X < -10 || X > W + 10) continue;
      let a = s.b * (1 - s.tw * (0.5 + 0.5 * sin(T * s.f + s.ph))) * (s.kind === 2 ? 1 : 0.4);
      a *= ra * (0.2 + 0.8 * ss(0, 0.25, ry));
      if (a < 0.03) continue;
      const len = S * (0.035 + 0.075 * s.b) * (s.kind === 2 ? 1.5 : 1);
      const wd = S * (s.kind === 2 ? 0.05 : 0.03);
      const sl = len / NS;
      for (let q = 0; q < NS; q++) {
        const fq = (q + 0.5) / NS;
        const fl = 0.45 + 0.55 * sin(T * (1.7 + 0.5 * q) + s.ph * 3 + q * 2.3);
        const off = sin(T * 0.9 + s.ph * 2 + q * 1.9) * S * 0.004;
        g.globalAlpha = a * 0.3 * fl * (1 - fq * 0.55);
        g.drawImage(SP.streak, X + off - wd / 2, Ym - len / 2 + q * sl, wd, sl * 2.0);
      }
    }
    // faint aurora glow in the water + a few quiet glints of the surface
    const AA = ss(159.3, 162.3, T) * (1 - ss(163.2, 166.0, T)) * ss(163.0, 165, T);
    if (AA > 0.02) {
      for (let q = 0; q < 10; q++) {
        const x = W * (0.08 + 0.84 * hash1(q * 7 + 3)) + sin(T * 0.3 + q) * S * 0.02;
        const fl = 0.5 + 0.5 * sin(T * (0.5 + 0.1 * q) + q * 2.3);
        const wd = S * (0.06 + 0.05 * hash1(q * 5 + 1));
        g.globalAlpha = AA * 0.22 * fl;
        g.drawImage(SP.streakG, x - wd / 2, yH + 0.004 * S, wd, min(seaH, S * 0.22));
      }
    }
    g.fillStyle = 'rgb(150,180,255)';
    for (let q = 0; q < 22; q++) {
      const t0 = pow(hash1(q * 13 + 5), 1.6);
      const y = yH + 0.01 * H + t0 * seaH * 0.95;
      const x = (hash1(q * 17 + 9) + 0.02 * sin(T * 0.2 + q)) * W;
      const wd = S * (0.015 + 0.05 * (0.3 + t0));
      const fl = pow(0.5 + 0.5 * sin(T * (0.6 + 0.4 * hash1(q * 3)) + q * 2.7), 2);
      g.globalAlpha = ra * 0.16 * fl * (0.4 + 0.6 * (1 - t0));
      g.fillRect(x - wd / 2, y, wd, max(1, S * (0.0012 + 0.002 * t0)));
    }
    // the constellation, mirrored in the water
    const cs = R.cs, cra = ra * ss(163.5, 166, T) * (1 - ss(165.0, 166.8, T));
    for (let i = 0; i < CONS.length; i++) {
      const X = hx0 + CONS[i][0] * cs, Y = hy0 + CONS[i][1] * cs;
      const Ym = yH + (yH - Y) * 0.5;
      if (Ym < yH || Ym > H + 20) continue;
      const fl = 0.55 + 0.45 * sin(T * (1.4 + i * 0.23) + i * 1.9);
      const off = sin(T * 0.8 + i * 2.3) * S * 0.004;
      const wd = S * 0.04, len = S * 0.08;
      for (let q = 0; q < 3; q++) {
        const fq = (q + 0.5) / 3;
        g.globalAlpha = cra * 0.34 * fl * (1 - fq * 0.6);
        g.drawImage(SP.streak, X + off * (q + 1) * 0.5 - wd / 2, Ym - len / 2 + q * len / 3, wd, len / 3 * 2.0);
      }
    }
    // the hero's path of light on the water: a broad soft column with glints
    const hx = W / 2;
    const pa = ss(163.8, 167, T);
    if (pa > 0.01) {
      for (let q = 0; q < 8; q++) {
        const t0 = q / 8;
        const yy = yH + t0 * seaH;
        const off = sin(T * 1.1 + q * 1.7) * S * 0.007 * (0.4 + t0);
        const fl = 0.55 + 0.45 * sin(T * (1.3 + q * 0.31) + q * 2.1);
        g.globalAlpha = pa * 0.2 * pow(1 - t0 * 0.8, 1.2) * fl;
        const wd = S * (0.02 + 0.07 * t0);
        g.drawImage(SP.streak, hx + off - wd / 2, yy, wd, seaH / 8 * 2.2);
      }
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  const _fp = [0, 0, 0, 0, 0];
  // petal flight position in sky coordinates (x, y) + path direction (dx, dy) at time Tq
  function flightXY(s, p, Tq, cT, sT, pivY) {
    const tau = clamp((Tq - p.tl) / p.d, 0, 1);
    const e0 = tau * tau * (3 - 2 * tau);
    const e = lerp(tau, e0, 0.85);
    const ex = s.dx * cT - s.dy * sT, ey = s.dy * cT + s.dx * sT + pivY;
    const dx = ex - p.x0, dy = ey - p.y0, L = hypot(dx, dy) || 1;
    const nz = (u.noise1(p.g * 9.1 + e * 2.6 + Tq * 0.3 + p.jit) * 2 - 1) + 0.35 * sin(e * 11 + p.jit);
    const w = sin(PI * e) * p.amp * nz;
    _fp[0] = p.x0 + dx * e - dy / L * w; _fp[1] = p.y0 + dy * e + dx / L * w; _fp[2] = dx; _fp[3] = dy; _fp[4] = nz;
    return _fp;
  }
  function drawFlights(g, T, cam) {
    const { W, H, S, pivY } = R;
    const yH = cam.yH, th = cam.th, cT = cos(th), sT = sin(th);
    const fl = SKY.flights, ramp = 0.25 + 0.9 * ss(153, 157, T);
    g.globalCompositeOperation = 'lighter';
    for (let i = 0, n = fl.length; i < n; i++) {
      const s = fl[i], p = s.pet;
      const tau = (T - p.tl) / p.d;
      if (tau <= 0 || tau >= 1) continue;
      const vis = clamp((ramp - hash1(i * 13 + 7)) / 0.15, 0, 1);   // the stream thickens gradually from T=153 (25 % -> 100 % by 157)
      if (vis < 0.01) continue;
      const a = flightXY(s, p, T, cT, sT, pivY);
      const X = W / 2 + a[0] * S, Y = yH - a[1] * S;
      if (X < -20 || X > W + 20 || Y < -20 || Y > H + 20) continue;
      const nz = a[4];
      const m = ss(0.5, 1, tau), sz = S * p.sz * (1 - 0.55 * ss(0.15, 1, tau));
      const aP = ss(0, 0.08, tau) * (1 - m) * vis;
      if (aP > 0.01) {
        const ang = sin(T * 2 + p.jit) * 0.8 + p.spin * tau * 2 + nz * 0.8;
        const c = cos(ang) * sz, sn = sin(ang) * sz;
        g.setTransform(c, sn, -sn, c, X, Y);
        g.globalAlpha = 0.95 * aP;
        g.drawImage(p.warm ? SP.petalWarm : SP.petal, -1, -0.56, 2, 1.12);
        g.setTransform(1, 0, 0, 1, 0, 0);
        if ((i & 3) === 0 && sz > S * 0.0036) gl(g, p.warm ? SP.gWarm : SP.gPink, X, Y, sz * 3.6, 0.5 * aP);
      }
      if (m > 0.01) {
        gl(g, SP.gCold, X, Y, sz * 3.4 + S * 0.004, 0.55 * m * vis);
        g.globalAlpha = min(1, 0.9 * m * vis); g.fillStyle = '#eaf0ff';
        const z = max(1.2, sz * 0.5); g.fillRect(X - z / 2, Y - z / 2, z, z);
      }
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function drawSkyPetals(g, T, cam) {
    // a few petals drifting through the night sky (B7: "a few drifting petals")
    const A = ss(159.5, 163, T);
    if (A < 0.01) return;
    const { W, H, S } = R;
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 16; i++) {
      const per = 16 + 8 * hash1(i * 5 + 1);
      const ph = T / per + hash1(i * 5 + 2);
      const f = ph - floor(ph);
      const x = (hash1(i * 7 + 3) + 0.06 * sin(T * 0.18 + i * 2.1) + (f - 0.5) * 0.08) * W;
      const y = (1.08 - f * 1.2) * H;
      const wob = sin(T * 0.9 + i * 1.7) * S * 0.02;
      const al = A * sin(PI * clamp(f * 1.1)) * (0.55 + 0.35 * hash1(i * 11)) * (1 - ss(cam.yH - 0.12 * S, cam.yH - 0.01 * S, y));
      const ang = sin(T * 1.1 + i) * 1.0 + i;
      const sz = S * (0.005 + 0.004 * hash1(i * 13));
      const c = cos(ang) * sz, sn = sin(ang) * sz;
      g.setTransform(c, sn, -sn, c, x + wob, y);
      g.globalAlpha = al * 0.8;
      g.drawImage(i % 2 ? SP.petal : SP.petalWarm, -1, -0.56, 2, 1.12);
      g.setTransform(1, 0, 0, 1, 0, 0);
      gl(g, SP.gPink, x + wob, y, sz * 5, 0.16 * al);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function drawBloomWave(g, T, hx, hy) {
    const { S, W, H } = R;
    const t = clamp((T - 157.4) / 3.6);
    if (t <= 0 || t >= 1) return;
    // a gentle, wide breath of light leaving the hero (feathered on both edges, never a hard ring)
    const Rw = S * (0.16 + 1.25 * (1 - pow(1 - t, 2)));
    const a1 = 0.1 * pow(1 - t, 1.5) * ss(0, 0.25, t);
    g.globalCompositeOperation = 'lighter';
    if (a1 > 0.004) {
      const wd = 0.07 * S + Rw * 0.1, A0 = clamp(a1 * 1.9, 0, 1);
      const gr = g.createRadialGradient(hx, hy, max(0, Rw - wd), hx, hy, Rw + wd);
      gr.addColorStop(0, 'rgba(255,200,140,0)');
      gr.addColorStop(0.3, `rgba(255,215,170,${A0 * 0.3})`);
      gr.addColorStop(0.55, `rgba(190,212,255,${A0})`);
      gr.addColorStop(0.8, `rgba(110,146,255,${A0 * 0.3})`);
      gr.addColorStop(1, 'rgba(80,120,255,0)');
      g.strokeStyle = gr; g.lineWidth = wd * 2; g.globalAlpha = 1;
      g.beginPath(); g.arc(hx, hy, Rw, 0, TAU); g.stroke();
    }
    const fl = exp(-pow((T - 158.1) / 0.55, 2));
    gl(g, SP.gGold, hx, hy, S * 0.3, 0.75 * fl);
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function drawConstellation(g, T, hx, hy, pulse) {
    const { S, W, H } = R;
    const cs = R.cs;
    const ptx = [], pty = [];
    for (let i = 0; i < CONS.length; i++) { ptx.push(hx + CONS[i][0] * cs); pty.push(hy + CONS[i][1] * cs); }
    const lineA = ss(161.0, 162.0, T) * (1 - ss(164.6, 166.4, T)), cf = 1 - ss(165.0, 166.8, T);
    if (cf < 0.01) return;
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round'; g.lineJoin = 'round';
    const lw = max(1, S * 0.0018);
    const chain = (ch, delay) => {
      for (let s = 0; s < ch.length - 1; s++) {
        const t0 = CONS_T0 + 0.5 + delay + s * 0.62;
        const p = u.ease.inOutSine(clamp((T - t0) / 0.62));
        if (p <= 0.001) continue;
        const ax = ptx[ch[s]], ay = pty[ch[s]], bx = ptx[ch[s + 1]], by = pty[ch[s + 1]];
        const x = ax + (bx - ax) * p, y = ay + (by - ay) * p;
        g.strokeStyle = `rgba(120,160,255,${0.12 * lineA})`; g.lineWidth = lw * 4;
        g.beginPath(); g.moveTo(ax, ay); g.lineTo(x, y); g.stroke();
        g.strokeStyle = `rgba(190,215,255,${0.5 * lineA})`; g.lineWidth = lw;
        g.beginPath(); g.moveTo(ax, ay); g.lineTo(x, y); g.stroke();
        if (p < 0.999) gl(g, SP.gCold, x, y, S * 0.02, 0.7 * cf);
      }
    };
    chain(CHAIN_A, 0); chain(CHAIN_B, 0.12);
    // the stars of the constellation: each pops with a ring
    for (let i = 1; i < CONS.length; i++) {
      const j = i % 2 ? (i + 1) >> 1 : i >> 1; // order along the chains
      const t0 = CONS_T0 + 0.25 + (i <= 9 ? floor((i + 1) / 2) * 0.62 + (i % 2 ? 0 : 0.12) : 2.4);
      const dt = T - t0;
      if (dt < 0) continue;
      const a = ss(0, 0.5, dt) * cf;
      const pop = exp(-dt * 1.7);
      const tw = 0.82 + 0.18 * sin(T * (1.1 + i * 0.37) + i * 2.3);
      const X = ptx[i], Y = pty[i];
      const big = i === 9 || i === 5 || i === 6 ? 1.15 : 1;
      gl(g, SP.gCold, X, Y, S * 0.04 * big * (1 + pop * 1.2), a * 0.55 * tw);
      gl(g, SP.coreWhite, X, Y, S * 0.018 * big * (1 + pop * 0.8), a * 0.95 * tw);
      if (i === 5 || i === 6 || i === 9 || i === 3 || i === 4) crossLines(g, X, Y, S * (i === 9 ? 0.06 : 0.04) * (1 + pop * 0.6), a * 0.8 * tw, max(1, S * 0.0014));
      if (dt < 1.6) gl(g, SP.gCold, X, Y, S * (0.05 + 0.08 * dt / 1.6), 0.5 * pow(1 - dt / 1.6, 2) * cf);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function drawHero(g, T, hx, hy) {
    const { S } = R;
    const pulse = 1 + 0.06 * sin(T * 2.4);
    const rr = S * KS([[152, PIN_IN.r], [156, PIN_IN.r], [158.2, 0.0175], [160.2, 0.0178], [162.4, 0.0178], [165, 0.0182], [166.4, PIN_OUT.r], [170, PIN_OUT.r]], T);
    const m = ss(157.8, 162.6, T); // gold -> warm white -> cool blue-white (the hue is interpolated directly, saturation dips to near-white half-way)
    const hue = PIN_IN.hue + (PIN_OUT.hue - PIN_IN.hue) * ss(0.4, 0.6, m);   // the switch happens where the colour is (almost) white
    const sat = 90 * (1 - 0.9 * pow(sin(PI * m), 0.7));
    const flare = ss(158.3, 160.6, T) * lerp(0.6, 1.0, ss(163.5, 166.2, T));
    hero.draw(g, hx, hy, rr, { hue, sat, form: 'star', a: 1, pulse, glow: 1, flare });
  }

  /* ================================================================== scene */
  Anim.defineScene({
    id: 's7_stars',

    init(env) {
      bakeMW();
    },

    resize(env) {
      bakeSprites();
      buildSky(env);
      ensureLand(env);
      bakeAurora(env);
    },

    fx(T) {
      return { bloom: KS([[152, 0.78], [156, 0.8], [158, 1.0], [160.2, 1.2], [162.6, 1.1], [165, 0.95], [167, 0.88], [170, 0.86]], T), vignette: 0.52 };
    },

    render(g, T, L, env) {
      const { W, H, S } = env;
      if (!R || R.W !== W || R.H !== H) { buildSky(env); }
      const hy = hyAt(T);
      const cam = { hy, yH: hy * H, gs: gsAt(T), th: thetaAt(T) };
      const heroX = W * 0.5, heroY = heroYAt(T) * H;
      const boost = 1 + 0.35 * exp(-pow((T - 160.0) / 1.6, 2)); // the sky "blooms"

      drawSky(g, T, cam);
      drawMilkyWay(g, T, cam);
      drawStars(g, T, cam, boost);
      drawAurora(g, T, cam);
      drawSea(g, T, cam);
      drawReflections(g, T, cam, boost, heroX, heroY);
      drawShooting(g, T);
      drawLand(g, T, cam, env);
      drawBloomWave(g, T, heroX, heroY);
      drawSkyPetals(g, T, cam);
      drawFlights(g, T, cam);
      drawConstellation(g, T, heroX, heroY, 1);
      drawHero(g, T, heroX, heroY);
    },
  });
})();

</script>
<script>/* src/scenes/s8_return.js */
/* ひとしずくの旅 — s8_return (T 166–180) 還る
 *
 * 166–170  (handoff B7) the night sky and the calm mirror sea of s7: the same stars, the same Milky Way haze, the same
 *          horizon glow at y .78, the hero star (.5,.3) with its cross flare, a few drifting petals, star streaks in the water.
 * 169.8    the star lets go of the sky: a slow falling star with a long soft tail; its mirror twin rises from the water to meet it.
 * 171.0    it touches the sea at (.5,.885): flash, a spire of light, beads that rise and fall (each leaving a tiny ring),
 *          four rings of light widen over the starry mirror and bend the reflections.
 * 173–175.5 the camera tips down: the horizon leaves the top, the ellipses open into circles, the light sinks under the water.
 * 175.4–178 the camera dives with the drop: a silver, shimmering sheet closes overhead and retreats upward; the water goes
 *          from deep blue to black; the drop shrinks.
 * 178.4–180 only the single point of light at (.5,.5) (r .0066 S, hue 190 = the first frame of s1) — the film loops.
 *
 * Pure function of T. Static art (sky/sea base, Milky Way, star lists) is built in init()/resize().
 */
(function () {
  'use strict';
  const { util: u, hero } = Anim;
  const TAU = Math.PI * 2, PI = Math.PI;
  const sin = Math.sin, cos = Math.cos, exp = Math.exp, sqrt = Math.sqrt, abs = Math.abs, floor = Math.floor,
    min = Math.min, max = Math.max, hypot = Math.hypot, pow = Math.pow;
  const clamp = u.clamp, lerp = u.lerp, ss = u.smoothstep, sss = u.smootherstep, hash2 = u.hash2;
  const KS = (k, T) => u.keys(k, T, 'spline');
  const hash1 = (n) => hash2(n | 0, 31);

  const PIN_IN = Anim.hero.pins.find((p) => p.to === 's8_return') || { x: 0.5, y: 0.3, r: 0.018, hue: 215, form: 'star' };

  /* ------------------------------------------------------------------ timing */
  const FALL0 = 169.8;       // the star lets go
  const IMPACT = 171.0;      // it touches the water
  const glintEnv = (T) => ss(-0.14, 0.012, T - IMPACT) * exp(-pow(max(0, T - IMPACT) / 0.27, 1.4));   // the impact glint: rises into the touch, gone by ~171.6
  const LYF = 0.885;         // impact level (fraction of H) on the mirror sea
  const HZF = 0.78;          // horizon (fraction of H) — matches s7
  const RT = [171.0, 171.62, 172.3, 173.05]; // ring start times
  const RA0 = [1, 0.8, 0.62, 0.5];
  // the camera sinks with the drop: height above the water (1 = start, 0 = at the surface, <0 = under it)
  const HC_KEYS = [[173.0, 1], [174.2, 0.2], [174.75, 0], [175.9, -0.8], [177.4, -1.8], [178.6, -2.5]];
  const YE_KEYS = [[173.0, 0.78], [174.5, 0.58], [175.7, 0.38], [177.3, -0.02], [178.6, -0.4]];   // horizon / waterline (fraction of H)
  
  /* ------------------------------------------------------------------ B7 palettes (identical to s7) */
  const SKY_E = [0, 0.08, 0.2, 0.45, 0.8, 1.6, 3.4];
  const SKY7 = [[20, 33, 74], [14, 24, 60], [10, 18, 48], [6, 10, 30], [2, 3, 12], [2, 3, 10], [1, 2, 8]];
  const SEA7 = [[8, 13, 32], [3, 5, 15]];
  const STAR_RGB = [[200, 218, 255], [255, 250, 240], [255, 224, 188], [255, 205, 225], [175, 215, 255]];
  const STAR_CSS = STAR_RGB.map((c) => `rgb(${c[0]},${c[1]},${c[2]})`);
  const rgbs = (c) => `rgb(${c[0] | 0},${c[1] | 0},${c[2] | 0})`;

  /* ------------------------------------------------------------------ Milky Way (same field as s7) */
  const MW_C = [0.0, 0.7], MW_A = 0.54, MW_UW = 5.6, MW_VH = 0.72;
  const mwCa = cos(MW_A), mwSa = sin(MW_A);
  function mwField(uu, vv) {
    const w = 0.2 + 0.08 * (u.fbm1(uu * 0.7 + 3.1, 3) - 0.5) * 2;
    const cv = (u.fbm1(uu * 0.9 + 11.3, 3) - 0.5) * 0.26;
    const dv = (vv - cv) / w;
    const core = exp(-dv * dv * 1.05);
    const clump = 0.25 + 1.1 * u.fbm2(uu * 2.2 + 5, vv * 4.4 + 9, 5);
    return [core, clump, dv];
  }
  const mwBand = (x, y) => {
    const dx = x - MW_C[0], dy = y - MW_C[1];
    const uu = dx * mwCa + dy * mwSa, vv = -dx * mwSa + dy * mwCa;

    const xMax = Wr / 2 + 0.45, yMax = 1.12 * Hr + 0.55;
    const area = 2 * xMax * yMax;
    const pivY = 0.48 * Hr;

      let made = 0, guard = 0;
      while (made < n && guard++ < n * 60) {
        const x = (rnd() * 2 - 1) * xMax, y = rnd() * yMax;
        const bd = mwBand(x, y);

    // sky
    const gr = c.createLinearGradient(0, 0, 0, yH);
    const eTop = yH / S;
    const colAt = (e) => {
      let i = 0;

      const t = clamp((e - SKY_E[i]) / (SKY_E[i + 1] - SKY_E[i]));

  function drawStars(g, T, vis) {

    }
    for (let i = 0, n = SKY.bright.length; i < n; i++) {
      const s = SKY.bright[i];
      const ry = s.dy * cT + s.dx * sT + pivY;
      const Y = yH - ry * S;
      if (Y < -60 || Y > yMaxPx + 20) continue;
      const X = px + (s.dx * cT - s.dy * sT) * S;
      if (X < -60 || X > W + 60) continue;
      let a = s.b * (1 - s.tw * (0.5 + 0.5 * sin(T * s.f + s.ph)));
      a *= (0.4 + 0.6 * ss(0, 0.25, ry)) * vis;
      if (a < 0.04) continue;
      const tone = s.tone;
      gl(g, tone === 2 ? SP.gWarm : tone === 3 ? SP.gPink : tone === 4 ? SP.gBlue : SP.gCold, X, Y, S * (0.03 + 0.012 * s.b), a * 0.5);
      g.globalAlpha = min(1, a);
      g.fillStyle = STAR_CSS[tone];
      const z = s.sz * Z1;
      g.fillRect(X - z * 0.5, Y - z * 0.5, z, z);
      crossLines(g, X, Y, S * (0.05 + 0.045 * s.b) * (0.8 + 0.4 * sin(T * 0.8 + s.ph)), a * 0.9, max(1, S * 0.0016));
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  function drawSkyPetals(g, T) {
    const A = 1 - ss(171.2, 174.0, T);
    if (A < 0.01) return;
    const { W, H, S } = R;
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < 16; i++) {
      const per = 16 + 8 * hash1(i * 5 + 1);
      const ph = T / per + hash1(i * 5 + 2);
      const f = ph - floor(ph);
      const x = (hash1(i * 7 + 3) + 0.06 * sin(T * 0.18 + i * 2.1) + (f - 0.5) * 0.08) * W;
      const y = (1.08 - f * 1.2) * H + cam.dy;
      const wob = sin(T * 0.9 + i * 1.7) * S * 0.02;
      const al = A * sin(PI * clamp(f * 1.1)) * (0.55 + 0.35 * hash1(i * 11)) * (1 - ss(cam.yH - 0.12 * S, cam.yH - 0.01 * S, y));
      if (al < 0.01) continue;
      const ang = sin(T * 1.1 + i) * 1.0 + i;
      const sz = S * (0.005 + 0.004 * hash1(i * 13));
      const c = cos(ang) * sz, sn = sin(ang) * sz;
      g.setTransform(c, sn, -sn, c, x + wob, y);
      g.globalAlpha = al * 0.8;
      g.drawImage(i % 2 ? SP.petal : SP.petalWarm, -1, -0.56, 2, 1.12);
      g.setTransform(1, 0, 0, 1, 0, 0);
      gl(g, SP.gPink, x + wob, y, sz * 5, 0.16 * al);
    }
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  /* ================================================================== draw: the sea (reflections bent by ripples) */
  function drawReflections(g, T) {
    const { W, H, S, pivY } = R;
    const yH = cam.yH;
    if (yH > H - 2) return;
    const hc = cam.hc;
    const fadeR = ss(0.04, 0.5, hc);
    if (fadeR < 0.01) return;
    const th = cam.th, cT = cos(th), sT = sin(th);
    g.save();
    g.beginPath(); g.rect(0, max(0, yH), W, H); g.clip();
    g.globalCompositeOperation = 'lighter';
    const seaH = (H - yH) * hc;
    const rip = nAct > 0;
    const NSB = rip ? 5 : 4;
    const refl = SKY.refl;
    const stretch = hc;
    const glitter = 1 + 1.1 * ss(171, 171.9, T) * (1 - ss(173.4, 175, T)); // the landing wakes the whole sea
    for (let i = 0; i < refl.length; i++) {
      const s = refl[i];
      const ry = s.dy * cT + s.dx * sT + pivY;
      if (ry < 0.02) continue;
      const Ym = yH + ry * S * 0.5 * stretch;
      if (Ym > H + 20) continue;
      const X = W / 2 + (s.dx * cT - s.dy * sT) * S;
      if (X < -10 || X > W + 10) continue;
      let a = s.b * (1 - s.tw * (0.5 + 0.5 * sin(T * s.f + s.ph))) * (s.kind === 2 ? 1 : 0.4);
      a *= (0.2 + 0.8 * ss(0, 0.25, ry)) * fadeR * glitter;
      if (a < 0.03) continue;
      const len = S * (0.035 + 0.075 * s.b) * (s.kind === 2 ? 1.5 : 1) * (0.35 + 0.65 * hc);
      const wd = S * (s.kind === 2 ? 0.05 : 0.03);
      const NS = s.kind === 2 || !rip ? NSB : 3;
      const sl = len / NS;
      for (let q = 0; q < NS; q++) {
        const fq = (q + 0.5) / NS;
        const fl = 0.45 + 0.55 * sin(T * (1.7 + 0.5 * q) + s.ph * 3 + q * 2.3);
        const off = sin(T * 0.9 + s.ph * 2 + q * 1.9) * S * 0.004;
        const y0 = Ym - len / 2 + q * sl;
        let dx = 0, dy = 0, boost = 1;
        if (rip) {
          const w = waveAt(X, y0 + sl * 0.5);
          dx = w * S * 0.03; dy = w * S * 0.011; boost = 1 + 1.8 * max(0, w);
        }
        g.globalAlpha = min(1, a * 0.3 * fl * (1 - fq * 0.55) * boost);
        g.drawImage(SP.streak, X + off + dx - wd / 2, y0 + dy, wd, sl * 2.0);
      }
    }
    // quiet glints of the surface
    g.fillStyle = 'rgb(150,180,255)';
    for (let q = 0; q < 22; q++) {
      const t0 = pow(hash1(q * 13 + 5), 1.6);
      const y = yH + (0.01 * H + t0 * (H - yH) * 0.95) * hc;
      const x = (hash1(q * 17 + 9) + 0.02 * sin(T * 0.2 + q)) * W;
      const wd = S * (0.015 + 0.05 * (0.3 + t0));
      const fl = pow(0.5 + 0.5 * sin(T * (0.6 + 0.4 * hash1(q * 3)) + q * 2.7), 2);
      const w = rip ? waveAt(x, y) : 0;
      g.globalAlpha = min(1, fadeR * 0.16 * fl * (0.4 + 0.6 * (1 - t0)) * (1 + 1.6 * max(0, w)));
      g.fillRect(x - wd / 2 + w * S * 0.012, y + w * S * 0.004, wd, max(1, S * (0.0012 + 0.002 * t0)));
    }
    // the star's path of light on the water (the mirror of the hero) — gives way to the falling star's twin
    const hx = W / 2;
    const pa = (1 - ss(169.75, 170.7, T)) * fadeR;
    if (pa > 0.01) {
      for (let q = 0; q < 8; q++) {
        const t0 = q / 8;
        const yy = yH + t0 * seaH;
        const off = sin(T * 1.1 + q * 1.7) * S * 0.007 * (0.4 + t0);
        const fl = 0.55 + 0.45 * sin(T * (1.3 + q * 0.31) + q * 2.1);
        g.globalAlpha = pa * 0.2 * pow(1 - t0 * 0.8, 1.2) * fl;
        const wd = S * (0.02 + 0.07 * t0);
        g.drawImage(SP.streak, hx + off - wd / 2, yy, wd, seaH / 8 * 2.2);
      }
    }
    // the falling star's mirror twin rises from the deep to meet it
    if (T > FALL0 + 0.25 && T < IMPACT + 0.05) {
      starPos(T, _sp);
      const ly = LYF * H;
      const yr = 2 * ly - _sp[1];
      const near = 1 - ss(0.0, 0.16 * H, ly - _sp[1]);
      const al = ss(FALL0 + 0.25, FALL0 + 0.9, T) * (0.55 + 0.45 * near);
      if (yr < H + 0.3 * S) {
        const len = S * 0.22 * (0.6 + 0.8 * near);
        const dim = 1 - 0.95 * glintEnv(T);   // the glint carries the heart of the moment
        g.globalAlpha = 0.5 * al * dim;
        g.drawImage(SP.streak, _sp[0] - S * 0.03, yr - len / 2, S * 0.06, len);
        gl(g, SP.gCold, _sp[0], yr, S * 0.07, 0.4 * al * dim);
        gl(g, SP.coreWhite, _sp[0], yr, S * 0.022, 0.5 * al * near * dim);
      }
    }
    g.restore();
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  /* ================================================================== draw: rings of light */
  function drawRings(g, T) {
    const { W, H, S } = R;
    const { cx, cy, eps, z } = cam;
    const yH = cam.yH, hc = cam.hc;
    if (hc < -1.4) return;
    g.save();
    g.beginPath();
    if (hc >= 0) g.rect(0, max(0, yH), W, H); else g.rect(0, 0, W, max(0, yH));
    g.clip();
    g.globalCompositeOperation = 'lighter';
    // as the camera meets the surface the rings crowd into one bright line; from below they glow quietly on the silver sheet
    const edgeBoost = 1 + 1.1 * exp(-hc * hc / 0.06);
    const under = hc < 0 ? 0.75 * (1 - ss(-0.04, -0.7, hc)) : 1;
    for (let k = 0; k < NR; k++) {
      const a = T - RT[k];
      if (a < 0) continue;
      const amp = RA0[k] * ss(0, 0.08, a) * exp(-a / 2.3) * under * edgeBoost;
      if (amp < 0.015) continue;
      const Rr = ringRadius(a) * S * z;
      if (Rr < 1) continue;
      g.save();
      g.translate(cx, cy); g.scale(1, eps);
      const aa = amp * (0.5 + 0.5 * ss(0.0, 0.5, a));
      const rn = Rr / (S * z);
      // broad soft swell, mid body, thin bright crest
      g.lineWidth = S * z * (0.07 + 0.06 * rn);
      g.strokeStyle = `rgba(70,120,230,${0.085 * aa})`;
      g.beginPath(); g.arc(0, 0, Rr, 0, TAU); g.stroke();
      g.lineWidth = S * z * (0.02 + 0.016 * rn);
      g.strokeStyle = `rgba(140,190,255,${0.26 * aa})`;
      g.beginPath(); g.arc(0, 0, Rr, 0, TAU); g.stroke();
      g.lineWidth = S * z * 0.0055;
      g.strokeStyle = `rgba(215,235,255,${0.5 * aa})`;
      g.beginPath(); g.arc(0, 0, Rr, 0, TAU); g.stroke();
      // light caught on the crests: arcs that drift and flicker, strongest on the far side (it faces the horizon glow)
      g.lineWidth = S * z * 0.011;
      g.lineCap = 'round';
      for (let j = 0; j < 12; j++) {
        const phi = (j + 0.5) / 12 * TAU + 0.35 * sin(T * 0.5 + j * 1.7 + k);
        const far = 0.55 + 0.45 * (-sin(phi));
        const nz = u.noise1(j * 1.7 + T * 0.8 + k * 3.1);
        const al = aa * far * (0.2 + 0.8 * pow(nz, 1.6)) * 0.85;
        if (al < 0.02) continue;
        g.strokeStyle = `rgba(245,250,255,${al})`;
        g.beginPath(); g.arc(0, 0, Rr, phi - 0.2, phi + 0.2); g.stroke();
      }
      g.restore();
      // sparkles on the crest
      for (let j = 0; j < 16; j++) {
        const psi = hash1(k * 40 + j * 3 + 1) * TAU;
        const fl = pow(max(0, sin(T * (1.1 + hash1(k * 40 + j * 3 + 2) * 1.6) + j * 2.3)), 4);
        const al = aa * fl * (0.55 + 0.45 * (-sin(psi)));
        if (al < 0.03) continue;
        const X = cx + cos(psi) * Rr, Y = cy + sin(psi) * Rr * eps;
        gl(g, SP.gSilver, X, Y, S * 0.018, al * 0.7);
        g.globalAlpha = min(1, al); g.fillStyle = '#eef6ff';
        const zq = max(1.2, S * 0.0022);
        g.fillRect(X - zq, Y - zq * 0.35, zq * 2, zq * 0.7);
      }
    }
    g.restore();
    g.globalAlpha = 1; g.globalCompositeOperation = 'source-over';
  }

  /* ================================================================== the falling star */
  function drawFall(g, T) {
    const { W, H, S } = R;
    if (T < FALL0 - 0.05 || T > IMPACT + 0.55) return;
    g.save();
    g.globalCompositeOperation = 'lighter';
    g.lineCap = 'round'; g.lineJoin = 'round';
    starPos(T, _sp);
    const uu = clamp((T - FALL0) / (IMPACT - FALL0));
    const speed = ss(0.0, 0.45, uu) * (1 - ss(IMPACT, IMPACT + 0.5, T));
    // tail: a long soft streak behind the star, along the direction it came from, with a faint sway
    starPos(min(T + 0.04, IMPACT - 0.001), _sq);
    let vx = _sq[0] - _sp[0], vy = _sq[1] - _sp[1];
    const vl = hypot(vx, vy) || 1;
    const bl = ss(0.0, 0.25, uu);
    let dx = lerp(-0.12, -vx / vl, bl), dy = lerp(-1, -vy / vl, bl);
    const dl = hypot(dx, dy) || 1; dx /= dl; dy /= dl;
    const Lt = H * (0.05 + 0.5 * speed);
    const NT = 20;
    const X = [], Y = [];
    const hx0 = _sp[0], hy0 = _sp[1];
    for (let j = 0; j <= NT; j++) {
      const f = j / NT, ff = pow(f, 1.1);
      const sw = sin(f * PI) * S * 0.014 * sin(T * 3 + f * 4) * speed;
      X.push(hx0 + dx * Lt * ff - dy * sw); Y.push(hy0 + dy * Lt * ff + dx * sw);
    }
    const hx = _sp[0], hy = _sp[1];
    const tx = X[NT], ty = Y[NT];
    if (hypot(hx - tx, hy - ty) > 3) {
      const gr = g.createLinearGradient(hx, hy, tx, ty);
      const a0 = 0.95 * speed * (1 - 0.95 * glintEnv(T));
      gr.addColorStop(0, `rgba(235,244,255,${a0})`); gr.addColorStop(0.18, `rgba(170,205,255,${a0 * 0.55})`);
      gr.addColorStop(0.6, `rgba(100,150,240,${a0 * 0.18})`); gr.addColorStop(1, 'rgba(70,110,230,0)');
      g.strokeStyle = gr;
      for (let pass = 0; pass < 3; pass++) {
        g.lineWidth = S * (pass === 0 ? 0.045 : pass === 1 ? 0.016 : 0.005);
        g.globalAlpha = pass === 0 ? 0.13 : pass === 1 ? 0.36 : 0.95;
        g.beginPath(); g.moveTo(X[0], Y[0]);
        for (let j = 1; j <= NT; j++) g.lineTo(X[j], Y[j]);
        g.stroke();
      }
      // dust of light along the tail
      for (let j = 1; j < NT; j += 1) {
        const f = j / NT;
        const al = (1 - f) * (1 - f) * 0.5 * speed * (1 - 0.95 * glintEnv(T));
        gl(g, SP.gCold, X[j], Y[j], S * (0.03 - 0.018 * f), al);
      }
      // sparkling motes shed behind the star
      for (let m = 0; m < 14; m++) {
        const f = (hash1(m * 7 + 2) * 0.9 + 0.05);
        const jj = Math.min(NT, Math.floor(f * NT));
        const tw = pow(max(0, sin(T * 9 + m * 2.7)), 2);
        const off = (hash1(m * 7 + 5) - 0.5) * S * 0.035 * f;
        gl(g, SP.coreWhite, X[jj] + off, Y[jj], S * 0.007, 0.6 * (1 - f) * speed * tw);
      }
    }
    g.restore();
    g.globalAlpha = 1;
  }

  /* ================================================================== impact: flash, spire, beads, motes */
  const BEADS = [];
  const MOTES = [];
  function initBeads() {
    const r = u.rng(5555);
    BEADS.length = 0; MOTES.length = 0;
    for (let i = 0; i < 20; i++) {
      BEADS.push({ phi: r() * TAU, vh: 0.06 + 0.3 * r() * r() + 0.04, v: 0.42 + 0.55 * r(), d: r() * 0.35, hue: 190 + 40 * r(), sz: 0.0045 + 0.004 * r() });
    }
    for (let i = 0; i < 26; i++) {
      MOTES.push({ x: (r() - 0.5) * 0.34, v: 0.05 + 0.1 * r(), d: r() * 1.6, ph: r() * TAU, sz: 0.004 + 0.006 * r(), life: 2.4 + 2.2 * r() });
    }
  }
  function microRing(g, cx, cy, rr, eps, al, S) {
    if (al < 0.02) return;
    g.save();
    g.translate(cx, cy); g.scale(1, eps);
    g.beginPath(); g.arc(0, 0, rr, 0, TAU);
    g.lineWidth = max(2.5, S * 0.012);
    g.strokeStyle = `rgba(120,170,255,${al * 0.25})`; g.stroke();
    g.lineWidth = max(1.1, S * 0.0028);
    g.strokeStyle = `rgba(210,232,255,${al * 0.8})`; g.stroke();
    g.restore();
  }
  function drawImpact(g, T) {
    const a = T - IMPACT;
    if (a < -0.02) return;
    const { W, H, S } = R;
    const { cx, cy, eps, z } = cam;
    const yH = cam.yH;
    g.save();
    g.globalCompositeOperation = 'lighter';
    // --- flash + flat splash light on the water
    const fl = exp(-a / 0.28) * ss(-0.02, 0.02, a);
    if (fl > 0.04) {
      gl(g, SP.gCold, cx, cy, S * 0.34 * z, 0.26 * fl);
      gl(g, SP.coreWhite, cx, cy, S * 0.1 * z, 0.03 * fl);
      g.save();
      g.translate(cx, cy); g.scale(1, 0.14 * (eps / 0.2 > 1.5 ? 1.5 : 1));
      g.globalAlpha = min(1, 0.2 * fl);
      g.drawImage(SP.gSilver, -S * 0.9, -S * 0.9, S * 1.8, S * 1.8);
      g.restore();
    }
    // --- the glint: a feathered 4-point flare (a longer, fainter lens streak across it), brief, light not a polygon
    const gt = glintEnv(T);
    if (gt > 0.01) {
      const gs = S * z * (0.36 + 0.07 * (1 - exp(-max(0, a) / 0.12)));
      g.globalAlpha = 0.58 * gt;
      g.drawImage(SP.flare, cx - gs, cy - gs, gs * 2, gs * 2);
      g.globalAlpha = 0.17 * gt;
      g.drawImage(SP.lens, cx - S * 0.52 * z, cy - S * 0.03 * z, S * 1.04 * z, S * 0.06 * z);
    }
    // --- spire of light rising from the surface
    if (a > 0 && a < 1.8) {
      const h = S * 0.5 * (1 - exp(-a * 4.5)) * (1 - ss(0.5, 1.8, a) * 0.5);
      const w = S * (0.026 * exp(-a * 1.2) + 0.006);
      const al = exp(-a / 0.5) * ss(0, 0.05, a);
      if (al > 0.01 && h > 2) {
        g.globalAlpha = min(1, 0.95 * al * (1 - 0.75 * glintEnv(T)));
        g.drawImage(SP.beam, cx - w / 2, cy - h, w, h);
        gl(g, SP.gCold, cx, cy - h * 0.2, S * 0.05, 0.4 * al);
      }
    }
    // --- crown + beads: rise on arcs and fall back, each landing makes a tiny ring
    const gG = 1.35;
    for (let i = 0; i < BEADS.length; i++) {
      const b = BEADS[i];
      const t = T - IMPACT - b.d;
      if (t < 0) continue;
      const tl = 2 * b.v / gG;
      const hgt = b.v * t - 0.5 * gG * t * t;
      const hx = cos(b.phi) * b.vh * min(t, tl), hz = sin(b.phi) * b.vh * min(t, tl);
      const gx = cx + hx * S * z, gy = cy + hz * S * z * eps;
      if (t < tl) {
        const Y = gy - hgt * S * z;
        const al = ss(0, 0.06, t) * (0.7 + 0.3 * sin(T * 7 + i)) * (0.4 + 0.6 * ss(0, 0.3, t)) * (1 - 0.6 * glintEnv(T));   // they leave the glint one by one, not as one white clump
        // short trail
        for (let q = 1; q <= 3; q++) {
          const tq = t - q * 0.035; if (tq < 0) break;
          const hq = b.v * tq - 0.5 * gG * tq * tq;
          gl(g, SP.gCyan, cx + cos(b.phi) * b.vh * tq * S * z, gy - hq * S * z + (gy - gy) , S * b.sz * 2.2 * (1 - q * 0.22), al * 0.35 * (1 - q * 0.25));
        }
        gl(g, SP.gCold, gx, Y, S * b.sz * 5, al * 0.5);
        gl(g, SP.coreWhite, gx, Y, S * b.sz * 2.2, al);
      } else {
        const ta = t - tl;
        if (ta < 1.0) microRing(g, gx, gy, S * z * (0.012 + 0.07 * (1 - exp(-ta * 2.6))), eps, 0.55 * (1 - ta) * (1 - ta) * b.sz / 0.0065, S);
        if (ta < 0.12) gl(g, SP.gSilver, gx, gy, S * 0.02, 0.6 * (1 - ta / 0.12));
      }
    }
    // --- slow motes of light lifted from the spot (they rise and fade — the light is being returned)
    for (let i = 0; i < MOTES.length; i++) {
      const m = MOTES[i];
      const t = T - IMPACT - 0.2 - m.d;
      if (t < 0 || t > m.life) continue;
      const f = t / m.life;
      const al = sin(PI * f) * (0.55 + 0.45 * sin(T * 3 + m.ph)) * ss(0.02, 0.5, cam.hc);
      const X = cx + (m.x * S + sin(t * 1.3 + m.ph) * S * 0.02) * z;
      const Y = cy - (m.v * t * S * (0.9 + 0.2 * f)) * z;
      gl(g, SP.gSilver, X, Y, S * m.sz * 3, al * 0.5);
      gl(g, SP.coreWhite, X, Y, S * m.sz, al * 0.9);
    }
    // --- light that has sunk into the water: a cool glow that lies under the surface and fades
    const sink = ss(0.1, 0.8, a) * exp(-max(0, a - 0.8) / 3.2);
    if (sink > 0.01) {
      g.save();
      g.translate(cx, cam.hy); g.scale(1, 0.6);
      g.globalAlpha = min(1, 0.7 * sink);
      g.drawImage(SP.gCyan, -S * 0.3 * z, -S * 0.3 * z, S * 0.6 * z, S * 0.6 * z);
      g.restore();
    }
    g.restore();
    g.globalAlpha = 1;
  }

  /* ================================================================== hero */
  function heroState(T) {
    const { S } = R;
    if (T < FALL0) {
      return { x: R.W * 0.5, y: PIN_IN.y * R.H, r: S * PIN_IN.r, hue: PIN_IN.hue, form: 'star', a: 1, pulse: 1 + 0.06 * sin(T * 2.4), glow: 1, flare: 1 };
    }
    if (T < IMPACT) {
      starPos(T, _sp);
      const uu = (T - FALL0) / (IMPACT - FALL0);
      return { x: _sp[0], y: _sp[1], r: S * PIN_IN.r, hue: PIN_IN.hue, form: 'star', a: 1, pulse: 1 + 0.06 * sin(T * 2.4), glow: 1 + 0.5 * ss(0.5, 1, uu), flare: 1 - ss(0.0, 0.85, uu) };
    }
    const rr = KS([[IMPACT, 0.017], [172.5, 0.0135], [175.5, 0.0125], [177, 0.0095], [178.3, 0.0066], [180, 0.0066]], T);

   * The noise beds and the reverb IR are generated ONCE as plain Float32Arrays at a nominal 44.1 kHz, in small steps from

   * AudioBuffers (resampled when the context runs at another rate) by getBufs(ctx), once per context. */
  const NSR = 44100, NOISE_N = NSR * 5, NOISE_X = Math.floor(NSR * 0.3);

        b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
        g[i] = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926;
      } else { y = (y + 0.02 * w) / 1.02; g[i] = y; }

<script>/* src/ui.js */
/* ひとしずくの旅 — DOM layer: captions, start card, transport bar. */
(function (G) {
  'use strict';
  const Anim = (G.Anim = G.Anim || {});
  const u = Anim.util;

  const UI = (Anim.ui = {});

  let hideTimer = 0;

  const fmt = (t) => {

  };

  UI.init = (api) => {
    capEl = $('captions');
    UI.api = api;
    const bar = $('bar'), seek = $('seek'), play = $('play'), snd = $('snd'), fs = $('fs');
    // chapter ticks
    const ticks = $('ticks');
    for (const s of Anim.timeline.scenes) {
      const el = document.createElement('i');
      el.style.left = (s.start / Anim.DURATION) * 100 + '%';
      el.title = s.name;
      ticks.appendChild(el);
    }
    seek.max = String(Anim.DURATION);
    seek.addEventListener('input', () => api.seek(parseFloat(seek.value)));
    play.addEventListener('click', (e) => { e.stopPropagation(); api.toggle(); });
    snd.addEventListener('click', (e) => { e.stopPropagation(); api.toggleMute(); });
    const canFs = document.fullscreenEnabled || document.webkitFullscreenEnabled;
    if (!canFs) fs.hidden = true;   // e.g. iPhone Safari, or an embedding frame that forbids it
    fs.addEventListener('click', (e) => {
      e.stopPropagation();
      const d = document, el = d.documentElement;
      try {
        if (d.fullscreenElement || d.webkitFullscreenElement) { (d.exitFullscreen || d.webkitExitFullscreen).call(d); }
        else { const r = (el.requestFullscreen || el.webkitRequestFullscreen).call(el); if (r && r.catch) r.catch(() => {}); }
      } catch (err) { /* fullscreen is optional */ }
    });

/* ひとしずくの旅 — boot, playback clock, adaptive quality, test hooks. */
(function (G) {
  'use strict';

  const $ = (id) => document.getElementById(id);

    time: () => clock.T,

    toggleMute() {
