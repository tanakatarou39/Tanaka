  /* ---- the sea of cloud: perspective height-field, lit from the low sun (low-res, upscaled) ---- */
  let SEAF = null;
  const V0 = [166, 172, 216], V1 = [214, 218, 242], V2 = [252, 246, 238], WARMC = [255, 212, 148], STORMC = [112, 126, 152];
  function cloudH(nx, nz, lod) {
    const b = u.fbm2(nx, nz, lod > 0.5 ? 3 : 2);
    if (lod < 0.05) return b;
    // humps with sharp creases between them (cumulus cauliflower)
    const r1 = sqrt(pow(2 * u.noise2(nx * 2.4 + 9.1, nz * 2.4 + 4.3) - 1, 2) + 0.03);
    const r2 = sqrt(pow(2 * u.noise2(nx * 5.3 + 2.2, nz * 5.3 + 7.7) - 1, 2) + 0.05);
    return b * 0.46 + (r1 * 0.34 + r2 * 0.2 * lod) * lod + (1 - lod) * 0.54 * 0.5;
  }
  function drawSeaField(g, T, env, sky, stm) {
    const { W, H, S } = env;
    const yh = horizonY(T);
    if (yh >= 0.985 || !SEAF || T > 97.2) return false;
    const F = SEAF, fw = F.w, fh = F.h, d = F.img.data;
    const j0 = max(0, floor(yh * fh));
    const zs = seaScroll(T), xs = seaDrift(T), asp = W / S;
    const hzc = mixc(sky[7], [232, 214, 226], 0.3);
    const dw = dawn(T) * (1 - stm);
    const sunx = SUN.x;
    const sdx = -0.075, sdz = 0.03;
    for (let j = 0; j < j0; j++) for (let i = 0; i < fw; i++) d[(j * fw + i) * 4 + 3] = 0;
    for (let j = j0; j < fh; j++) {
      const yn = (j + 0.5) / fh, dy = yn - yh;
      const al = ss(-0.004, 0.05, dy);
      const t = SK / (max(dy, 0) + SE);
      const Z = (t * ZK + zs) * 0.9;
      const lod = ss(0.015, 0.1, dy);
      const hf = (1 - ss(0.0, 0.26, dy)) * 0.7;
      const xk = asp * t * 1.6 * 0.9;
      for (let i = 0; i < fw; i++) {
        const xn = (i + 0.5) / fw;
        const nx = (xn - 0.5) * xk + xs * 0.9;
        const h = cloudH(nx, Z, lod);
        const hl = cloudH(nx + sdx, Z + sdz, lod);
        let b = 0.7 + (h - 0.5) * 0.62 + (h - hl) * 3.4 * (0.35 + 0.65 * lod);
        b = b < 0 ? 0 : b > 1 ? 1 : b;
        let r, gg, bl;
        if (b < 0.45) { const k = b / 0.45; r = V0[0] + (V1[0] - V0[0]) * k; gg = V0[1] + (V1[1] - V0[1]) * k; bl = V0[2] + (V1[2] - V0[2]) * k; }
        else { const k = (b - 0.45) / 0.55; r = V1[0] + (V2[0] - V1[0]) * k; gg = V1[1] + (V2[1] - V1[1]) * k; bl = V1[2] + (V2[2] - V1[2]) * k; }
        // sun-side gold on the lit slopes
        const dxs = (xn - sunx) / 0.5;
        const wf = dw * exp(-dxs * dxs) * ss(0.35, 0.85, b) * 0.8 + dw * 0.12 * ss(0.4, 0.9, b);
        r += (WARMC[0] - r) * wf; gg += (WARMC[1] - gg) * wf; bl += (WARMC[2] - bl) * wf;
        // atmospheric haze toward the horizon
        r += (hzc[0] - r) * hf; gg += (hzc[1] - gg) * hf; bl += (hzc[2] - bl) * hf;
        if (stm > 0.002) {
          const lum = 0.78 + 0.34 * b;
          const k = stm * 0.88;
          r += (STORMC[0] * lum - r) * k; gg += (STORMC[1] * lum - gg) * k; bl += (STORMC[2] * lum - bl) * k;
        }
        const o = (j * fw + i) * 4;
        d[o] = r; d[o + 1] = gg; d[o + 2] = bl; d[o + 3] = al * 255;
      }
    }
    F.x.putImageData(F.img, 0, 0);
    g.globalAlpha = 1 - ss(95.4, 97.2, T);
    g.drawImage(F.c, 0, max(0, j0 - 1), fw, fh - max(0, j0 - 1), 0, max(0, j0 - 1) / fh * H, W, H - max(0, j0 - 1) / fh * H);
    g.globalAlpha = 1;
    return true;
  }

  // towers & passing clouds are composed once (two lighting versions: cool daylight / warm dawn) and then just placed
  function bakeCluster(cl, wpx, hgt, cx90, base90, dwv, env, forceStage) {
    const { W, H, S } = env;
    const wC = Math.ceil(wpx * 1.3 * CS), hC = Math.ceil((hgt * wpx * 1.2 + wpx * 0.3) * CS);
    const c = u.canvas(wC, hC), x = c.getContext('2d');
    x.setTransform(CS, 0, 0, CS, 0, 0);
    const rec = { x, x0: 1e9, y0: 1e9, x1: -1e9, y1: -1e9 };
    const ox = wC / 2 / CS, oy = hC / CS - wpx * 0.12;
    const sp = sunPos(90), sx = sp.x * W, sy = sp.y * H;
    for (let i = 0; i < cl.puffs.length; i++) {
      const p = cl.puffs[i];
      const px = ox + p.x * wpx, py = oy + p.y * wpx;
      const st = forceStage != null ? forceStage : stageAt(cx90 + p.x * wpx, base90 + p.y * wpx, dwv, sx, sy, S, 0.2 * (-p.x) + 0.25 * min(1, -p.y / (wpx * 0.5)));
      puff(rec, px, py, p.r * wpx, st, p.v, p.b, 1, p.sy);
    }
    // a soft gold core-light inside the sun-lit puffs of the warm (dawn) version
    if (dwv >= 1 && forceStage == null) {
      x.globalCompositeOperation = 'lighter';
      const gs = u.glowSprite(44, 85, 76, 'soft');
      for (let i = 0; i < cl.puffs.length; i += 2) {
        const p = cl.puffs[i];
        if (p.b < 1) continue;
        const rr = p.r * wpx * 1.05;
        x.globalAlpha = 0.17;
        x.drawImage(gs, ox + p.x * wpx - rr, oy + p.y * wpx - rr, rr * 2, rr * 2);
      }
      x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    }
    return { c, ox, oy, w: wC / CS, h: hC / CS };
  }
  function bakeAll(env) {
    const { W, H, S } = env;
    const yh90 = horizonY(90);
    for (const tw of towers) {
      const wpx = tw.size * S, base90 = (yh90 + tw.dy) * H, cx90 = tw.xf * W;
      tw.cool = bakeCluster(tw, wpx, tw.h, cx90, base90, 0.18, env, null);
      tw.warm = bakeCluster(tw, wpx, tw.h, cx90, base90, 1, env, null);
    }
    for (const b of nearBands) {
      if (b.sheet) continue;
      const wpx = b.w * env.S;
      b.img = bakeCluster(b, wpx, 0.28, 0.2 * W, 0.4 * H, 1, env, 2);
    }
  }
  function placeImg(cv, im, cx, base, k, alpha) {
    const dw = im.w * k, dh = im.h * k;
    const dx = cx - im.ox * k, dy = base - im.oy * k;
    cv.x.globalAlpha = alpha;
    cv.x.drawImage(im.c, dx, dy, dw, dh);
    if (dx < cv.x0) cv.x0 = dx;
    if (dx + dw > cv.x1) cv.x1 = dx + dw;
    if (dy < cv.y0) cv.y0 = dy;
    if (dy + dh > cv.y1) cv.y1 = dy + dh;
  }
  function drawTowers(g, T, env, sky, stm, hx, hy) {
    const { W, H, S } = env;
    const cv = CV.sea, x = cv;
    const yh = horizonY(T);
    if (T > 94.9) return;
    clearCV(cv);
    let any = false;
    // far to near
    const order = ORDER;
    const hzc = u.css(mixc(sky[7], [232, 214, 226], 0.3));
    for (let k = 0; k < (yh >= 1.0 ? 0 : order.length); k++) {
      const tw = order[k];
      seaProj(tw, T, env, SPJ);
      if (SPJ.t <= 0) continue;
      const kk = (tw.t90 / SPJ.t) * (1 + 0.01 * sin(T * 0.4 + tw.seed));
      const wpx = tw.size * S * kk;
      const base = SPJ.y + wpx * 0.03, cx = SPJ.x + sin(T * 0.2 + tw.seed) * 0.004 * wpx;
      if (base - tw.h * wpx > H || cx + wpx * 0.7 < 0 || cx - wpx * 0.7 > W) continue;
      const al = 1 - 0.3 * (1 - ss(0.0, 0.09, tw.dy));
      placeImg(cv, tw.cool, cx, base, kk, al);
      const wm = clamp((FR.dw - 0.18) / 0.82, 0, 1);
      if (wm > 0.02) placeImg(cv, tw.warm, cx, base, kk, al * wm);
      any = true;
    }
    drawNear(cv, T, env, hx, hy);
    if (stm > 0.005) tint(cv, 'rgb(100,116,142)', stm * 0.85);
    blit(g, cv, W, H, 1 - ss(93.6, 94.9, T));
  }

  /* ------------------------------------------------------------------ the scene */
  Anim.defineScene({
    id: 's4_sky',

    init() { buildSprites(); genStatic(); },

    resize(env) {
      const { W, H } = env;
      genSea(env);
      // Everything soft (sky, sun, clouds, fog) is composed into ONE half-resolution opaque canvas and upscaled once:
      // one smooth full-screen upscale costs ~4x less than six, and the clouds are soft anyway.
      const bw = Math.ceil(W * CS), bh = Math.ceil(H * CS), bc = u.canvas(bw, bh);
      BG = { c: bc, x: bc.getContext('2d', { alpha: false }), w: bw, h: bh, kx: bw / W, ky: bh / H };
      mkCV('sea', W, H); mkCV('hero', W, H, 0.3);
      bakeAll(env);
      bakeSun(env.S);
      {
        // the sky is a vertical gradient: a 1 x bh strip (written per frame) stretched sideways is almost free
        const c4 = u.canvas(1, bh), x4 = c4.getContext('2d');
        SKYC = { c: c4, x: x4, h: bh, img: x4.createImageData(1, bh) };
        // fine static dither (black/white specks, alpha 2..6/255) breaks the contour bands of the slow gradients
        const nz = u.canvas(bw, bh), nx = nz.getContext('2d'), im = nx.createImageData(bw, bh), rr = u.rng(99);
        for (let i = 0; i < bw * bh; i++) { const v = rr() < 0.5 ? 0 : 255; im.data[i * 4] = im.data[i * 4 + 1] = im.data[i * 4 + 2] = v; im.data[i * 4 + 3] = 2 + rr() * 4; }
        nx.putImageData(im, 0, 0);
        SKYC.n = nz;
      }
      ORDER = towers.slice().sort((a, b) => a.dy - b.dy);
      {
        const fh = 84, fw = clamp(Math.round(fh * W / H), 100, 170);
        const c2 = u.canvas(fw, fh), x2 = c2.getContext('2d');
        SEAF = { c: c2, x: x2, w: fw, h: fh, img: x2.createImageData(fw, fh) };
      }
      const fh = 44, fw = clamp(Math.round(fh * W / H), 40, 100);
      const c = u.canvas(fw, fh);
      FOG = { c, x: c.getContext('2d'), w: fw, h: fh, img: c.getContext('2d').createImageData(fw, fh) };
    },

    fx(T, L) {
      const fl = flashAmt(T);
      const b = K([[72, 0.04], [76, 0.05], [80, 0.06], [86, 0.07], [92, 0.1], [96, 0.24], [102, 0.3]], T);
      return { bloom: b + 0.2 * fl };
    },

    render(g, T, L, env) {
      const { W, H, S } = env;
      G_ENV = env; frameCache(T, env);
      const sp = sunPos(T);
      const sx = sp.x * W, sy = sp.y * H;
      const stm = storm(T);
      const sky = skyAt(T);
      const hx = heroX(T) * W, hy = heroY(T) * H, hr = heroR(T) * S;
      const P = sss(85.5, 96, T);
      const b = BG.x;
      heroState(T, pulseAt(T));

      /* ================= half-res background: sky, sun, clouds, fog ================= */
      b.setTransform(1, 0, 0, 1, 0, 0); b.globalAlpha = 1; b.globalCompositeOperation = 'source-over';
      paintSky(b, sky);
      b.setTransform(BG.kx, 0, 0, BG.ky, 0, 0); // from here on: full-res coordinates
      drawStrands(b, T, W, H, S, hx, hy);
      drawSun(b, T, W, H, S, sx, sy);
      if (T < 98.3) {
        drawSeaField(b, T, env, sky, stm);
        drawTowers(b, T, env, sky, stm, hx, hy);
      }
      drawHeroCloud(b, T, env, hx, hy, P, stm);
      drawFog(b, T, env, hx, hy);
      drawHeroHalo(b, hx, hy, hr);
      b.setTransform(1, 0, 0, 1, 0, 0);
      b.drawImage(SKYC.n, 0, 0);
      g.drawImage(BG.c, 0, 0, BG.w, BG.h, 0, 0, W, H);

      /* ================= full-res sparkle layer: glints, birds, vapour, drops, hero ================= */
      drawVapour(g, T, W, H, S, hx, hy);
      drawSeaGlints(g, T, W, H, S);
      drawBirds(g, T, W, H, S);
      drawDrops(g, T, W, H, S, hx, hy);
      drawHero(g, hx, hy, hr);
      drawRain(g, T, W, H, S);
    },
  });

  /* ------------------------------------------------------------------ sky strip */
  function paintSky(b, sky) {
    const h = SKYC.h, d = SKYC.img.data;
    let k = 0;
    for (let j = 0; j < h; j++) {
      const t = (j + 0.5) / h;
      while (k < 6 && t > SKY_STOPS[k + 1]) k++;
      const t0 = SKY_STOPS[k], t1 = SKY_STOPS[k + 1];
      const f = t <= t0 ? 0 : t >= t1 ? 1 : (t - t0) / (t1 - t0);
      const a = sky[k], c = sky[k + 1];
      const dz = (u.hash2(j, 5) - 0.5) * 1.1; // 1-level dither against banding
      const o = j * 4;
      d[o] = a[0] + (c[0] - a[0]) * f + dz; d[o + 1] = a[1] + (c[1] - a[1]) * f + dz; d[o + 2] = a[2] + (c[2] - a[2]) * f + dz; d[o + 3] = 255;
    }
    SKYC.x.putImageData(SKYC.img, 0, 0);
    b.drawImage(SKYC.c, 0, 0, 1, h, 0, 0, BG.w, BG.h);
  }

  /* ------------------------------------------------------------------ sun */
  // sun halo + crepuscular rays from cached sprites (source-over with warm alpha: cheap, reads as light)
  const beamSprite = () => u.sprite('s4_beam', 64, 256, (c, w, h) => {
    const gx = c.createLinearGradient(0, 0, w, 0);
    gx.addColorStop(0, 'rgba(255,238,200,0)'); gx.addColorStop(0.25, 'rgba(255,238,200,0.35)'); gx.addColorStop(0.5, 'rgba(255,238,200,1)');
    gx.addColorStop(0.75, 'rgba(255,238,200,0.35)'); gx.addColorStop(1, 'rgba(255,238,200,0)');
    c.fillStyle = gx; c.fillRect(0, 0, w, h);
    c.globalCompositeOperation = 'destination-in';
    const gy = c.createLinearGradient(0, h, 0, 0); // the sun (origin) is at the bottom of the sprite
    gy.addColorStop(0, 'rgba(0,0,0,1)'); gy.addColorStop(0.5, 'rgba(0,0,0,0.5)'); gy.addColorStop(1, 'rgba(0,0,0,0)');
    c.fillStyle = gy; c.fillRect(0, 0, w, h);
  });
  // The sun's halo and crepuscular rays are baked once (half-res) and just blitted, shifted to the sun's position.
  let SUNB = null;
  function bakeSun(S) {
    const Lx = S * 0.9, Rx = S * 1.85, Uy = S * 1.85, Dy = S * 0.9;
    const w = Math.ceil((Lx + Rx) * CS), h = Math.ceil((Uy + Dy) * CS);
    const c = u.canvas(w, h), x = c.getContext('2d');
    x.setTransform(CS, 0, 0, CS, 0, 0);
    const ox = Lx, oy = Uy;
    const R = S * 0.85;
    const hg = x.createRadialGradient(ox, oy, 0, ox, oy, R);
    hg.addColorStop(0, 'rgba(255,232,168,0.55)'); hg.addColorStop(0.12, 'rgba(255,222,150,0.38)');
    hg.addColorStop(0.4, 'rgba(255,214,150,0.14)'); hg.addColorStop(0.72, 'rgba(255,214,160,0.04)'); hg.addColorStop(1, 'rgba(255,214,160,0)');
    x.fillStyle = hg; x.fillRect(ox - R, oy - R, R * 2, R * 2);
    const bs = beamSprite();
    const nb = 7;
    for (let i = 0; i < nb; i++) {
      const f = i / (nb - 1);
      const ang = -1.3 + f * 1.12;
      const wd = 0.05 + 0.05 * u.noise1(i * 3.1 + 5);
      const len = S * (1.2 + 0.6 * u.noise1(i * 1.7));
      const a = (0.1 + 0.14 * u.noise1(i * 2.3 + 0.5)) * (1 - 0.3 * abs(f - 0.4));
      x.save();
      x.translate(ox, oy);
      x.rotate(ang + Math.PI / 2);          // beam sprite points "up", origin at its bottom centre
      x.globalAlpha = a * 0.8;
      x.drawImage(bs, -len * wd, -len, len * wd * 2, len);
      x.restore();
    }
    SUNB = { c, ox, oy, w: w / CS, h: h / CS };
  }
  function drawSun(g, T, W, H, S, sx, sy) {
    const sa = sunPow(T);
    if (sa < 0.04 || !SUNB) return;
    g.globalAlpha = min(1, sa * (0.88 + 0.12 * sin(T * 0.9)));
    g.drawImage(SUNB.c, sx - SUNB.ox, sy - SUNB.oy, SUNB.w, SUNB.h);
    g.globalAlpha = 1;
  }

  /* ------------------------------------------------------------------ strands */
  function drawStrands(g, T, W, H, S, hx, hy) {
    const sp = wispSprite();
    const a0 = (1 - ss(88, 95, T));
    if (a0 < 0.01) return;
    g.save();
    const n = strands.length;
    const cm = cam(T);
    const dawnW = dawn(T);
    for (let i = 0; i < n; i++) {
      const s = strands[i];
      const par = 0.12 + 0.5 * s.q;
      let y = (s.q + cm * par * S / H) % 1.1; // slide down with the ascent
      y = (y < 0 ? y + 1.1 : y) - 0.05;
      const x = u.wrap(s.x + T * s.sp, -0.5, 1.5) * W;
      const w = s.w * W * (0.7 + s.q * 0.7), h = max(2, s.h * S * (1.2 + 0.8 * s.q));
      const fadeEdge = ss(-0.05, 0.08, y) * (1 - ss(0.9, 1.04, y));
      // never let a strand line up with the hero (it would read as a lens streak off the drop)
      const clear = abs(y * H - hy) / S > 0.1 ? 1 : ss(0.025, 0.1, abs(y * H - hy) / S);
      g.globalAlpha = s.a * 0.5 * (0.75 + 0.25 * sin(T * 0.2 + s.ph)) * a0 * fadeEdge * clear;
      g.drawImage(sp, x - w / 2, y * H - h / 2, w, h);
    }
    g.restore();
  }

  /* ------------------------------------------------------------------ glints */
  function drawSeaGlints(g, T, W, H, S) {
    const e = ss(78, 83, T) * (1 - ss(88, 95, T));
    if (e < 0.01) return;
    const sp = sparkSprite(46);
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < seaGl.length; i++) {
      const o = seaGl[i];
      if (o.conv && T >= o.s) continue;
      seaGlintPos(o, T, DP);
      if (DP.x < 0 || DP.x > W || DP.y < 0 || DP.y > H) continue;
      const tw = 0.35 + 0.65 * pow(max(0, sin(T * o.f * 1.8 + o.ph)), 3);
      const fa = (o.conv ? 1 : 1 - ss(o.fadeT - 3, o.fadeT, T)) * e * tw * (0.55 + 0.45 * o.z);
      if (fa < 0.02) continue;
      const r = S * 0.026 * (0.6 + 0.6 * o.z) * (0.5 + 0.5 * tw);
      g.globalAlpha = min(1, fa);
      g.drawImage(sp, DP.x - r, DP.y - r, r * 2, r * 2);
    }
    g.restore();
  }

  /* ------------------------------------------------------------------ birds */
  function drawBirds(g, T, W, H, S) {
    const t0 = 79.0, t1 = 94;
    if (T < t0 - 2 || T > t1 + 2) return;
    const lx = W * (1.14 - (T - 80) * 0.082);
    const ly = H * (0.3 - (T - 80) * 0.006) + sin(T * 0.5) * 0.008 * H;
    g.save();
    g.lineCap = 'round'; g.lineJoin = 'round';
    for (let i = 0; i < birds.length; i++) {
      const b = birds[i];
      const bx = lx + b.ox * S * 1.0 + (i >= 9 ? 0 : 0) * 0, by = ly + b.oy * S * 1.0 + sin(T * 0.9 + b.ph) * 0.004 * S;
      if (bx < -S * 0.1 || bx > W + S * 0.1) continue;
      const w = S * 0.017 * b.s;
      const flap = sin(T * b.f * TAU * 0.5 + b.ph) * (0.6 + 0.4 * sin(T * 0.45 + b.ph2));
      const tipY = -flap * w * 0.75;
      const a = 0.78 * (i >= 9 ? 0.6 : 1);
      g.strokeStyle = `rgba(78,70,112,${a})`;
      g.lineWidth = max(1, S * 0.0026 * b.s);
      g.beginPath();
      g.moveTo(bx - w * (1 - 0.2 * abs(flap)), by + tipY);
      g.quadraticCurveTo(bx - w * 0.45, by + tipY * 0.6 - w * 0.34, bx, by);
      g.quadraticCurveTo(bx + w * 0.45, by + tipY * 0.6 - w * 0.34, bx + w * (1 - 0.2 * abs(flap)), by + tipY);
      g.stroke();
    }
    g.restore();
  }

  /* ------------------------------------------------------------------ hero cloud */
  const RING_T = [87.6, 89.6, 91.4, 93.0];
  const HCG = { Rc: 0, wx: 1, fade: 1, lift: 0 };
  function heroGeom(T, env, P) {
    const { S } = env;
    HCG.wx = (env.portrait ? 0.82 : 1) * (1 + 0.45 * clamp(env.aspect - 1.3, 0, 1.2));
    HCG.Rc = S * (0.04 + 0.5 * pow(P, 1.15)) + S * 1.3 * pow(ss(93.6, 98.4, T), 1.2);
    HCG.fade = 1 - ss(95.4, 97.1, T);
    HCG.lift = -ss(94, 100, T) * 0.05 * S;
    return HCG;
  }
  function drawHeroCloud(g, T, env, hx, hy, P, stm) {
    const { W, H, S } = env;
    if (P < 0.004 || T > 96.7) return;
    const cv = CV.hero, x = cv.x;
    clearCV(cv);
    const { Rc, wx, fade: fadeAll, lift } = heroGeom(T, env, P);
    // once the cloud fills the view every puff is a screen-sized blend: draw every other one, a little denser
    const stride = Rc > S * 0.45 ? 2 : 1, boost = stride > 1 ? 1.22 : 1;
    for (let i = 0; i < heroPuffs.length; i += stride) {
      const p = heroPuffs[i];
      drawHeroPuff(cv, p, T, hx, hy + lift, Rc, wx, P, min(1, fadeAll * boost), W, H);
    }
    // sun-lit crown rim (additive, on the canvas so it stays cloud-shaped)
    const dw = dawn(T) * (1 - stm);
    if (dw > 0.02 && cv.x1 > cv.x0) {
      x.globalCompositeOperation = 'lighter';
      const spr = u.glowSprite(44, 90, 80, 'soft');
      for (let i = 0; i < heroPuffs.length; i += 3) {
        const p = heroPuffs[i];
        if (p.rho < 0.55 || p.x * 0.6 + p.y * 0.8 > -0.1) continue;
        const g_ = ss(p.rho * 0.62, p.rho * 0.62 + 0.38, P * 1.15);
        const px = hx + p.x * Rc * wx - p.r * Rc * 0.45, py = hy + lift + p.y * Rc - p.r * Rc * 0.5;
        const rr = p.r * Rc * 0.55;
        x.globalAlpha = 0.5 * dw * g_ * fadeAll;
        x.drawImage(spr, px - rr, py - rr, rr * 2, rr * 2);
      }
      x.globalAlpha = 1; x.globalCompositeOperation = 'source-over';
    }
    if (stm > 0.005) tint(cv, 'rgb(98,114,140)', stm * 0.8);
    blit(g, cv, W, H, 1);
    // growth pulses: soft rings of light leave the core each time a wave of drops arrives
    {
      const ring = u.glowSprite(44, 70, 82, 'ring');
      g.save();
      for (let k = 0; k < RING_T.length; k++) {
        const q = (T - RING_T[k]) / 1.9;
        if (q < 0 || q > 1) continue;
        const rr = S * (0.06 + 0.5 * (1 - pow(1 - q, 2)));
        g.globalAlpha = 0.5 * (1 - q) * (1 - q) * (1 - ss(92, 95, T));
        g.drawImage(ring, hx - rr, hy - rr, rr * 2, rr * 2);
      }
      g.restore();
    }
    // a soft pocket of shade around the drop, so its light reads against the white cloud
    {
      const sh = pow(P, 0.8) * ss(85.5, 88.5, T) * (1 - ss(94, 96.5, T)) * 0.62;
      if (sh > 0.01) {
        const rr = S * (0.09 + 0.17 * P);
        g.globalAlpha = sh;
        g.drawImage(shadeSprite(), hx - rr, hy - rr, rr * 2, rr * 2);
        g.globalAlpha = 1;
      }
    }
  }
  function drawHeroPuff(cv, p, T, hx, hy, Rc, wx, P, fadeAll, W, H) {
    const gi = ss(p.rho * 0.62, p.rho * 0.62 + 0.38, P * 1.15);
    if (gi < 0.012) return;
    const br = 1 + 0.035 * sin(T * 0.55 + p.ph);
    const px = hx + (p.x * Rc * wx) * br + sin(T * 0.3 + p.ph) * 0.008 * Rc;
    const py = hy + p.y * Rc * br + sin(T * 0.37 + p.ph * 1.4) * 0.008 * Rc;
    const r = p.r * Rc * (0.35 + 0.65 * gi) * (wx > 1 ? 1 + (wx - 1) * 0.35 : 1);
    if (px + r * 1.22 < 0 || px - r * 1.22 > W || py + r * 1.22 < 0 || py - r * 1.22 > H) return;
    const st = stageFor(px, py, T, 0.3 * (-p.x) + 0.3 * (-p.y));
    puff(cv, px, py, r, st, p.v, p.rho < 0.3 ? 0 : p.rho < 0.5 ? min(p.b, 1) : p.b, 0.96 * gi * fadeAll, p.sy);
  }
  // thin stratus sheets and cumulus we rise past (76-88): drawn into the cloud-sea canvas, behind the hero
  function drawNear(cv, T, env, hx, hy) {
    const { W, H, S } = env;
    if (T > 88.5) return;
    const cm = cam(T);
    const wisp = wispSprite();
    const x = cv.x;
    for (let i = 0; i < nearBands.length; i++) {
      const b = nearBands[i];
      const cy = (b.yc * H) + (cm - cam(b.Tc)) * S * b.pz;
      const wpx = b.w * S;
      const cx = b.xf * W + sin(T * 0.15 + b.ph) * 0.02 * W;
      let fa = b.a * ss(76.8, 81.5, T) * (1 - ss(84, 88, T));
      if (fa < 0.01) continue;
      // while the hero is still pinned in the clear dawn sky, keep passing clouds off the drop
      if (T < 85) {
        const ex = max(0, abs(cx - hx) - wpx * 0.5) / S, ey = max(0, abs(cy - hy) - wpx * 0.2) / S;
        fa *= 1 - (1 - ss(0.02, 0.2, hypot(ex, ey))) * (1 - ss(80, 85, T));
        if (fa < 0.01) continue;
      }
      if (b.sheet) {
        const hh = wpx * 0.2;
        if (cy - hh > H || cy + hh < 0) continue;
        x.globalAlpha = fa;
        const w2 = W * 1.5;
        x.drawImage(wisp, cx - w2 / 2, cy - hh, w2, hh * 2);
        if (cx - w2 / 2 < cv.x0) cv.x0 = cx - w2 / 2;
        if (cx + w2 / 2 > cv.x1) cv.x1 = cx + w2 / 2;
        if (cy - hh < cv.y0) cv.y0 = cy - hh;
        if (cy + hh > cv.y1) cv.y1 = cy + hh;
        continue;
      }
      if (cy - wpx * 0.5 > H || cy + wpx * 0.5 < 0) continue;
      if (b.img) placeImg(cv, b.img, cx, cy + wpx * 0.12, 1, fa);
    }
  }

  /* ------------------------------------------------------------------ drops */
  const hxy = { x: 0, y: 0 };
  function drawDrops(g, T, W, H, S, hx, hy) {
    if (T > 96.5) return;
    g.save();
    g.globalCompositeOperation = 'lighter';
    const spk = sparkSprite(46), spkC = sparkSprite(190);
    for (let pass = 0; pass < 2; pass++) {
      const list = pass === 0 ? motes : seaGl;
      for (let i = 0; i < list.length; i++) {
        const m = list[i];
        if (pass === 1 && !m.conv) continue; // plain sea glints are drawn elsewhere
        if (!m.conv || T < m.s) {
          if (pass === 1) continue;
          const fadeOut = m.conv ? 1 : 1 - ss(m.fadeT - 4, m.fadeT, T);
          if (fadeOut < 0.01) continue;
          moteAnchor(m, T, DP);
          if (DP.x < -10 || DP.x > W + 10 || DP.y < -10 || DP.y > H + 10) continue;
          const tw = 0.6 + 0.4 * sin(T * 1.4 + m.ph * 3);
          const a = 0.5 * tw * (0.4 + 0.6 * m.z) * fadeOut * (1 + 0.5 * ss(m.s - 1.5, m.s, T) * (m.conv ? 1 : 0));
          const r = S * (0.0028 + 0.0045 * m.z);
          g.globalAlpha = a > 1 ? 1 : a;
          g.drawImage(m.mspr, DP.x - r, DP.y - r, r * 2, r * 2);
          continue;
        }
        const q = (T - m.s) / m.dur;
        if (q > 1) continue;
        // in flight along its spiral: the comet tail of every drop goes into ONE batched path per hue (a handful of strokes per frame)
        dropPath(m, q, hx, hy, DP);
        const px = DP.x, py = DP.y;
        const arr = 1 - ss(0.9, 1, q);
        const grow = ss(0, 0.18, q);
        // a soft comet tail: one fading glow blob behind the head
        if (grow * arr > 0.1) {
          const ga = grow * arr;
          const rr = S * (0.0085 + 0.007 * m.z) * (0.6 + 0.4 * grow);
          dropPath(m, max(0, q - 0.05), hx, hy, hxy);
          g.globalAlpha = 0.6 * ga;
          g.drawImage(m.spr, hxy.x - rr, hxy.y - rr, rr * 2, rr * 2);
        }
        const rs = S * (0.022 + 0.011 * m.z) * (0.45 + 0.55 * grow);
        g.globalAlpha = min(1, 0.9 * (0.3 + 0.7 * grow) * arr);
        g.drawImage(m.cy > 100 ? spkC : spk, px - rs, py - rs, rs * 2, rs * 2);
      }
    }
    g.restore();
  }

  /* ------------------------------------------------------------------ hero */
  // the arrival pings (each drop that reaches the hero makes its glow swell for a moment)
  function pulseAt(T) {
    if (T > 96.5) return 0;
    let p = 0;
    for (let pass = 0; pass < 2; pass++) {
      const list = pass === 0 ? motes : seaGl;
      for (let i = 0; i < list.length; i++) {
        const m = list[i];
        if (!m.conv) continue;
        const e = T - m.s - m.dur;
        if (e > 0) p += exp(-e * 2.2);
      }
    }
    return min(p, 6);
  }
  const HS = { m: 0, pul: 1, hue: 48, sat: 90, glow: 1, ao: 1, ad: 0 };
  function heroState(T, pulse) {
    const m = ss(93, 97.5, T); // orb -> teardrop
    HS.m = m;
    HS.pul = 1 + 0.06 * sin(T * 2.4);
    HS.hue = lerp(PIN_IN.hue, PIN_OUT.hue, ss(91, 97.5, T));
    const kk = ss(91, 97.5, T);
    HS.sat = clamp(lerp(90, 30, sin(Math.PI * kk)), 20, 95);
    // in the open sky / against the white cloud the halo is eased right down (the core stays crisp); in the grey it settles at 0.7
    const dd = lerp(0.5 + 0.18 * ss(84, 88, T), 0.3, ss(93.5, 98.4, T));
    HS.glow = (1 + min(0.35, pulse * 0.05)) * (1 - dd * ss(76.5, 79, T));
    HS.ao = m < 0.97 ? (m > 0.001 ? 1 - m * 0.6 : 1) : 0;
    HS.ad = m > 0.001 ? m : 0;
    return HS;
  }
  // the two big soft halos of the hero are drawn into the half-res background (same recipe as Anim.hero.draw): 4x cheaper
  function drawHeroHalo(b, hx, hy, hr) {
    const R = hr * HS.pul, a = HS.ao + HS.ad, gl = HS.glow;
    u.glow(b, hx, hy, R * 18, HS.hue, HS.sat, 58, 0.2 * a * gl, 'soft');
    u.glow(b, hx, hy, R * 7, HS.hue, HS.sat, 62, 0.5 * a * gl, 'soft');
  }
  function drawHero(g, hx, hy, hr) {
    // glow: ~0 => hero.draw skips its two big halos (drawn above in the half-res layer); the crisp core is drawn here
    if (HS.ao > 0) hero.draw(g, hx, hy, hr, { hue: HS.hue, sat: HS.sat, form: 'orb', a: HS.ao, pulse: HS.pul, glow: 0.0001 });
    if (HS.ad > 0) hero.draw(g, hx, hy, hr, { hue: HS.hue, sat: HS.sat, form: 'drop', a: HS.ad, pulse: HS.pul, glow: 0.0001, angle: 0 });
  }

  /* ------------------------------------------------------------------ vapour column (B3): the hero's own rising motes */
  const moteSprite = () => u.sprite('s4_mote', 32, 32, (c) => {
    const g = c.createRadialGradient(16, 16, 0, 16, 16, 16);
    g.addColorStop(0, 'rgba(255,252,240,1)'); g.addColorStop(0.28, 'rgba(255,244,214,0.9)'); g.addColorStop(0.55, 'rgba(255,228,170,0.28)'); g.addColorStop(1, 'rgba(255,220,150,0)');
    c.fillStyle = g; c.fillRect(0, 0, 32, 32);
  });
  const VAPN = 90;
  function drawVapour(g, T, W, H, S, hx, hy) {
    const e = 1 - ss(76, 83, T);
    if (e < 0.01) return;
    const len = hy + S * 0.05;
    const spr = moteSprite();
    g.save();
    g.globalCompositeOperation = 'lighter';
    for (let i = 0; i < VAPN; i++) {
      const m = vap[i];
      const s = u.wrap(m.u + T * 0.05 * m.v * S / len, 0, 1);
      const y = hy - s * len;
      const x = hx + (m.dx * (0.02 + 0.075 * s) + sin(T * 0.7 + m.ph) * 0.008) * S;
      const tw = 0.55 + 0.45 * sin(T * 1.9 + m.ph * 3);
      const a = e * tw * (0.95 - 0.5 * s) * ss(0.0, 0.06, s) * (1 - ss(0.86, 1, s)) * m.w;
      if (a < 0.02) continue;
      const r = S * 0.0105 * m.sz * (1 - 0.3 * s);
      g.globalAlpha = a > 1 ? 1 : a;
      g.drawImage(spr, x - r, y - r, r * 2, r * 2);
    }
    g.restore();
  }

  /* ------------------------------------------------------------------ fog */
  const FOGK_TOP = [[94.0, rgb('#8d9db6')], [95.2, rgb('#7788a3')], [96.2, rgb('#5f7491')], [97.2, rgb('#485e7c')], [98.1, rgb('#34465f')]];
  const FOGK_BOT = [[94.0, rgb('#a9b7ca')], [95.2, rgb('#9aa9bf')], [96.2, rgb('#8aa0b8')], [97.2, rgb('#7890aa')], [98.1, rgb('#6d8199')]];
  function ck(keys, T) {
    const n = keys.length;
    if (T <= keys[0][0]) return keys[0][1];
    if (T >= keys[n - 1][0]) return keys[n - 1][1];
    let i = 0;
    while (T > keys[i + 1][0]) i++;
    let s = (T - keys[i][0]) / (keys[i + 1][0] - keys[i][0]);
    return mixc(keys[i][1], keys[i + 1][1], s); // linear: no plateau at the keys, the darkening is one even ramp
  }
  // silent lightning inside the cloud: ONE smooth flash (~0.25 s up, ~0.5 s down) with a long soft afterglow, no flicker.
  // NOTE: s5_rain.js carries a numerically identical copy (the B4 window contains it) - keep them in sync.
  function flashAmt(T) {
    if (T < 98.65 || T > 101.7) return 0;
    const t0 = 98.7, tp = 99.35; // start / peak
    let v;
    if (T < tp) { const q = (T - t0) / (tp - t0); v = q <= 0 ? 0 : q * q * (3 - 2 * q); }
    else { const dt = T - tp; v = 0.58 * exp(-pow(dt / 0.5, 1.7)) + 0.42 * exp(-pow(dt / 1.2, 1.4)); }
    return 0.45 * v * (1 - ss(100.9, 101.7, T));
  }
  function drawFog(g, T, env, hx, hy) {
    const { W, H, S } = env;
    const prog = ss(94.0, 97.4, T);
    if (prog < 0.003 || !FOG) return;
    const top = ck(FOGK_TOP, T), bot = ck(FOGK_BOT, T);
    const { w, h, img } = FOG, d = img.data;
    const asp = W / H;
    const fl = flashAmt(T);
    const bil = ss(95.5, 98.2, T);
    const fxn = (hx / W + 0.12) * asp * 1.0, fyn = 0.3;
    const drift = T * 0.026, drift2 = T * 0.05;
    for (let j = 0; j < h; j++) {
      const ny = j / (h - 1);
      for (let i = 0; i < w; i++) {
        const nx = (i / (w - 1)) * asp;
        const v = u.fbm2(nx * 1.6 + 3.1 + T * 0.006, ny * 1.6 + drift, 2);
        const v2 = u.noise2(nx * 0.9 + 11 - T * 0.004, ny * 0.9 + drift * 0.7);
        const a = clamp((prog * 2.3 - (ny * 0.7 + (1 - v) * 0.6)) / 0.5, 0, 1);
        // great dark masses rolling upward past the hero: the cloud has started to fall
        const bm = ss(0.4, 0.72, u.fbm2(nx * 0.8 + 5.2, ny * 0.8 + drift2, 3));
        const lum = 0.86 + 0.28 * v + 0.1 * (v2 - 0.5) + bil * 0.36 * (0.2 - bm);
        let r = lerp(top[0], bot[0], ny) * lum, gg = lerp(top[1], bot[1], ny) * lum, b = lerp(top[2], bot[2], ny) * lum;
        if (fl > 0.002) {
          const dx = nx - fxn, dy = (ny - fyn) / asp * 1.2;
          const f = fl * exp(-(dx * dx + dy * dy) * 2.4) * (0.3 + 1.2 * v * v + 0.4 * bm);
          r += 40 * f; gg += 46 * f; b += 84 * f;
        }
        const o = (j * w + i) * 4;
        d[o] = r > 255 ? 255 : r; d[o + 1] = gg > 255 ? 255 : gg; d[o + 2] = b > 255 ? 255 : b; d[o + 3] = a * 255;
      }
    }
    FOG.x.putImageData(img, 0, 0);
    g.imageSmoothingEnabled = true;
    g.drawImage(FOG.c, 0, 0, W, H);
    // a slow breathing glow about the drop, and dark vapour tendrils streaming past it
    const ga = ss(95, 97.8, T) * (0.05 + 0.07 * (0.5 + 0.5 * sin(T * 1.25)));
    if (ga > 0.01) { const rr = S * 0.3; g.globalCompositeOperation = 'lighter'; g.globalAlpha = ga; g.drawImage(u.glowSprite(208, 55, 72, 'soft'), hx - rr, hy - rr, rr * 2, rr * 2); g.globalAlpha = 1; g.globalCompositeOperation = 'source-over'; }
    const te = ss(96.6, 99, T);
    if (te > 0.01) {
      const ts = tendrilSprite();
      for (let i = 0; i < tendrils.length; i++) {
        const t = tendrils[i];
        const ty = u.wrap(t.y - T * 0.045 * t.v * S / H, -0.4, 1.4);
        const tx = hx + (t.x * 0.55 + sin(T * 0.25 + t.ph) * 0.04) * S + (t.x > 0 ? 0.05 : -0.05) * S;
        const tw = S * t.w * 1.9, th = S * t.h;
        g.globalAlpha = 0.5 * te * t.a * (0.8 + 0.2 * sin(T * 0.5 + t.ph));
        g.drawImage(ts, tx - tw / 2, ty * H - th / 2, tw, th);
      }
      g.globalAlpha = 1;
    }
    // flash bloom covering a good part of the frame
    if (fl > 0.01) {
      const fx = hx + S * 0.22, fy = hy - S * 0.2, R = S * 1.05;
      const gr = g.createRadialGradient(fx, fy, 0, fx, fy, R);
      gr.addColorStop(0, `rgba(215,225,255,${0.4 * fl})`); gr.addColorStop(0.4, `rgba(175,192,245,${0.22 * fl})`); gr.addColorStop(1, 'rgba(150,170,230,0)');
      g.globalCompositeOperation = 'lighter';
      g.fillStyle = gr;
      g.fillRect(fx - R, fy - R, R * 2, R * 2);
      g.globalCompositeOperation = 'source-over';
    }
  }
  const tendrilSprite = () => u.sprite('s4_tendril', 48, 160, (c, w, h) => {
    c.save(); c.translate(w / 2, h / 2); c.scale(w / h, 1);
    const g = c.createRadialGradient(0, 0, 0, 0, 0, h / 2);
    g.addColorStop(0, 'rgba(26,40,66,0.8)'); g.addColorStop(0.3, 'rgba(28,42,68,0.5)'); g.addColorStop(0.65, 'rgba(30,44,70,0.17)'); g.addColorStop(1, 'rgba(30,44,70,0)');
    c.fillStyle = g; c.fillRect(-h / 2, -h / 2, h, h); c.restore();
  });

  /* ------------------------------------------------------------------ rain */
  function drawRain(g, T, W, H, S) {
    const e = 0.012 * ss(95.5, 98, T) + 0.085 * ss(98, 101.5, T); // faint start of the rain: fades in over ~3 s from 98
    if (e < 0.004) return;
    g.save();
    g.fillStyle = '#d6e2f2';
    const n = rain.length;
    for (let i = 0; i < n; i++) {
      const r = rain[i];
      // the streaks come in one by one: a drop's own start time, so the shower builds
      const vis = ss(95.8 + r.id * 4.6, 96.8 + r.id * 4.6, T);
      if (vis < 0.02) continue;
      const y = u.wrap(r.y + T * r.sp * 0.55 * S / H, -0.15, 1.1);
      const l = r.l * S * r.z;
      g.globalAlpha = e * r.z * vis;
      g.fillRect(r.x * W, y * H, max(1.6, S * 0.0022 * r.z), l);
    }
    g.restore();
  }
})();

</script>
<script>/* src/scenes/s5_rain.js */
/* ひとしずくの旅 — s5_rain (T 98–126) 雨
 *
 * 98–104  inside the heavy grey cloud (handoff B4: same fog field as s4), the first rain streaks.
 * ~104    the cloud base opens: a vast rainy landscape appears below — six layers of ridges in atmospheric
 *         perspective, a forest valley with a silver river winding to a thin sea on the horizon, a warm rim of
 *         sunlight under the cloud at the right, light shafts through the rain.  The camera falls with the drop.
 * 108–114 a faint rainbow blooms in the rain.
 * 112–118 plunge through the forest canopy: wet leaf clusters sweep upward, ring ripples where the drop touches.
 * 117–122 through the ground: strata, roots, grains, rain-beads sinking; the world decelerates and the drop
 *         hovers at (.5,.56) above the dim seed (handoff B5).
 *
 * Pure function of T: the fall is an analytic velocity profile integrated into a table at load time; streaks,
 * glints, leaves and beads are all f(seed, T).  Static art is pre-rendered into offscreen canvases in resize().
 */
(function () {
  'use strict';
  const { util: u, hero } = Anim;
  const TAU = Math.PI * 2;
  const sin = Math.sin, cos = Math.cos, abs = Math.abs, min = Math.min, max = Math.max, sqrt = Math.sqrt,
    exp = Math.exp, pow = Math.pow, floor = Math.floor, ceil = Math.ceil, PI = Math.PI;
  const ss = u.smoothstep, clamp = u.clamp, lerp = u.lerp, rgb = u.rgb, mixc = u.mixc;
  const KS = (k, T) => u.keys(k, T, 'spline');
  const CSS = (c, a) => `rgba(${c[0] | 0},${c[1] | 0},${c[2] | 0},${a})`;

  const PIN_IN = hero.pins.find((p) => p.to === 's5_rain') || { x: 0.5, y: 0.4, r: 0.015, hue: 205, form: 'drop' };
  const PIN_OUT = hero.pins.find((p) => p.from === 's5_rain') || { x: 0.5, y: 0.56, r: 0.014, hue: 200, form: 'drop' };

  /* ------------------------------------------------------------------ the fall (analytic, tabulated) */
  // camera fall speed in S/s (for the depth plane p = 1)
  // (eased off from ~115.4 on, so the drop visibly slows as the ground comes up to meet it)
  const VC = [[96, 0], [102, 0], [103.5, 0.03], [105, 0.07], [107, 0.13], [109, 0.22], [111, 0.34], [113, 0.55], [114.6, 0.71], [115.8, 0.66],
    [117, 0.46], [118.3, 0.3], [119.7, 0.16], [121, 0.06], [122, 0.0], [130, 0]];
  const vcam = (T) => max(0, KS(VC, T));
  // on-screen vertical speed of the rain streaks (S/s at depth 1, + = down). It starts as s4's gentle downpour, and as the drop
  // drops away from the rain it turns into a steady upward rush (the drop falls faster than the rain).
  const VYR = [[96, 0.5], [102, 0.5], [103.6, 0.22], [104.6, -0.02], [105.4, -0.14], [107, -0.2], [109, -0.28], [111, -0.4], [113, -0.55], [115, -0.7],

    if (T < 98.65 || T > 101.7) return 0;

    return { c, h, row: d.yTop * H - top, ay: d.yTop * H, p: d.p, g: d.g, solid: d.solid, d };
  }

  // valley floor with forest and the river
  function riverX(env, d) {
    const { W, S } = env, cx = W / 2, Wm = min(W, 1.7 * S);
    return cx + Wm * (0.17 * d * sin(d * 5.0 + 0.5) + 0.05 * d * sin(d * 11.5 + 1.4) + 0.012 * sin(d * 23));
  }
  function riverHW(env, d) { const S = env.S; return S * (0.0022 + 0.019 * pow(d, 1.35)); }

  function buildValley(env) {
    const { W, H, S } = env, cx = W / 2;
    const K = 0.5;
    const yh = 0.5 * H, vTop = 0.528 * H, vBot = H + 0.4 * S;
    const h = ceil(vBot - vTop);
    const dOf = (y) => (y - yh) / (H - yh);
    const { c, x } = mkLayerCanvas(W, h);
    x.translate(0, -vTop);
    const sPos0 = (y) => (y - vTop) / (vBot - vTop);
    const gr0 = x.createLinearGradient(0, vTop, 0, vBot);
    gr0.addColorStop(0, '#8fa7a2'); gr0.addColorStop(sPos0(0.62 * H), '#5e8878'); gr0.addColorStop(sPos0(0.8 * H), '#3b6a52'); gr0.addColorStop(sPos0(H), '#244f38'); gr0.addColorStop(1, '#183a27');
    x.fillStyle = gr0; x.fillRect(0, vTop, W, vBot - vTop);
    {
      const r0 = u.rng(7002), arr = [];
      for (let y = vTop + 1; y < vBot;) {
        const dd = dOf(y);
        const ts = S * (0.0069 + 0.0325 * pow(max(dd, 0), 1.4));
        const nx = floor(W / (ts * 0.8));
        for (let i = 0; i < nx; i++) {
          const px = (i + r0()) * (W / nx), py = y + r0() * ts * 0.45;
          const rcx = riverX(env, dd), rhw = riverHW(env, dd) * 1.5 + ts * 0.5;
          if (abs(px - rcx) < rhw) continue;
          if (r0() < 0.12) continue;
          arr.push([px, py, ts]);
        }
        y += ts * 0.5;
      }
      const nb = 10, pal = [];
      for (let b2 = 0; b2 < nb; b2++) {
        const t = b2 / (nb - 1);
        const dk = mixc(mixc(rgb('#6f908c'), rgb('#2f5e4e'), pow(t, 0.7)), rgb('#122e1e'), pow(max(0, t - 0.55) / 0.45, 1.2));
        const lt = mixc(mixc(rgb('#9dbab0'), rgb('#5d9376'), pow(t, 0.8)), rgb('#3a7a4e'), pow(max(0, t - 0.6) / 0.4, 1));
        pal.push(treeSet(dk, mixc(lt, dk, 0.5)));
      }
      for (const [px, py, ts] of arr) {
        const dd = dOf(py), b2 = clamp(floor(dd / 1.5 * nb), 0, nb - 1);
        const w = ts * (0.8 + r0() * 0.5), h = ts * (1.3 + r0() * 0.7), tb = tBucket(r0());
        stamp(x, (r0() < 0.3 ? pal[b2].round : pal[b2].cone)[tb], px, py, w, h);
      }
    }
    const r = u.rng(7001);
    // meadow / field patches
    for (let i = 0; i < 40; i++) {
      const py = vTop + pow(r(), 1.5) * (H - vTop) * 1.1, d = dOf(py);
      const rx = (0.03 + r() * 0.1) * S * (0.4 + d), ry = rx * (0.18 + r() * 0.12);
      const px = r() * W;
      const rg = x.createRadialGradient(px, py, 0, px, py, rx);
      const lit = r() < 0.5 ? '170,200,128' : '140,186,128';
      rg.addColorStop(0, `rgba(${lit},0.22)`); rg.addColorStop(1, `rgba(${lit},0)`);
      x.save(); x.translate(px, py); x.scale(1, ry / rx); x.translate(-px, -py);
      x.fillStyle = rg; x.fillRect(px - rx, py - rx, rx * 2, rx * 2); x.restore();
    }
    // river
    const pts = [];
    for (let y = vTop; y <= vBot; y += 2) { const d = dOf(y); pts.push([riverX(env, d), y, riverHW(env, d)]); }
    RIVER = { pts, vTop };
    const sPos = (y) => (y - vTop) / (vBot - vTop);
    // a sky-tinted ribbon: it tapers toward the horizon, is translucent (the forest shows through), and melts into the mist at both ends
    x.fillStyle = 'rgba(14,40,34,0.2)';
    x.beginPath();
    for (const p of pts) x.lineTo(p[0] - p[2] * 1.7, p[1]);
    for (let i = pts.length - 1; i >= 0; i--) x.lineTo(pts[i][0] + pts[i][2] * 1.7, pts[i][1]);
    x.closePath(); x.fill();
    const rg = x.createLinearGradient(0, vTop, 0, vBot);
    rg.addColorStop(0, 'rgba(214,224,228,0)'); rg.addColorStop(sPos(0.545 * H), 'rgba(206,220,228,0.42)'); rg.addColorStop(sPos(0.62 * H), 'rgba(176,200,214,0.6)');
    rg.addColorStop(sPos(H), 'rgba(132,166,188,0.74)'); rg.addColorStop(1, 'rgba(120,156,180,0.78)');
    x.fillStyle = rg;
    x.beginPath();
    for (const p of pts) x.lineTo(p[0] - p[2], p[1]);
    for (let i = pts.length - 1; i >= 0; i--) x.lineTo(pts[i][0] + pts[i][2], pts[i][1]);
    x.closePath(); x.fill();
    x.globalCompositeOperation = 'source-atop';
    const wr = x.createLinearGradient(W, 0, W * 0.3, 0);
    wr.addColorStop(0, 'rgba(255,214,150,0.30)'); wr.addColorStop(1, 'rgba(255,214,150,0)');
    x.fillStyle = wr; x.fillRect(0, vTop, W, vBot - vTop);
    const hz = x.createLinearGradient(0, vTop, 0, 0.7 * H);
    hz.addColorStop(0, 'rgba(176,186,194,0.22)'); hz.addColorStop(1, 'rgba(176,186,194,0)');
    x.fillStyle = hz; x.fillRect(0, vTop, W, 0.7 * H - vTop);
    // melt the top edge of the plate into the mist (no ruler-straight horizon)
    x.globalCompositeOperation = 'destination-out';
    const tf = x.createLinearGradient(0, vTop, 0, vTop + 0.07 * H);
    tf.addColorStop(0, 'rgba(0,0,0,1)'); tf.addColorStop(1, 'rgba(0,0,0,0)');
    x.fillStyle = tf; x.fillRect(0, vTop, W, 0.07 * H);
    return { c, h, row: 0, ay: vTop, p: 0.1, solid: null, vTop };
  }

  // foreground tree-tops (solid dark green once we are inside).  Built at half resolution and always blitted with smoothing
  // (it swells while the camera falls, and a nearest-neighbour blit would crawl).
  function buildTreeTops(env) {
    const { W, H, S } = env;
    const K = 0.5;
    const yb = 0.93 * H, band = 0.4 * S;
    const top = yb - 0.05 * S, bottom = yb + 0.5 * S;
    const h = ceil(bottom - top);
    const deep = rgb('#0f2619');
    const { c, x } = mkLayerCanvas(W, h, K);
    const sxk = c.width / W, syk = c.height / h;
    // mask: a bumpy upper edge, solid below
    x.translate(0, -top);
    x.fillStyle = '#000';
    x.beginPath(); x.moveTo(-4, bottom + 2);
    for (let px = -4; px <= W + 4; px += 4) {
      const xs = px / S;
      const e = (u.fbm1(xs * 5.5 + 3, 4) - 0.5) * 0.07 + (u.fbm1(xs * 17, 2) - 0.5) * 0.025;
      x.lineTo(px, yb + e * S);
    }
    x.lineTo(W + 4, bottom + 2); x.closePath(); x.fill();
    x.setTransform(1, 0, 0, 1, 0, 0);
    const cA = rgb('#0c2617'), cB = deep, lA = rgb('#4a8556'), lB = rgb('#235232');
    paintCanopy(c, {
      cs: (y) => S * (0.03 + 0.012 * clamp((top + y / syk - yb) / band, 0, 1.5)) * syk,
      cols: (y) => {
        const t = clamp((top + y / syk - yb) / band, 0, 1);
        const a = mixc(cA, cB, pow(t, 0.7) * 0.95), b = mixc(lA, lB, pow(t, 0.6));
        return [a[0], a[1], a[2], b[0], b[1], b[2]];
      },
      contrast: 0.85,
      sk: S * sxk,
    });
    x.setTransform(sxk, 0, 0, syk, 0, 0);
    // everything well below the band becomes solid deep green
    const sg = x.createLinearGradient(0, yb - top + band * 0.55, 0, bottom - top);
    sg.addColorStop(0, 'rgba(15,38,25,0)'); sg.addColorStop(1, 'rgba(15,38,25,1)');
    x.fillStyle = sg; x.fillRect(0, yb - top + band * 0.55, W, bottom - top);
    x.globalCompositeOperation = 'source-atop';
    const ag = x.createLinearGradient(0, 0, 0, yb - top + 0.12 * S);
    ag.addColorStop(0, 'rgba(150,182,176,0.16)'); ag.addColorStop(1, 'rgba(150,182,176,0)');
    x.fillStyle = ag; x.fillRect(0, 0, W, yb - top + 0.2 * S);
    const wr = x.createRadialGradient(W * 0.96, yb - top, 0, W * 0.96, yb - top, min(W * 0.45, S * 0.3));
    wr.addColorStop(0, 'rgba(255,214,150,0.24)'); wr.addColorStop(1, 'rgba(255,214,150,0)');
    x.fillStyle = wr; x.fillRect(0, 0, W, h);
    return { c, h, row: yb - top, ay: yb, p: 0.3, g: 0.1, solid: CSS(deep, 1) };
  }

  /* ------------------------------------------------------------------ soil */
  function rootPath(x, r, x0, y0, ang, len, wid, alpha, depth) {
    const segs = 14;
    let px = x0, py = y0, a = ang;
    const pts = [[px, py]];
    for (let i = 0; i < segs; i++) {
      a += (r() - 0.5) * 0.7;
      const l = len / segs;
      px += sin(a) * l; py += cos(a) * l;
      pts.push([px, py]);
    }
    for (let i = 0; i < segs; i++) {
      const t = i / segs;
      x.strokeStyle = `rgba(222,208,170,${alpha * (1 - t * 0.6)})`;
      x.lineWidth = max(0.7, wid * (1 - t * 0.8));
      x.beginPath(); x.moveTo(pts[i][0], pts[i][1]);
      x.lineTo(pts[i + 1][0], pts[i + 1][1]); x.stroke();
      if (depth < 2 && i > 2 && r() < 0.15) rootPath(x, r, pts[i][0], pts[i][1], a + (r() < 0.5 ? -1 : 1) * (0.7 + r() * 0.6), len * (0.35 + r() * 0.25), wid * 0.6, alpha * 0.8, depth + 1);
    }
  }
  // The strata strip: grass above the line, then banded earth fading into the flat deep-earth colour at rEnd.  Built at half
  // resolution (soft, and it only ever scrolls past); the flat B5 world below it (specks, roots, seed) is drawn live.
  function buildSoil(env) {
    const { W, H, S } = env;
    const rs = RS_H * H, rEnd = ceil((GTOT - GSURF0 + RS_H) * H);
    const { c, x } = mkLayerCanvas(W, rEnd + 2);
    const r = u.rng(5151);
    const sc = S / 720;
    // grass / fern blades above the surface
    for (let i = 0; i < 300; i++) {
      const px = r() * W, hgt = (0.02 + pow(r(), 2) * 0.12) * H, bend = (r() - 0.5) * hgt * 0.7, wd = (0.004 + r() * 0.008) * S;
      const g0 = 8 + r() * 14;
      x.fillStyle = `rgba(${g0 * 0.6 | 0},${(g0 * 2.2) | 0},${(g0 * 1.2) | 0},0.96)`;
      x.beginPath(); x.moveTo(px - wd, rs + 4); x.quadraticCurveTo(px - wd * 0.3 + bend * 0.2, rs - hgt * 0.5, px + bend, rs - hgt); x.quadraticCurveTo(px + wd * 0.3 + bend * 0.2, rs - hgt * 0.5, px + wd, rs + 4); x.fill();
    }
    // earth
    const eg = x.createLinearGradient(0, rs, 0, rEnd);
    eg.addColorStop(0, '#1d150f'); eg.addColorStop(0.04, '#3a281b'); eg.addColorStop(0.5, '#33241a'); eg.addColorStop(1, '#271b14');
    x.fillStyle = eg; x.fillRect(0, rs, W, rEnd - rs + 2);
    // strata: soft-edged wavy bands that run past both screen edges
    const X0 = -24, X1 = W + 24;
    let y = rs + 0.05 * H, bi = 0;
    while (y < rEnd + 0.05 * H) {
      const th = (0.06 + r() * 0.12 + bi * 0.01) * H, ph = r() * 9, f = 1.5 + r() * 2.5, am = (0.006 + r() * 0.02) * H;
      const t = clamp((y - rs) / (rEnd - rs), 0, 1);
      const tone = [[74, 52, 34], [58, 40, 28], [88, 62, 40], [46, 32, 24], [66, 48, 36], [98, 74, 50], [70, 56, 44]][floor(r() * 7)];
      const dark = lerp(1, 0.5, t), fadeK = 1 - 0.85 * ss(0.45, 1.05, t);
      const cc = `${tone[0] * dark | 0},${tone[1] * dark | 0},${tone[2] * dark | 0}`, al = 0.62 * fadeK;
      const gr = x.createLinearGradient(0, y - am * 1.2, 0, y + th + am * 1.2);
      gr.addColorStop(0, `rgba(${cc},0)`); gr.addColorStop(0.2, `rgba(${cc},${al})`); gr.addColorStop(0.8, `rgba(${cc},${al})`); gr.addColorStop(1, `rgba(${cc},0)`);
      x.fillStyle = gr;
      x.beginPath();
      for (let px = X0; px <= X1; px += 12) { const yy = y + am * sin(px / S * f + ph) + (u.noise1(px / S * 3 + ph) - 0.5) * am; px > X0 ? x.lineTo(px, yy) : x.moveTo(px, yy); }
      for (let px = X1; px >= X0; px -= 12) { const yy = y + th + am * sin(px / S * f + ph + 1.1) + (u.noise1(px / S * 3 + ph + 5) - 0.5) * am; x.lineTo(px, yy); }
      x.closePath(); x.fill();
      y += th; bi++;
    }
    const hg = x.createLinearGradient(0, rs, 0, rs + 0.07 * H);
    hg.addColorStop(0, 'rgba(8,10,6,0.95)'); hg.addColorStop(1, 'rgba(8,10,6,0)');
    x.fillStyle = hg; x.fillRect(0, rs, W, 0.07 * H);
    // moisture blotches (dark) and sandy glints (light)
    for (let i = 0; i < 110; i++) {
      const px = r() * W, py = rs + r() * (rEnd - rs), rad = (0.04 + r() * 0.1) * S;
      const dk = r() < 0.75;
      const rg = x.createRadialGradient(px, py, 0, px, py, rad);
      rg.addColorStop(0, dk ? 'rgba(10,6,4,0.2)' : 'rgba(150,115,80,0.09)'); rg.addColorStop(1, dk ? 'rgba(10,6,4,0)' : 'rgba(150,115,80,0)');
      x.fillStyle = rg; x.fillRect(px - rad, py - rad, rad * 2, rad * 2);
    }
    // stones and pebbles (irregular, softly lit from above-right)
    for (let i = 0; i < 260; i++) {
      const big = r() < 0.04;
      const px = r() * W, py = rs + 0.06 * H + r() * (rEnd - rs - 0.35 * H), rw = (big ? 0.014 + r() * 0.02 : 0.004 + pow(r(), 2) * 0.01) * S;
      const dk = lerp(1, 0.5, clamp((py - rs) / (rEnd - rs), 0, 1)), b0 = 70 + r() * 56, rot = r() * 3, flat = 0.5 + r() * 0.35;
      const nPts = 9, pts = [];
      for (let q = 0; q < nPts; q++) { const a2 = (q / nPts) * TAU, rr = rw * (0.78 + 0.45 * r()); pts.push([cos(a2) * rr, sin(a2) * rr * flat]); }
      x.save(); x.translate(px, py); x.rotate(rot);
      x.beginPath();
      for (let q = 0; q < nPts; q++) { const p0 = pts[q], p1 = pts[(q + 1) % nPts]; const mx = (p0[0] + p1[0]) / 2, my = (p0[1] + p1[1]) / 2; q ? x.quadraticCurveTo(p0[0], p0[1], mx, my) : x.moveTo(mx, my); }
      x.closePath();
      const rg = x.createRadialGradient(-rw * 0.3, -rw * flat * 0.4, rw * 0.1, 0, 0, rw * 1.1);
      rg.addColorStop(0, `rgba(${b0 * 1.2 * dk | 0},${b0 * 0.98 * dk | 0},${b0 * 0.74 * dk | 0},0.9)`); rg.addColorStop(1, `rgba(${b0 * 0.5 * dk | 0},${b0 * 0.4 * dk | 0},${b0 * 0.3 * dk | 0},0.9)`);
      x.fillStyle = rg; x.fill();
      x.restore();
    }
    // roots
    for (let i = 0; i < 9; i++) {
      rootPath(x, r, (0.05 + 0.9 * (i + r() * 0.6) / 9) * W, rs + 0.01 * H, (r() - 0.5) * 0.6, (0.5 + r() * 0.9) * H, (1.8 + r() * 1.8) * sc, 0.3, 0);
    }
    // grains
    for (let i = 0; i < 3600; i++) {
      const px = r() * W, py = rs + r() * (rEnd - rs);
      const dk = lerp(1, 0.4, clamp((py - rs) / (rEnd - rs), 0, 1));
      x.fillStyle = `rgba(${150 * dk | 0},${118 * dk | 0},${86 * dk | 0},${0.1 + r() * 0.26})`;
      const sz = (1.8 + r() * 2.2) * max(1, sc); x.fillRect(px, py, sz, sz);
    }
    // rain seeping down: faint cool threads with tiny beads
    for (let i = 0; i < 20; i++) {
      const px0 = r() * W, py0 = rs + r() * 0.6 * H, len = (0.15 + r() * 0.4) * H;
      x.strokeStyle = `rgba(150,200,230,${0.03 + r() * 0.045})`; x.lineWidth = (1.2 + r() * 1.2) * sc;
      x.beginPath(); x.moveTo(px0, py0);
      let qx = px0;
      for (let j = 1; j <= 10; j++) { qx += (r() - 0.5) * 22 * sc; x.lineTo(qx, py0 + len * j / 10); }
      x.stroke();
      for (let j = 0; j < 2 + floor(r() * 3); j++) {
        const by = py0 + r() * len;
        x.fillStyle = `rgba(190,225,245,${0.2 + r() * 0.3})`;
        x.beginPath(); x.arc(qx, by, (1.8 + r() * 2.4) * sc, 0, TAU); x.fill();
      }
    }
    // wet shine along the surface + rootlets hanging
    const sg = x.createLinearGradient(0, rs - 6, 0, rs + 8);
    sg.addColorStop(0, 'rgba(170,205,170,0)'); sg.addColorStop(0.45, 'rgba(190,220,180,0.3)'); sg.addColorStop(1, 'rgba(190,220,180,0)');
    x.fillStyle = sg; x.fillRect(0, rs - 6, W, 14);
    for (let i = 0; i < 150; i++) {
      const px = r() * W, l = (0.01 + r() * 0.05) * H;
      x.strokeStyle = `rgba(215,205,170,${0.22 + r() * 0.28})`; x.lineWidth = 1.5 * max(1, sc);
      x.beginPath(); x.moveTo(px, rs + 2); x.quadraticCurveTo(px + (r() - 0.5) * 14, rs + l * 0.5, px + (r() - 0.5) * 22, rs + l); x.stroke();
    }
    // strata fade to the flat deep-earth colour (the B5 world)
    const f0 = max(rs, rEnd - 0.62 * H);
    const tg = x.createLinearGradient(0, f0, 0, rEnd);
    tg.addColorStop(0, 'rgba(26,18,16,0)'); tg.addColorStop(0.55, 'rgba(26,18,16,0.12)'); tg.addColorStop(0.85, 'rgba(26,18,16,0.5)'); tg.addColorStop(1, 'rgba(26,18,16,1)');
    x.fillStyle = tg; x.fillRect(0, f0, W, rEnd - f0);
    x.fillStyle = '#1a1210'; x.fillRect(0, rEnd - 1, W, 4);
    return { c, rs, rEnd, full: rEnd + 2 };
  }

  // the flat B5 world: specks, a few dim roots and the unlit seed; all positions are relative to the top of the flat region
  function buildFlat(env) {
    const { W, H, S } = env;
    const sc = max(1, S / 720), r2 = u.rng(6262), r = u.rng(8181);
    // specks, bucketed by (alpha, lightness) so each bucket is one fill
    const NB = 12, bk = [];
    for (let i = 0; i < NB; i++) bk.push({ a: 0.1 + (floor(i / 3) + 0.5) / 4 * 0.26, lt: 0.4 + 0.6 * (0.2 + 0.3 * (i % 3)), x: [], y: [], s: [] });
    for (let i = 0; i < 900; i++) {
      const px = r2() * W, yn = r2(), sz = (0.8 + r2() * 1.6) * sc, a = r2();
      const k2 = bk[min(3, floor(a * 4)) * 3 + min(2, floor((1 - yn) * 3))];
      k2.x.push(px); k2.y.push(yn * H); k2.s.push(sz);
    }
    for (const b of bk) { b.fill = `rgba(${130 * b.lt | 0},${98 * b.lt | 0},${72 * b.lt | 0},${b.a})`; }
    // roots
    const roots = [];
    for (const [fx, ang, ln] of [[0.16, 0.25, 0.46], [0.82, -0.3, 0.52], [0.66, 0.1, 0.34], [0.33, -0.2, 0.3]]) {
      const pts = [[fx * W, -0.02 * H]];
      let px = pts[0][0], py = pts[0][1], a = ang;
      const segs = 22;
      for (let i = 0; i < segs; i++) { a += (r2() - 0.5) * 0.5; px += sin(a) * ln * H / segs; py += cos(a) * ln * H / segs; pts.push([px, py]); }
      roots.push(pts);
    }
    return { bk, roots, sc, seedY: 0.66 * H, rx: 0.0165 * S, ry: 0.025 * S };
  }

  /* ------------------------------------------------------------------ scene */

  /* ------------------------------------------------------------------ pre-rendered atmosphere (all blitted 1:1) */
  function glowE(g, x, y, rx, ry, h, s, l, a, kind) {
    g.save(); g.translate(x, y); g.scale(1, ry / rx); u.glow(g, 0, 0, rx, h, s, l, a, kind); g.restore();
  }

  function buildSky(env) {
    const { W, H, S } = env;
    const pad = ceil(0.08 * H), hs = ceil(0.62 * H);
    const { c, x } = mkLayerCanvas(W, hs);
    const gr = x.createLinearGradient(0, 0, 0, H * 0.53);
    for (const [p, col] of SKY_STOPS) gr.addColorStop(p, col);
    x.fillStyle = gr; x.fillRect(0, 0, W, H * 0.53 + 1);
    x.fillStyle = '#bdb3a4'; x.fillRect(0, H * 0.53, W, hs - H * 0.53);
    const hg2 = x.createLinearGradient(0, 0, W, 0);
    hg2.addColorStop(0, 'rgba(34,52,82,0.34)'); hg2.addColorStop(0.55, 'rgba(34,52,82,0.08)'); hg2.addColorStop(1, 'rgba(255,190,130,0.06)');
    x.fillStyle = hg2; x.fillRect(0, 0, W, H * 0.53);
    const sx = W * 0.9, sy = H * 0.488;
    glowE(x, sx, sy, S * 0.95, S * 0.2, 24, 85, 48, 0.5);
    glowE(x, sx, sy, S * 0.5, S * 0.07, 34, 90, 58, 0.5);
    glowE(x, sx - S * 0.05, sy, S * 0.26, S * 0.03, 42, 85, 70, 0.4);
    return { c, pad, h: hs, H: H + pad };
  }

  function buildClouds(env) {
    const { W, H, S } = env;
    const P = ceil(W * 1.5), h = ceil(0.5 * H);
    const { c, x } = mkLayerCanvas(P, h, 0.25);
    const cd = cloudDarkSprite();
    for (const b of CLOUDB) {
      const bw = b.w * S, bh = b.h * S, bx = b.x * P, by = b.y * H;
      x.globalAlpha = b.a * 0.7;
      for (const o of [-P, 0, P]) x.drawImage(cd, bx + o - bw * 0.5, by - bh * 0.5, bw, bh);
    }
    x.globalAlpha = 1;
    return { c, P, h };
  }

  function buildRainbow(env) {
    const { W, H, S } = env;
    const R = min(0.72 * S, W * 0.6), cxr = W * 0.16, cyr = H > W ? H * 0.19 + R * 1.06 : H * 0.88;
    const left = max(0, floor(cxr - R * 1.3)), right = min(W, ceil(cxr + R * 1.3)), top = max(0, floor(cyr - R * 1.3));
    const w = right - left, h = ceil(cyr - top);
    const { c, x } = mkLayerCanvas(w, h);
    x.translate(-left, -top);
    const A = 1;
    let rg = x.createRadialGradient(cxr, cyr, R * 0.72, cxr, cyr, R * 1.18);
    rg.addColorStop(0, 'rgba(210,220,255,0)'); rg.addColorStop(0.5, 'rgba(214,226,250,0.06)'); rg.addColorStop(1, 'rgba(210,220,255,0)');
    x.fillStyle = rg; x.fillRect(left, top, w, h);
    rg = x.createRadialGradient(cxr, cyr, R * 0.84, cxr, cyr, R * 1.03);
    rg.addColorStop(0, 'rgba(150,100,255,0)');
    rg.addColorStop(0.13, `rgba(140,100,235,${0.34 * A})`);
    rg.addColorStop(0.3, `rgba(70,140,240,${0.40 * A})`);
    rg.addColorStop(0.46, `rgba(70,200,150,${0.40 * A})`);
    rg.addColorStop(0.62, `rgba(240,225,90,${0.44 * A})`);
    rg.addColorStop(0.8, `rgba(250,150,80,${0.42 * A})`);
    rg.addColorStop(0.93, `rgba(235,80,90,${0.30 * A})`);
    rg.addColorStop(1, 'rgba(235,80,90,0)');
    x.fillStyle = rg; x.fillRect(left, top, w, h);
    rg = x.createRadialGradient(cxr, cyr, R * 1.15, cxr, cyr, R * 1.27);
    rg.addColorStop(0, 'rgba(255,120,120,0)'); rg.addColorStop(0.3, 'rgba(255,170,130,0.07)'); rg.addColorStop(0.55, 'rgba(160,230,190,0.07)'); rg.addColorStop(0.8, 'rgba(130,150,255,0.07)'); rg.addColorStop(1, 'rgba(130,150,255,0)');
    x.fillStyle = rg; x.fillRect(left, top, w, h);
    return { c, left, top, cyr, w, h };
  }

  function buildShafts(env) {
    const { W, H, S } = env;
    const top = floor(0.36 * H), h = ceil(H - top);
    const spr = shaftSprite();
    const { c, x } = mkLayerCanvas(W, h);
    x.globalCompositeOperation = 'lighter';
    for (const sh of SHAFT) {
      const ang = 0.18 + sh.a * 0.78, len = H * (1.15 + 0.2 * sh.a), wd = S * sh.w;
      x.save(); x.translate(W * 0.9, H * 0.47 - top); x.rotate(ang);
      x.globalAlpha = sh.al * 0.6;
      x.drawImage(spr, -wd * 0.5, 0, wd, len);
      x.restore();
    }
    return { c, top, h };
  }

  function buildCurtains(env) {
    const { W, H, S } = env;
    const spr = curtainSprite(), out = [];
    for (const [ws, hs] of [[0.55, 0.5], [0.8, 0.62], [1.05, 0.72]]) {
      const w = ceil(ws * S), h = ceil(hs * H), sk = 0.14, cw = ceil(w + sk * h);
      const { c, x } = mkLayerCanvas(cw, h);
      x.transform(1, 0, -sk, 1, sk * h + 0, 0);
      x.drawImage(spr, 0, 0, w, h);
      out.push({ c, w: cw, h });
    }
    // a warm, sun-lit rain curtain near the break in the cloud
    {
      const w = ceil(0.5 * S), h = ceil(0.6 * H), sk = 0.14, cw = ceil(w + sk * h);
      const { c, x } = mkLayerCanvas(cw, h);
      x.transform(1, 0, -sk, 1, sk * h, 0);
      x.drawImage(spr, 0, 0, w, h);
      x.setTransform(c.width / cw, 0, 0, c.height / h, 0, 0);
      x.globalCompositeOperation = 'source-atop';
      const wg = x.createLinearGradient(0, 0, 0, h);
      wg.addColorStop(0, 'rgba(255,226,170,1)'); wg.addColorStop(1, 'rgba(255,200,140,0.6)');
      x.fillStyle = wg; x.fillRect(0, 0, cw, h);
      out.warm = { c, w: cw, h };
    }
    return out;
  }

  function buildMist(env) {
    const { W, H, S } = env;
    const spr = u.glowSprite(205, 18, 92, 'soft'), out = [];
    for (let k = 0; k < 2; k++) {
      const P = ceil(W * 1.6), h = ceil(0.22 * S);
      const { c, x } = mkLayerCanvas(P, h, 0.25);
      const r = u.rng(4100 + k * 17);
      for (let i = 0; i < 4; i++) {
        const bw = (0.5 + r() * 0.6) * S, bx = r() * P, by = h * (0.35 + r() * 0.3);
        x.globalAlpha = 0.16 + r() * 0.14;
        for (const o of [-P, 0, P]) x.drawImage(spr, bx + o - bw * 0.6, by - bw * 0.11, bw * 1.2, bw * 0.22);
      }
      out.push({ c, P, h, y: k ? 0.8 : 0.62, sp: k ? 0.012 : 0.007, p: k ? 0.2 : 0.12 });
    }
    return out;
  }

  function buildFlare(env) {
    const { W, H, S } = env;
    const top = floor(0.12 * H), h = ceil(0.72 * H);
    const { c, x } = mkLayerCanvas(W, h, 0.25);
    glowE(x, W * 0.9, H * 0.48 - top, S * 1.4, S * 0.5, 34, 90, 55, 1);
    return { c, top, h };
  }

  function buildLeaves(env) {
    const { S, H } = env;
    const lf = 1 + 0.3 * clamp(H / S - 1, 0, 1);
    const scratch = u.canvas(Math.ceil(0.4 * S * lf / 2.2) + 8, Math.ceil(0.4 * S * lf / 2.2) + 8);
    const mk = (tone, sizes, shapes, res, blur) => sizes.map((sz) => { const px = max(24, round(sz * S * lf)); return shapes.map((v) => leafCanvas(v, tone, px, res, blur, scratch)); });
    const sh = [0, 1, 2, 3, 4, 5];
    return {
      back: (() => { const one = mk(0, [0.38], sh, 1, 2.2)[0]; return [one, one]; })(),
      mid: mk(1, [0.42, 0.58], sh, 1, 0),
      front: mk(2, [0.8], sh.slice(0, 5), 0.25, 0),
    };
  }
  const round = Math.round;

  /* ------------------------------------------------------------------ scene */
  let FLARE = null, SKY = null, CLOUDS = null, RB = null, SH = null, CUR = null, MIST = null, LEAFS = null;

  Anim.defineScene({
    id: 's5_rain',

    init(env) {
      ensureTables();
      T_SURF = 117.9;
      for (let t = 114; t < 121; t += 0.01) if (groundSurfH(t) <= heroY(t)) { T_SURF = t; break; }
      const r = u.rng(5005);
      RAIN = RAINDEF.map((D) => {
        const n = D.n * 2;
        const o = { n, x: new Float32Array(n), y: new Float32Array(n), sv: new Float32Array(n), l: new Float32Array(n), w: new Float32Array(n), warm: new Uint8Array(n) };
        for (let i = 0; i < n; i++) {
          o.x[i] = r(); o.y[i] = r() * 1.5 - 0.3; o.sv[i] = 0.85 + r() * 0.3; o.l[i] = 0.55 + r() * 0.9; o.w[i] = 0.6 + r() * 0.8;
          o.warm[i] = o.x[i] > 0.6 + r() * 0.12 ? 1 : 0;
        }
        return o;
      });
      LEAFG = [0, 1, 2, 3, 4, 5].map(leafGeom);
      const rc = u.rng(7717);
      CL = [];
      const addLayer = (layer, n, t0, t1, nCls, nShape, p, extra) => {
        for (let i = 0; i < n; i++) {
          const tc = lerp(t0, t1, (i + rc() * 0.9) / n);
          CL.push({ layer, p, extra, x: -0.06 + rc() * 1.12, tc, v: floor(rc() * nShape), cls: i % nCls, ph: rc() * TAU, touch: -1, zc: Zf(tc), dy: (rc() - 0.5) * 0.1, sw: (rc() - 0.5) * 2 });
        }
      };
      addLayer(0, 14, 110.2, 117.4, 2, 6, 0.5, false);
      addLayer(1, 13, 111.0, 117.2, 2, 6, 1.0, false);
      addLayer(2, 4, 112.6, 116.0, 1, 5, 1.75, false);
      // extra clusters that only appear on tall (portrait) screens, where the leaves have more height to fill
      addLayer(0, 12, 110.4, 117.2, 2, 6, 0.5, true);
      addLayer(1, 10, 111.2, 117.0, 2, 6, 1.0, true);
      addLayer(2, 2, 113.4, 115.4, 1, 5, 1.75, true);
      TOUCH = [{ t: 113.35, dx: -0.04 }, { t: 114.75, dx: 0.035 }, { t: 115.85, dx: -0.03 }, { t: 116.85, dx: 0.04 }];
      TOUCH.forEach((tc, k) => {
        CL.push({ layer: 1, p: 1.0, x: 0.5, tc: tc.t, v: (k + 1) % 6, cls: 1, ph: k * 2.1, touch: k, zc: Zf(tc.t), dy: 0.0, sw: 0 });
      });
      SPL = [];
      for (let i = 0; i < 30; i++) SPL.push({ x: r(), d: 0.12 + pow(r(), 0.8) * 0.9, per: 0.6 + r() * 0.9, ph: r() * 5, big: r() < 0.25 ? 1 : 0 });
      GLINT = [];
      for (let i = 0; i < 20; i++) GLINT.push({ i: r(), ph: r() * TAU, f: 1.4 + r() * 2.6, sx: r() - 0.5 });
      BEADS = [];
      for (let i = 0; i < 36; i++) BEADS.push({ x: 0.05 + r() * 0.9, y: r() * 1.2, v: 0.025 + r() * 0.06, s: 0.5 + r() * 0.9, ph: r() * TAU });
      SPECK = [];
      for (let i = 0; i < 26; i++) SPECK.push({ x: r(), y: 0.05 + r() * 0.9, ph: r() * TAU, f: 0.4 + r() * 0.9 });
      MYC = [];
      for (let i = 0; i < 10; i++) MYC.push({ x: 0.06 + 0.88 * (i + r() * 0.8) / 10, y0: r(), len: 0.32 + r() * 0.34, amp: 0.012 + r() * 0.03, f: 0.9 + r() * 1.3, ph: r() * TAU, sp: 0.007 + r() * 0.011, al: 0.08 + r() * 0.07, w: 0.8 + r() * 0.8 });
      SHAFT = [
        { a: 0.30, w: 0.22, al: 0.24, ph: 0.2, sp: 0.22 }, { a: 0.52, w: 0.15, al: 0.2, ph: 1.9, sp: 0.17 },
        { a: 0.74, w: 0.26, al: 0.17, ph: 3.3, sp: 0.2 }, { a: 0.95, w: 0.13, al: 0.15, ph: 4.4, sp: 0.15 },
        { a: 0.12, w: 0.11, al: 0.18, ph: 5.1, sp: 0.19 },
      ];
      CURT = [];
      for (let i = 0; i < 6; i++) CURT.push({ x: r(), k: i % 3, al: 0.16 + r() * 0.12, sp: (r() - 0.5) * 0.012, lay: i < 2 ? 0 : i < 4 ? 1 : 2 });
      BOKEH = [];
      for (let i = 0; i < 16; i++) BOKEH.push({ x: r(), y: r(), r: 0.07 + r() * 0.15, hue: 80 + r() * 70, al: 0.07 + r() * 0.1, ph: r() * 5 });
      CLOUDB = [];
      for (let i = 0; i < 9; i++) CLOUDB.push({ x: r(), y: 0.08 + r() * 0.3, w: 0.5 + r() * 0.7, h: 0.1 + r() * 0.1, a: 0.5 + r() * 0.5 });
    },

    resize(env) {
      const { W, H, S } = env;
      const fh = 38, fw = clamp(Math.round(fh * W / H), 36, 80);
      const c = u.canvas(fw, fh);
      const mw = ceil(W / 4), mh = ceil(H / 4), mc = u.canvas(mw, mh), mx = mc.getContext('2d');
      mx.imageSmoothingEnabled = true; mx.imageSmoothingQuality = 'high';
      FOG = { c, x: c.getContext('2d'), w: fw, h: fh, img: c.getContext('2d').createImageData(fw, fh), m: mc, mx, mw, mh };
      const k = clamp((W / H) / (16 / 9), 0.55, 2.0);
      RAIN.forEach((o, li) => { o.n = min(o.x.length, floor(RAINDEF[li].n * k)); });
      LY = {};
      // on tall screens the far ranges are drawn taller and the valley floor narrower, so no flat horizon line shows
      const pk = clamp(H / S - 1, 0, 1.2), ampM = 1 + 0.8 * pk, swM = 1 - 0.45 * pk;
      const mk = (d) => buildRidge(env, Object.assign(d, { amp: d.amp * ampM, sw: d.sw * swM }));
      LY.L0 = mk({ cb: 0.49, amp: 0.21, f: 1.35, seed: 11, floor: 0.548, sw: 0.3, sx: 0.0, top: '#7a90ad', mid: '#a6b7cb', haze: '#c4cfda', span: 0.2, p: 0.02, rim: 1, trees: 0 });
      LY.L1 = mk({ cb: 0.525, amp: 0.17, f: 1.9, seed: 23, floor: 0.58, sw: 0.34, sx: 0.08, top: '#5a7595', mid: '#8aa1ba', haze: '#b2c1d0', span: 0.17, p: 0.035, rim: 0.9, trees: 0 });
      LY.L2 = mk({ cb: 0.565, amp: 0.13, f: 2.6, seed: 37, floor: 0.615, sw: 0.38, sx: -0.06, top: '#3f6483', mid: '#7494ab', haze: '#a2b6c6', span: 0.15, p: 0.06, rim: 0.8, trees: 1100, ts: 0.0052, tdark: '#6a8ca0', tlite: '#7fa0b0' });
      LY.V = buildValley(env);
      LY.W1 = buildWing(env, { yTop: 0.64, rise: 0.09, amp: 0.05, f: 2.6, seed: 51, hw0: 0.13, hwB: 0.62, pad: 0.38, top: '#4f7f77', mid: '#386a5f', bot: '#285445', tdark: '#2a5a4e', tlite: '#6a9c88', ts: 0.0086, tg: 0.5, round: 0.35, haze: 0.5, p: 0.16, rim: 0.9, solid: '#285445' });
      LY.W2 = buildWing(env, { yTop: 0.77, rise: 0.1, amp: 0.05, f: 2.2, seed: 67, hw0: 0.19, hwB: 0.6, pad: 0.38, top: '#356248', mid: '#27523a', bot: '#193b29', tdark: '#1b4430', tlite: '#4f8858', ts: 0.0135, tg: 0.5, round: 0.45, haze: 0.28, p: 0.24, rim: 0.7, solid: '#193b29' });
      LY.T = buildTreeTops(env);
      SOIL = buildSoil(env); FLAT = buildFlat(env);
      SKY = buildSky(env); CLOUDS = buildClouds(env); RB = buildRainbow(env); SH = buildShafts(env); CUR = buildCurtains(env);
      MIST = buildMist(env); FLARE = buildFlare(env); LEAFS = buildLeaves(env);
      for (const b of BOKEH) b.spr = u.glowSprite(b.hue, 60, 52);
    },

    fx(T, L) {
      return { bloom: u.keys([[98, 0.28], [102, 0.3], [105, 0.2], [111, 0.16], [116, 0.3], [122, 0.5], [126, 0.5]], T) + 0.2 * flashAmt(T) };
    },

    render(g, T, L, env) {
      const { W, H, S } = env;
      ensureTables();
      const Z = Zf(T);
      const hy = heroY(T) * H, hx = W * 0.5 + heroXoff(T) * S, hr = heroR(T) * S;

      g.fillStyle = '#34465f'; g.fillRect(0, 0, W, H);

      if (T > 101.9) {
        // the world starts a little low and rises into place as the cloud base lifts (no wipe: the land climbs out of the mist)
        const Zl = Z - 0.55 * (1 - u.smootherstep(103.0, 107.2, T));
        if (T < 114.8) {
          // the cloud still hides the upper part of the land: don't paint what the fog will cover anyway
          const cy0 = max(0, (fogEdge(T) - 0.46) * H);
          if (cy0 > 4) { g.save(); g.beginPath(); g.rect(0, cy0, W, H - cy0); g.clip(); }
          drawLandscape(g, T, env, Zl);

      }
